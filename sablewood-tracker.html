<title>Sablewood Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky bar (Fear · Contatore · Atti) / colonna principale a schede + colonna laterale Party & Dadi */
:root{
  --bg:#e4e7df; --paper:#f1f2ec; --ink:#1d2421; --muted:#5b665f; --line:#c3cabf;
  --moss:#3f5a48; --moss-soft:#d5dfd3;
  --hope:#a8741a; --hope-soft:#f0e2c2;
  --fear:#6a3f86; --fear-soft:#e5daee;
  --blood:#9b2f2a; --blood-soft:#f1d9d5;
  --ok:#2f6d43;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-read:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a;
  --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339;
  --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a;
  --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339;
  --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hope);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lab{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
@media (max-width:700px){.bar{position:static}.acts{margin-left:0}}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.45rem}
.brand span{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.meter{display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;cursor:pointer;font-family:var(--f-display);font-size:1rem}
.acts button.on{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.acts button.done{border-color:var(--moss);color:var(--moss)}

.fear-pips{display:flex;gap:3px;flex-wrap:wrap;max-width:260px}
.fp{width:15px;height:15px;transform:rotate(45deg);border:1.5px solid var(--fear);background:transparent;cursor:pointer;padding:0;border-radius:2px}
.fp.on{background:var(--fear)}
.counter{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:3px 8px}
.counter.live{border-color:var(--blood);background:var(--blood-soft)}
.counter .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;min-width:2ch;text-align:center}

/* page */
.page{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media (max-width:980px){.page{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.side{position:static}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hope)}
.main{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h3,.panel>h4{margin-bottom:8px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px dotted var(--muted);padding-bottom:4px;margin-top:6px}
.act-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.act-h .num{font-family:var(--f-mono);font-size:.8rem;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;letter-spacing:.08em}

.read{font-family:var(--f-read);font-size:1.08rem;line-height:1.55;background:var(--moss-soft);border-left:3px solid var(--moss);padding:12px 16px;border-radius:0 var(--r) var(--r) 0}
.read p{margin:0 0 .6em} .read p:last-child{margin:0}
.read .cue{font-family:var(--f-body);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--moss);font-weight:700;display:block;margin-bottom:4px}
.note{border-left:3px solid var(--hope);padding:8px 12px;background:var(--hope-soft);border-radius:0 var(--r) var(--r) 0}
.warn{border-left:3px solid var(--blood);padding:8px 12px;background:var(--blood-soft);border-radius:0 var(--r) var(--r) 0}
ul.tight{margin:4px 0;padding-left:20px} ul.tight li{margin:2px 0}

/* stat block */
.stat{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.stat-h{background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 12px;flex-wrap:wrap}
.stat-h b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.stat-h span{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.stat-b{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px}
.kv span b{font-weight:700}

/* pips */
.pips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.pip{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.pip.on{background:var(--ink);border-color:var(--ink)}
.pip.hp.on{background:var(--blood);border-color:var(--blood)}
.pip.st.on{background:var(--fear);border-color:var(--fear)}
.pip.hope{border-radius:3px;transform:rotate(45deg);width:14px;height:14px;margin:2px;border-color:var(--hope)}
.pip.hope.on{background:var(--hope)}
.pip.ar{border-radius:3px;border-color:var(--moss)}
.pip.ar.on{background:var(--moss)}
.pip.cd{width:24px;height:24px;border-color:var(--moss)}
.pip.cd.on{background:var(--moss);border-color:var(--moss)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-weight:500;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.hope{background:var(--hope-soft);border-color:var(--hope)}
.btn.fear{background:var(--fear-soft);border-color:var(--fear)}
.btn.bad{background:var(--blood-soft);border-color:var(--blood)}
.btn.ok{background:var(--moss-soft);border-color:var(--moss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:1px 7px;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;border:1px solid var(--line)}
.chip.fear{border-color:var(--fear);color:var(--fear)}
.chip.hope{border-color:var(--hope);color:var(--hope)}
.chip.bad{border-color:var(--blood);color:var(--blood)}
.chip.ok{border-color:var(--moss);color:var(--moss)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 7px;min-width:0}
input[type=number]{width:4.2em}
textarea{width:100%;resize:vertical}
label.inl{display:inline-flex;align-items:center;gap:5px;font-size:.92rem}

/* PC cards */
.pc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.pc.down{border-color:var(--blood)}
.pc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-top input.name{font-family:var(--f-display);font-size:1.15rem;border:0;background:transparent;padding:0;flex:1 1 120px}
.trk{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center}
.cond{display:flex;flex-wrap:wrap;gap:4px}
.cond button{border:1px dashed var(--line);background:none;border-radius:999px;font-size:.75rem;padding:0 8px;cursor:pointer;color:var(--muted)}
.cond button.on{border-style:solid;border-color:var(--blood);color:var(--blood);font-weight:700}

/* dice */
.dice-out{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.die{width:52px;height:52px;display:grid;place-items:center;font-family:var(--f-mono);font-size:1.35rem;font-weight:600;border-radius:8px;border:2px solid}
.die.h{border-color:var(--hope);background:var(--hope-soft)}
.die.f{border-color:var(--fear);background:var(--fear-soft)}
.die.d6{width:38px;height:38px;font-size:1rem;border-color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:1.35rem}
.verdict.h{color:var(--hope)} .verdict.f{color:var(--fear)} .verdict.c{color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.die.roll{animation:tumble .45s ease-out}}
@keyframes tumble{0%{transform:rotate(-90deg) scale(.6);opacity:.2}100%{transform:none;opacity:1}}

/* foes */
.foe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--paper)}
.foe.dead{opacity:.5}
.foe .acts2{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}

.log{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow:auto;font-size:.92rem}
.log div{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.log .t{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}

.out-card{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.out-card.hit{border-color:var(--hope);background:var(--hope-soft)}
.gen-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r);font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:700}
.rules h4{margin-top:10px}
.rules p{margin:4px 0}
.save-ind{font-size:.75rem;color:var(--muted)}
</style>

<header class="bar"><div class="bar-in" id="bar"></div></header>
<div class="page">
  <main class="main">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ dati della campagna ============ */
const ACTS=[
 {id:'1',n:'I',t:"Il peccato di Luna"},
 {id:'2',n:'II',t:"Gli Scarshade"},
 {id:'2.5',n:'II½',t:"La scorciatoia"},
 {id:'3',n:'III',t:"Hush"},
 {id:'4',n:'IV',t:"Il rinnovo del sigillo"},
 {id:'5',n:'V',t:"Ritorno a casa"}];

const TEMPLATES={
 strixwolf:{name:"Strixwolf",tier:"Tier 1 Solo",hp:8,stress:3,thr:[8,14],diff:14,atk:3,attack:"Morso Primordiale · Mischia · 1d10+4 mag",dmg:"1d10+4",
   motives:"Separare, isolare, aggirare, superare in manovra",
   feats:["<b>Caduta Letale.</b> Dopo aver colpito col Morso Primordiale, vola a distanza Vicina e lascia cadere il bersaglio. Se la caduta non viene impedita nella prossima azione dei PG, il bersaglio subisce 1d10+4 danni fisici all'atterraggio.",
          "<b>Fulmine a Catena — segna 1 Stress.</b> Attacca un nemico a distanza Vicina: 1d10+4 danni magici e ripeti l'attacco. Ogni ripetizione deve colpire un bersaglio non ancora colpito."]},
 luna:{name:"Luna (fata Wildborne)",tier:"PNG",hp:4,stress:3,thr:[6,12],diff:12,atk:0,attack:"—",dmg:"",motives:"Sopravvivere, rannicchiarsi per la paura, insultare i PG per il ritardo",feats:["Esperienze: Cacciatrice +4, Abitante del villaggio +4"]},
 scarshade:{name:"Scarshade",tier:"Tier 1 Bruiser",hp:6,stress:3,thr:[7,14],diff:13,atk:2,attack:"Prosciugavita · Lontano · 2d6+3 mag",dmg:"2d6+3",
   motives:"Vendicare instancabilmente gli Dèi Dimenticati",
   feats:["Esperienze: Immateriale +4, Percepire la Magia +4",
   "<b>Scavo nella Memoria.</b> Tiro d'attacco contro un bersaglio Vicino. Se riesce, lo Scarshade vola in Mischia e posa la mano sulla fronte del bersaglio: il giocatore descrive un momento terrificante dell'infanzia del PG. Poi 3d4+3 danni magici e il bersaglio diventa temporaneamente <i>Vulnerabile</i>.",
   "Finché i PG non attaccano uno shade, lo Scavo nella Memoria non infligge danni."]},
 elder:{name:"Anziano Halython",tier:"Tier 1 Social",hp:2,stress:4,thr:[6,null],diff:15,atk:0,attack:"—",dmg:"",motives:"Intimidire gli estranei, proteggere i paesani",
   feats:["<b>Diffidente.</b> Se un PG fallisce un tiro d'azione contro l'Anziano, il PG segna 1 Stress. Altrimenti l'Anziano segna 1 Stress.","Con 4 Stress l'Anziano si arrende."]},
 villager:{name:"Paesano Preoccupato",tier:"Tier 1 Minion",hp:1,stress:0,thr:[null,null],diff:9,atk:0,attack:"Pugnali · Mischia · 2 fis",dmg:"2",minion:true,
   feats:["<b>Gregario.</b> Sconfitto da qualunque danno. Ogni 3 danni inflitti, sconfiggi un Gregario aggiuntivo a portata.","<b>Attacco di Gruppo — spendi 1 Paura.</b> Tutti i Paesani a distanza Vicina si muovono in Mischia e fanno un tiro d'attacco condiviso. Se riesce, 2 danni fisici ciascuno (somma)."]},
 skeleton:{name:"Scheletro Antico",tier:"Tier 1 Standard",hp:2,stress:1,thr:[7,null],diff:10,atk:0,attack:"Spada Arrugginita · Mischia · 1d6+1 fis",dmg:"1d6+1",
   feats:["<b>Prosciuga Magia.</b> Assorbe energia da un bersaglio a distanza Molto Vicina: tiro reazione Presenza. Se fallisce: 1d6+1 danni magici e perde 1 Speranza."]},
 hero:{name:"Eroe Dimenticato",tier:"Tier 1 Leader",hp:5,stress:3,thr:[8,13],diff:13,atk:2,attack:"Lama Spettrale · Mischia · 1d6+3 mag",dmg:"1d6+3",
   feats:["<b>Tormenta — segna 1 Stress.</b> Scegli un bersaglio e metti sotto i riflettori qualsiasi numero di Scheletri Antichi a distanza Vicina: vanno in Mischia e fanno un tiro d'attacco condiviso. Se riesce, 4 danni fisici ciascuno (somma).",
   "<b>Possessione — segna 1 Stress.</b> Possiede temporaneamente un bersaglio Vicino, a meno che superi un tiro reazione Presenza. Il posseduto può solo provare a liberarsi; l'Eroe non può essere attaccato. Quando metti l'Eroe sotto i riflettori puoi far agire il posseduto al suo posto (se usa un'abilità che costa Speranza, spendi Paura). Liberato, il bersaglio acquisisce ricordi di un'epoca dimenticata."]}
};

const OBSTACLES=["Una pozza di fango","Radici giganti alte sei metri","Una chiazza di muschio scivoloso","Felci rigogliose","Uno sciame di mosche-topo","Una ragnatela gigante di ragno-gatto"];
const COMPLICATIONS=["Rampicanti animati dalla magia afferrano la gamba di un PG","Un albero grida di dolore quando un PG ci salta sopra, cogliendolo di sorpresa","Una nube di spore luccicanti si alza dai funghi giganti, accecando il gruppo"];
const UNDERTOW=["Il PG segna 1 Stress","Il PG subisce 2d6+3 danni fisici","Il PG mette in deposito (vault) una carta dominio a scelta (ritira se non ne ha)","Un oggetto che il PG porta affonda sul fondo del fiume (ritira se non ne ha)"];
const TREASURES=[["Stivali del Camminalago","cammini sull'acqua come su terreno soffice"],["Pietra del Fascino","spendi 1 Speranza per camuffarti magicamente da qualcuno che hai già visto"],["Verga Sospesa","mentre è attiva non può essere spostata e ignora le leggi della gravità"]];
const CONDITIONS=["Vulnerabile","Trattenuto","Nascosto","Annegamento","Posseduto","Incosciente"];

/* ============ stato ============ */
const KEY="sablewood-tracker-v1";
const uid=()=>Math.random().toString(36).slice(2,9);
function mkPC(name,sage){return {id:uid(),name,cls:"",sage:!!sage,hpMax:6,hp:0,stMax:6,st:0,hope:2,arMax:3,ar:0,eva:10,major:6,severe:12,cond:[],exp:"",notes:""}}
function fresh(){
  return {v:1,savedAt:0,act:'1',tab:'atto',fear:3,counter:{on:false,value:15},
   critters:["",""],
   flags:{luna:null,ring:false,bargain:"",bargainUsed:false,learned:null,shortcut:null,searchTick:false,elderDone:false,peaceUsed:false,ritualHere:null,rest:null,ritualDone:false,final:null},
   chase:{d:3,t:3},river:{t:4},ritual:{v:8},villagers:0,undertow:null,loot:[],
   pcs:[mkPC("Marlowe Fairwind",true),mkPC("Varian Soto"),mkPC("Garrick Reed")],
   home:[{n:"",note:""}],
   foes:[],cds:[],log:[],gens:[],notes:"",rest:{}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||S.v!==1)S=fresh();

let dbDoc=null,saving=false,pending=false,saveTimer=null,saveWhere="questo browser";
function persist(){
  S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(saveTimer);saveTimer=setTimeout(pushDb,1500)}
}
async function pushDb(){
  if(saving){pending=true;return}
  saving=true;
  try{await dbDoc.set({json:JSON.stringify(S),savedAt:S.savedAt});saveWhere="il tuo account"}catch(e){saveWhere="questo browser (sync non riuscito)"}
  saving=false;renderBar();
  if(pending){pending=false;pushDb()}
}
(async()=>{
  try{
    if(!window.claude?.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    dbDoc=db.collection("data/users/"+id).doc("tracker");
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data();
      if(d&&d.savedAt>(S.savedAt||0)){try{const n=JSON.parse(d.json);if(n&&n.v===1){S=n;toast("Partita caricata dal tuo account")}}catch(e){}}}
    saveWhere="il tuo account";render();
  }catch(e){}
})();

/* ============ utilità ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=n=>1+Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rollExpr(expr){
  const m=String(expr).replace(/\s/g,"").match(/^(\d*)d(\d+)([+-]\d+)?$/i);
  if(!m){const n=parseInt(expr);return isNaN(n)?null:{total:n,rolls:[],text:String(n)}}
  const c=+(m[1]||1),f=+m[2],mod=+(m[3]||0);const rolls=[];for(let i=0;i<c;i++)rolls.push(d(f));
  const total=rolls.reduce((a,b)=>a+b,0)+mod;
  return {total,rolls,text:`${expr} → [${rolls.join(", ")}]${mod?(mod>0?" +":" ")+mod:""} = ${total}`};
}
function log(text,kind=""){
  const t=new Date();S.log.unshift({t:t.toTimeString().slice(0,5),text,kind});
  if(S.log.length>250)S.log.length=250;
}
let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
function upd(fn){fn();persist();render()}
const pcById=id=>S.pcs.find(p=>p.id===id);
const actIdx=id=>ACTS.findIndex(a=>a.id===id);

/* ============ meccaniche PG ============ */
function pcMarkStress(p,n,why){
  let over=0;for(let i=0;i<n;i++){if(p.st<p.stMax)p.st++;else over++}
  log(`${p.name}: +${n-over} Stress${why?" ("+why+")":""}`);
  if(over){p.hp=Math.min(p.hpMax,p.hp+over);log(`${p.name}: Stress pieno → segna ${over} PF`,"bad")}
  checkDown(p);
}
function hpFromDamage(dmg,major,severe,massive){
  if(dmg<=0)return 0;
  if(severe!=null&&massive&&dmg>=severe*2)return 4;
  if(severe!=null&&dmg>=severe)return 3;
  if(major!=null&&dmg>=major)return 2;
  return 1;
}
function pcDamage(p,dmg,useArmor,massive){
  let hp=hpFromDamage(dmg,p.major,p.severe,massive);
  let armorNote="";
  if(useArmor&&hp>0&&p.ar<p.arMax){p.ar++;hp--;armorNote=" (−1 grazie a 1 slot Armatura)"}
  p.hp=Math.min(p.hpMax,p.hp+hp);
  log(`${p.name} subisce ${dmg} danni → segna ${hp} PF${armorNote}`,"bad");
  checkDown(p);
}
function checkDown(p){if(p.hp>=p.hpMax){log(`${p.name} ha segnato l'ultimo PF: Mossa di Morte!`,"bad");deathFor=p.id}}

let R={who:"",mod:0,diff:12,adv:0,dis:0,exp:0,reaction:false,helpers:[],label:"",final:false,res:null,anim:0};

function preset(o){Object.assign(R,{mod:0,adv:0,dis:0,exp:0,reaction:false,helpers:[],final:false,label:"",res:null},o);render();document.getElementById("roller")?.scrollIntoView({behavior:"smooth",block:"start"})}
function doDuality(){
  const p=pcById(R.who);
  const helpers=R.helpers.map(pcById).filter(Boolean).filter(h=>h!==p);
  const spent=[];
  if(R.exp>0&&p){if(p.hope<1){toast(`${p.name} non ha Speranza per l'Esperienza`);return}p.hope--;spent.push(`${p.name} −1 Speranza (Esperienza)`)}
  for(const h of helpers){if(h.hope<1){toast(`${h.name} non ha Speranza per aiutare`);return}}
  helpers.forEach(h=>{h.hope--;spent.push(`${h.name} −1 Speranza (Aiuto)`)});
  const hope=d(12),fear=d(12);
  const advN=R.adv+helpers.length;
  const advDice=Array.from({length:advN},()=>d(6));const disDice=Array.from({length:R.dis},()=>d(6));
  let net=0,netTxt="";
  if(advN&&R.dis){netTxt="Vantaggio e svantaggio si annullano"}
  else if(advN){net=Math.max(...advDice);netTxt=`Vantaggio +${net}`}
  else if(R.dis){net=-Math.max(...disDice);netTxt=`Svantaggio ${net}`}
  const total=hope+fear+(+R.mod)+(+R.exp)+net;
  const crit=hope===fear;
  const success=crit||total>=+R.diff;
  let kind=crit?"c":hope>fear?"h":"f";
  let verdict=crit?"Successo Critico":`${success?"Successo":"Fallimento"} con ${hope>fear?"Speranza":"Paura"}`;
  const effects=[...spent];
  if(!R.reaction){
    if(crit){if(p){p.hope=Math.min(6,p.hope+1);if(p.st>0)p.st--;effects.push(`${p.name} +1 Speranza e −1 Stress`)}else effects.push("Critico: +1 Speranza e −1 Stress al PG")}
    else if(hope>fear){if(p){p.hope=Math.min(6,p.hope+1);effects.push(`${p.name} +1 Speranza`)}else effects.push("+1 Speranza al PG")}
    else {S.fear=Math.min(12,S.fear+1);effects.push(`Il GM ottiene 1 Paura (${S.fear})`)}
    if(!crit&&p&&p.cond.includes("Annegamento"))effects.push("Annegamento attivo: ricordati che tutti i PG che annegano segnano 1 Stress");
  } else effects.push("Tiro reazione: non genera Speranza né Paura");
  R.res={hope,fear,advDice,disDice,netTxt,total,crit,success,kind,verdict,effects,diff:R.diff,mod:+R.mod,exp:+R.exp};
  R.anim++;
  log(`${R.label?R.label+" — ":""}${p?p.name:"Tiro"}: ${hope}+${fear}${R.mod?` ${R.mod>0?"+":""}${R.mod}`:""}${R.exp?` +${R.exp} esp`:""}${net?` ${net>0?"+":""}${net}`:""} = ${total} vs ${R.diff} → ${verdict}`,kind==="f"?"fear":"hope");
  if(R.final){S.flags.final=finalOutcome(R.res);log(`Tiro finale: ${S.flags.final}`,"bad");if(S.flags.bargain&&!S.flags.bargainUsed){S.flags.bargainUsed=true}}
  persist();render();
}
function finalOutcome(r){if(r.crit)return "crit";if(r.success)return r.kind==="h"?"sh":"sf";return r.kind==="h"?"fh":"ff"}

function addFoe(key,n=1,over){
  const t={...TEMPLATES[key],...(over||{})};
  const same=S.foes.filter(f=>f.tmpl===key).length;
  for(let i=0;i<n;i++)S.foes.push({id:uid(),tmpl:key,name:t.name+(n>1||same?` #${same+i+1}`:""),hp:0,hpMax:t.hp,st:0,stMax:t.stress,diff:t.diff,atk:t.atk,thr:t.thr,attack:t.attack,dmg:t.dmg,minion:!!t.minion,dead:false,feats:t.feats||[],tier:t.tier});
  log(`Entrano in scena: ${n}× ${t.name}`);
}
function addCustomFoe(a){
  const thr=String(a.soglie||"").split("/").map(x=>parseInt(x));
  const key="gen_"+uid();
  TEMPLATES[key]={name:a.nome||"Avversario",tier:`Tier ${a.tier||1} ${a.ruolo||""}`.trim(),hp:+a.pf||4,stress:+a.stress||2,thr:[isNaN(thr[0])?null:thr[0],isNaN(thr[1])?null:thr[1]],diff:+a.difficolta||12,atk:+a.atk||0,attack:a.attacco||"",dmg:(String(a.attacco||"").match(/\d*d\d+([+-]\d+)?/)||[""])[0],feats:(a.caratteristiche||[]).map(esc),minion:/minion|gregar/i.test(a.ruolo||"")};
  addFoe(key,clamp(+a.quantita||1,1,12));
}
function foeDefeated(f){

<ul class="tight">${TREASURES.map((t,i)=>`<li><b>${t[0]}</b> — ${t[1]} ${S.loot.includes(t[0])?`<span class="chip ok">recuperato</span>`:`<button class="btn xs" data-a="loot" data-i="${i}">Recuperato</button>`}</li>`).join("")}</ul>
<button class="btn xs" data-a="roll-preset" data-diff="13" data-label="Forza: tesori sommersi">Tiro Forza</button></div>
</div></div></div>
<div class="note small"><b>Glossario:</b> una condizione temporanea (come Annegamento) si rimuove con un tiro d'azione. I tiri reazione non generano Speranza né Paura. Le carte in deposito non si possono usare; tornano nella dotazione durante un riposo, oppure segna Stress pari al costo di richiamo per scambiarla con una carta non in deposito.</div>
${S.river.t===0?`<div class="note">Il gruppo ha attraversato il fiume.</div>`:""}
<div class="row"><button class="btn pri" data-a="goact" data-k="3">Prosegui all'Atto III →</button></div>`},

'3':()=>`
<div class="act-h"><span class="num">ATTO III</span><h2>Hush</h2></div>
<div class="sec-h"><h3>Entrare nel villaggio</h3></div>
${read(`<p>Dopo un altro paio d'ore nel Sablewood trovate un cippo di pietra a terra, scolpito come un volto accigliato con un dito premuto in verticale sulle labbra corrugate.</p><p>Sembra che i suoi occhi seguano i vostri movimenti, anche se siete <i>quasi certi</i> che la statua sia immobile.</p>`)}
${luna()?read(`<p>Luna gli svolazza accanto con disinvoltura… e scompare.</p>`,"Luna è con il gruppo"):""}
${read(`<p>Sentite una piccola sensazione, come lo scoppio di una bolla, e il brusio delle chiacchiere si fa più forte. Oltre questa barriera magica si rivela il villaggio di Hush, con decine di capanne di legno. Intorno a voi, gli sguardi di qualche dozzina di volti diffidenti. È chiaro che qui gli estranei non piacciono. Ditemi tre cose che vedete e che vi fanno capire quanto questo posto sia ostile.</p>`,"Quando superano il cippo")}
${luna()?`<p class="note">Luna è con il gruppo: passa direttamente all'<b>Anziano Halython</b>.</p>`:`
<div class="sec-h"><h3>Trovare l'Arcanista</h3>${counterChip()}</div>
<p>Quasi tutti rifiutano di parlare con i PG: bisbigliano, fissano, sputano a terra, se ne vanno. La posizione dell'Arcanista dovrebbe restare segreta.</p>
${S.counter.on?`<div class="row"><button class="btn bad" data-a="search-tick" ${S.flags.searchTick?"disabled":""}>Ricerca nel villaggio: Contatore +1</button></div>`:""}
<div class="grid2">
<div class="panel"><h4>Fidget · umano Wildborne (loro)</h4><p class="small">Un bambino curiosissimo di sapere com'è la vita fuori da Hush. Non riesce a smettere di dimenarsi: è chiaro da dove venga il soprannome.</p></div>
<div class="panel"><h4>Lausa · nana Wildborne (lei)</h4><p class="small">La fabbra del villaggio, che di solito forgia solo chiodi e pentole. Incuriosita da armi e armature dei PG: vuole sapere chi le ha fatte e quando.</p></div>
<div class="panel"><h4>Octavio · fauno Wildborne (lui)</h4><p class="small">Il marito di Luna. Se il gruppo ha il suo anello, li guida da lui. Sarà devastato dalla notizia.</p>${S.flags.ring?`<span class="chip ok">Il gruppo ha l'anello</span>`:""}</div>
</div>`}
<div class="sec-h"><h3>Anziano Halython</h3>${S.flags.elderDone?`<span class="chip ok">convinto</span>`:""}</div>
${read(`<p>D'improvviso sentite un tonfo alle vostre spalle. Un uomo anziano, alto poco più di un metro, ha appena sbattuto a terra la punta del suo bastone di legno, pretendendo attenzione e rispetto.</p><p>La persona con cui stavate parlando balbetta: «Anziano Halython? Non stavo cercando di…»</p><p>Il vecchio halfling la interrompe: «Non un'altra parola. Hai già detto troppo. Quanto a voi, dovete lasciare questo villaggio. Subito.»</p>`,"Quando un paesano accetta di guidarli")}
<div class="grid2">
<div class="panel stack"><h4>Convincere l'Anziano</h4>
<div><div class="lab">Stress dell'Anziano — a 4 si arrende</div>${pips(4,S.elderSt||0,"st","elder-st")}</div>
${luna()?`<div class="note small">Luna garantisce per il gruppo: <b>vantaggio</b> ai tiri per convincerlo.</div>`:""}
<div class="row"><button class="btn" data-a="roll-preset" data-diff="15" data-label="Convincere l'Anziano" ${luna()?'data-adv="1"':""}>Tira (Diff 15)</button></div>
<div class="row small"><select id="elderpc" data-f="elderpc">${pcOptions(elderPick,"PG che tira")}</select>
<button class="btn ok" data-a="elder" data-k="s">Successo: Anziano +1 Stress</button>
<button class="btn bad" data-a="elder" data-k="f">Fallimento: PG +1 Stress</button></div>
<div class="row small"><button class="btn" data-a="no-hosp" ${(S.elderSt||0)>=4?"disabled":""}>Niente ospitalità: Anziano +1 Stress, arrivano 2d6 paesani</button></div>
<div class="row small"><button class="btn fear" data-a="peace" ${S.flags.peaceUsed||S.fear<2?"disabled":""}>CI SARÀ PACE: spendi 2 Paura</button><span class="muted">Quando un PG attacca un paesano. Tutti i PG perdono tutta la Speranza e segnano 2d4 Stress. Una volta sola.</span></div>
</div>
<div class="panel stack"><h4>Paesani preoccupati</h4>
<div class="row"><span class="mono" style="font-size:1.6rem">${S.villagers}</span><span class="muted">presenti</span>
<button class="btn xs" data-a="vill" data-k="-1">−1</button><button class="btn xs" data-a="vill" data-k="1">+1</button></div>
<div class="row small"><input type="number" id="villdmg" value="3" min="1"> <button class="btn" data-a="vill-dmg">Infliggi danni a un gregario</button></div>
<div class="row small"><button class="btn fear" data-a="vill-attack" ${S.fear<1||!S.villagers?"disabled":""}>Attacco di Gruppo (1 Paura)</button></div>
${S.flags.bargain&&!S.flags.bargainUsed&&S.villagers>10?`<div class="warn"><b>Patto fatato:</b> con più di 10 paesani presenti, ${esc(pcById(S.flags.bargain)?.name||"il PG")} ne attacca uno. <button class="btn xs" data-a="bargain-used">Il patto è stato riscosso</button></div>`:""}
</div></div>
<div class="grid2">${statBlock("elder")}${statBlock("villager")}</div>
<div class="row"><button class="btn pri" data-a="goact" data-k="4">L'Anziano cede → Atto IV</button></div>`,

'4':()=>`
<div class="act-h"><span class="num">ATTO IV</span><h2>Il rinnovo del sigillo</h2></div>
<div class="sec-h"><h3>Villa Fuocobianco</h3></div>
${read(`<p>Superando le case del villaggio notate che qui gli alberi del Sablewood hanno centinaia di volti unici intagliati su ogni lato, con gli occhi che scrutano in ogni direzione.</p><p>Ogni volta che passate accanto a uno di questi intagli, la bocca si apre ed emette piccole fiamme bianche che illuminano il sentiero.</p><p>Un albero, più alto degli altri, regge tra i rami una villa di legno. Mentre vi avvicinate, rune blu dipinte nella corteccia si accendono. Il ramo si anima e l'intera struttura scende lentamente fino a terra.</p><p>Al posto della porta c'è un bocciolo gigante, largo forse tre metri, che si schiude rivelando petali colorati. Al centro, dove dovrebbero esserci i semi, c'è un'apertura da cui esce una figura alta più di due metri.</p><p>È un misto tra un umanoide e una lucciola, con vesti da maga bianca, carica di libri e pozioni. «Vi stavo aspettando. Spero che nessuno abbia scoperto cosa trasportavate. L'ultima volta che la vostra città è rimasta indifesa così, i seguaci degli Antichi Dèi l'hanno quasi rasa al suolo. Comunque, come sta il piccolo Emeris? È ancora vivo?»</p>`)}
<p class="small">L'Arcanista Fuocobianco ha diverse migliaia di anni. L'Emeris di cui parla è Emeris IV; il re che ha assunto il gruppo è Emeris VIII. Ha creato il sigillo e ha un accordo con la stirpe reale: ogni paio di secoli rinnova il rituale, e in cambio il Regno evita il più possibile il Sablewood. Se le chiedono perché i paesani non sapessero della consegna: «Oh, l'avevo detto… mi pare 12 o 13 anni fa?»</p>
${read(`<p>«Dovremmo andare nella Valle Aperta per il rituale di rinnovo. È solo a un paio di miglia.</p><p>Il fatto è che un incantesimo del genere attirerà creature pericolose dagli angoli più oscuri del Sablewood. Dalle vostre facce capisco che ne avete già incontrate alcune.</p><p>…E preferirei che succedesse fuori dal villaggio. Quel ragazzino Lylython è un tipo lunatico, si mette a urlarmi contro ogni volta che un mio esperimento va storto.»</p>`,"Quando ha parlato abbastanza")}
${S.counter.on?`<div class="row"><span class="lab">Contatore attivo</span>
<button class="btn ${S.flags.ritualHere===true?"pri":""}" data-a="ritual-here" data-k="1">Convincono i paesani a fare il rituale qui</button>
<button class="btn ${S.flags.ritualHere===false?"pri":""}" data-a="ritual-here" data-k="0">Vanno alla Valle Aperta (+1)</button></div>`:""}
<div class="sec-h"><h3>Preparare il rituale</h3></div>
${S.flags.ritualHere!==true?read(`<p>Entrate in una radura larga un paio di centinaia di metri, così perfettamente circolare da sembrare innaturale. Per quanto ne sapete, è l'unico posto del Sablewood dove si vede il cielo.</p><p>L'Arcanista inizia a preparare il rituale e dice: «Mi serve un'ora per prepararmi. Godetevi l'aria della notte finché potete. Presto saremo molto occupati.»</p>`,"Se sono andati alla Valle Aperta"):""}
${S.counter.on?`<p class="small">Con il Contatore attivo, i giocatori possono saltare il riposo e aiutare con la preparazione: passa a «Il rituale inizia».</p>`:""}
<div class="panel stack"><h4>Riposo breve</h4>
<p class="small">Ogni PG sceglie fino a due opzioni (anche la stessa due volte).</p>
${S.pcs.map(p=>{const used=(S.rest[p.id]||[]).length;return `<div class="row small"><b style="min-width:9em">${esc(p.name)}</b><span class="muted">${used}/2</span>
<button class="btn xs" data-a="rest" data-k="wounds" data-id="${p.id}" ${used>=2?"disabled":""}>Curare ferite (1d4+1 PF)</button>
<button class="btn xs" data-a="rest" data-k="stress" data-id="${p.id}" ${used>=2?"disabled":""}>Ricomporsi (1d4+1 Stress)</button>
<button class="btn xs" data-a="rest" data-k="armor" data-id="${p.id}" ${used>=2?"disabled":""}>Riparare armatura (1d4+1)</button>
<button class="btn xs" data-a="rest" data-k="prep" data-id="${p.id}" ${used>=2?"disabled":""}>Prepararsi (+1 Speranza)</button></div>`}).join("")}
<div class="row small"><button class="btn xs" data-a="rest-group">Prepararsi insieme: +2 Speranza a ciascun PG scelto per gruppo</button>
<button class="btn xs" data-a="rest-reset">Nuovo riposo</button></div>
<div class="row"><button class="btn fear" data-a="downtime" ${S.flags.rest?"disabled":""}>Benefici del GM: +1d4 Paura${S.counter.on?", Contatore +2":""}</button>
${S.counter.on?`<button class="btn" data-a="skip-rest" ${S.flags.rest?"disabled":""}>Saltano il riposo</button>`:""}</div>
</div>
<div class="sec-h"><h3>Il rituale inizia</h3></div>
${read(`<p>Quando siete pronti, l'Arcanista dà inizio al rituale. Il suo corpo e la pietra del sigillo iniziano a brillare, e grida ultraterrene risuonano dai boschi mentre le creature vicine percepiscono l'energia arcana.</p>`)}
<p>Piazza <b>5 Scheletri Antichi</b> e <b>2 Eroi Dimenticati</b> ai margini della radura, a distanza Lontana. Finché ci sono meno di 8 scheletri, se un giocatore tira con Paura, spendi quella Paura per la Vendetta degli Antichi Dèi. Altrimenti spendi Paura per turni extra in cui attacchi l'Arcanista.</p>
<div class="stat"><div class="stat-h"><b>Il Rituale del Rinnovo</b><span>Tier 1 Evento</span></div><div class="stat-b">
<div><div class="lab">Rituale — a zero il rituale riesce</div>${pips(8,S.ritual.v,"cd","ritual")} <span class="mono">${S.ritual.v}</span></div>
<p class="small">Ogni nemico sconfitto: Rituale −1 (automatico quando segni un nemico come sconfitto). Ogni volta che l'Arcanista viene colpita (Diff 11): Rituale +1.</p>
<div class="row"><button class="btn pri" data-a="ritual-spawn">Schiera 5 Scheletri + 2 Eroi</button>
<button class="btn bad" data-a="ritual" data-k="hit">Arcanista colpita: +1</button>
<button class="btn ok" data-a="ritual" data-k="kill">Nemico sconfitto: −1</button>
<button class="btn fear" data-a="vengeance" ${S.fear<1||aliveSkel()>=10?"disabled":""}>Vendetta degli Antichi Dèi (1 Paura): +2 Scheletri</button>
<span class="small muted">Scheletri vivi: ${aliveSkel()}</span></div>
</div></div>
<div class="grid2">${statBlock("skeleton")}${statBlock("hero")}</div>
<div class="sec-h"><h3>Il rituale termina</h3></div>
${read(`<p>Un'onda di magia riduce in polvere tutti i nemici rimasti.</p><p>L'Arcanista Fuocobianco vi ringrazia, ma vi esorta a riportare a casa la pietra il prima possibile… perché ora gli Antichi Dèi lo sanno di sicuro.</p>`,"Quando il conto arriva a zero")}
${read(`<p>Lancia un incantesimo che vi trasforma tutti in libellule con la testa umanoide. «L'insetto più veloce della natura, con qualche miglioria mia. Dovrebbe aiutarvi a tornare a casa. Buona fortuna, e salutatemi il piccolo Emeris!»</p>`,"Quando i giocatori accettano")}
<div class="row"><button class="btn pri" data-a="ritual-end" ${S.flags.ritualDone?"disabled":""}>Il rituale è completo${S.counter.on?"":" (avvia Contatore a 15)"}</button>
<button class="btn" data-a="goact" data-k="5">Atto V →</button></div>`,

'5':()=>{const f=S.flags.final;const bp=pcById(S.flags.bargain);return `
<div class="act-h"><span class="num">ATTO V</span><h2>Ritorno a casa</h2></div>
<div class="sec-h"><h3>Il tiro finale</h3>${counterChip()}</div>
${read(`<p>Dopo aver volato per centinaia di chilometri in un paio d'ore, vedete finalmente la vostra città all'orizzonte. Tre cerchi concentrici di mura, ognuno più alto del precedente, e un enorme castello al centro.</p><p>E in questo momento la città è sotto assedio: orso-vespe giganti attaccano dal cielo, alberi animati del Sablewood colpiscono le mura con le radici, e alcuni degli Scarshade di prima seminano il caos per le strade.</p><p>Dopo averla vista, sapete esattamente dove va la pietra: anche se non sapevate cosa fosse, l'avete vista decine di volte, come uno dei gioielli della corona della statua di re Emeris II, davanti al castello. Tutto si riduce a questo: riuscirete ad arrivarci in tempo?</p>`)}
<p>Chiedi <b>un ultimo tiro d'azione</b>. La difficoltà è il valore attuale del Contatore d'Assalto alla Città: <b class="mono">${S.counter.value}</b>.</p>
<ul class="tight small"><li>Spendendo 1 Speranza, un PG usa una sua <b>Esperienza</b> per un bonus fisso.</li><li>Spendendo 1 Speranza, un PG può <b>Aiutare</b>: dà vantaggio (+d6; con più fonti si tiene il d6 più alto).</li><li>Spendendo 3 Speranza ciascuno, due o più PG fanno un <b>Tiro di Squadra</b>: ognuno tira e si tiene il migliore.</li><li>Abilità come gli Istinti Felini di Varian Soto o l'Adattabilità di Garrick Reed possono aiutare.</li></ul>
${bp&&!S.flags.bargainUsed?`<div class="warn"><b>Patto fatato:</b> ${esc(bp.name)} non ha attaccato nessuno ad Hush, quindi deve sabotare gli alleati. Il tiro finale ha <b>svantaggio</b> (−1d6; si annulla con il vantaggio).</div>`:""}
<div class="row"><button class="btn pri" data-a="final-preset">Prepara il tiro finale nel lanciadadi</button></div>
<div class="sec-h"><h3>Risolvere il tiro</h3></div>
${read(`<p>Vi precipitate al castello, sfrecciando oltre squadroni di soldati che tengono a bada le bestie del Sablewood.</p><p>Alla fine arrivate e incastrate la pietra nell'incavo vuoto. Un'altra ondata di magia, molto più potente di quella nella Valle Aperta, investe l'intera città.</p><p>Gli Scarshade vanno in frantumi. Le orso-vespe vengono scagliate in cielo. Gli alberi animati si fermano.</p>`)}
<div class="stack">
${[["ff","Fallimento con Paura","I PNG che i giocatori speravano di proteggere sono stati uccisi nell'attacco. Il re incolpa il gruppo e i PG vengono banditi dal regno."],
["fh","Fallimento con Speranza","I PNG che i giocatori speravano di proteggere sono morti durante l'attacco. C'è una cerimonia in cui i PG sono acclamati come eroi, ma con un minuto di silenzio per chi non ce l'ha fatta."],
["sf","Successo con Paura","I PNG da proteggere sono feriti ma vivi. Un PNG rivale che i PG detestano viene acclamato come eroe per aver protetto personalmente re Emeris: il suo rango sale e diventa più potente."],
["sh","Successo con Speranza","I PNG da proteggere sono salvi. I PG sono acclamati come eroi che hanno salvato la città e re Emeris offre loro delle ricompense."],
["crit","Successo Critico","Come un successo con Speranza, ma un PNG rivale odiato dai giocatori ha trovato la fine durante l'attacco."]].map(([k,t,x])=>`<div class="out-card ${f===k?"hit":""}"><b>${t}</b>${f===k?` <span class="chip hope">risultato</span>`:""}<div class="small">${x}</div></div>`).join("")}
</div>
<div class="sec-h"><h3>PNG di casa da proteggere</h3></div>
<p class="small muted">Annota i PNG nominati nelle domande di background e connessione all'inizio della partita.</p>
${homeEditor()}`}
};
let drownPick="",elderPick="";
const aliveShades=()=>S.foes.filter(f=>f.tmpl==="scarshade"&&!f.dead).length;
const aliveSkel=()=>S.foes.filter(f=>f.tmpl==="skeleton"&&!f.dead).length;
function homeEditor(){return `<div class="stack">${S.home.map((h,i)=>`<div class="row"><input type="text" id="hn${i}" data-f="home-n" data-i="${i}" value="${esc(h.n)}" placeholder="Nome PNG" style="flex:0 1 180px"><input type="text" id="ht${i}" data-f="home-note" data-i="${i}" value="${esc(h.note)}" placeholder="Legame / rivale / alleato" style="flex:1 1 200px"><button class="btn xs" data-a="home-del" data-i="${i}">×</button></div>`).join("")}<div><button class="btn xs" data-a="home-add">+ PNG</button></div></div>`}

/* ============ viste ============ */
const TABS=[["atto","Atto"],["scontro","Scontro"],["genera","Generatore IA"],["regole","Regole"],["diario","Diario"]];
function renderBar(){
  const ai=actIdx(S.act);
  document.getElementById("bar").innerHTML=`
  <div class="brand"><b>Sablewood</b><span>I MESSAGGERI · TRACKER DEL GM</span></div>
  <div class="meter"><span class="lab" style="color:var(--fear)">Paura</span><span class="mono" style="font-weight:600;color:var(--fear)">${S.fear}</span>
   <div class="fear-pips">${Array.from({length:12},(_,i)=>`<button class="fp ${i<S.fear?"on":""}" data-a="fear-set" data-i="${i}" aria-label="Paura ${i+1}"></button>`).join("")}</div></div>
  <div class="counter ${S.counter.on?"live":""}"><span class="lab">Assalto alla Città</span>
   ${S.counter.on?`<button class="btn xs" data-a="ctr" data-k="-1">−</button><span class="v">${S.counter.value}</span><button class="btn xs" data-a="ctr" data-k="1">+</button>`:`<button class="btn xs" data-a="ctr-start">Avvia (15)</button>`}</div>
  <nav class="acts">${ACTS.map((a,i)=>`<button class="${a.id===S.act?"on":i<ai?"done":""}" data-a="goact" data-k="${a.id}" title="${a.t}">${a.n}</button>`).join("")}</nav>
  <span class="save-ind">Salvato su ${saveWhere}</span>`;
}
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-a="tab" data-k="${k}">${l}</button>`).join("")}

function pcCard(p){
  return `<div class="pc ${p.hp>=p.hpMax?"down":""}">
  <div class="pc-top"><input class="name" type="text" id="pn-${p.id}" data-f="pc" data-k="name" data-id="${p.id}" value="${esc(p.name)}" aria-label="Nome">
   ${p.sage?`<span class="chip hope">Saggio di Corte</span>`:""}${S.flags.bargain===p.id?`<span class="chip fear">Patto fatato</span>`:""}
   <button class="btn xs" data-a="pc-edit" data-id="${p.id}">${editPc===p.id?"Fatto":"Modifica"}</button></div>
  ${editPc===p.id?`<div class="stack small">
   <div class="row"><input type="text" id="pc-${p.id}" data-f="pc" data-k="cls" data-id="${p.id}" value="${esc(p.cls)}" placeholder="Classe / ascendenza"><label class="inl"><input type="checkbox" data-a="pc-sage" data-id="${p.id}" ${p.sage?"checked":""}> Saggio di Corte</label></div>
   <div class="row">${[["hpMax","PF max"],["stMax","Stress max"],["arMax","Armatura"],["eva","Evasione"],["major","Grave"],["severe","Severa"]].map(([k,l])=>`<label class="inl">${l}<input type="number" id="${k}-${p.id}" data-f="pc" data-k="${k}" data-id="${p.id}" value="${p[k]}"></label>`).join("")}</div>
   <input type="text" id="ex-${p.id}" data-f="pc" data-k="exp" data-id="${p.id}" value="${esc(p.exp)}" placeholder="Esperienze (es. Diplomatico +2, Cacciatore +2)">
   <textarea id="nt-${p.id}" data-f="pc" data-k="notes" data-id="${p.id}" rows="2" placeholder="Note">${esc(p.notes)}</textarea>
   <div><button class="btn xs bad" data-a="pc-del" data-id="${p.id}">Rimuovi PG</button></div></div>`:
   `<div class="small muted">${esc(p.cls||"")}${p.cls?" · ":""}Evasione <b class="mono">${p.eva}</b> · Soglie <b class="mono">${p.major}/${p.severe}</b>${p.exp?` · ${esc(p.exp)}`:""}</div>`}
  <div class="trk">
   <span class="lab">PF</span><span>${pips(p.hpMax,p.hp,"hp","pc-pip",`data-id="${p.id}" data-k="hp"`)}</span>

const RULES=`<div class="rules stack">
<h2>Regole di Daggerheart in breve</h2>
<div class="grid2">
<div class="panel"><h4>Tiro d'azione (Dadi della Dualità)</h4><p>Tira 2d12: Speranza e Paura. Somma tratto ed eventuali bonus e confronta con la Difficoltà. ≥ Diff è un successo.</p><ul class="tight"><li><b>Con Speranza</b> (Speranza più alto): il PG ottiene 1 Speranza.</li><li><b>Con Paura</b> (Paura più alto): il GM ottiene 1 Paura e di solito fa una mossa.</li><li><b>Critico</b> (dadi uguali): successo automatico, +1 Speranza, −1 Stress. In attacco: danni massimi dei dadi + il tiro.</li></ul></div>
<div class="panel"><h4>Vantaggio, Esperienze, Aiuto</h4><ul class="tight"><li><b>Vantaggio</b>: +d6; <b>svantaggio</b>: −d6. Si annullano. Con più fonti tieni il d6 più alto.</li><li><b>Esperienza</b>: spendi 1 Speranza per aggiungere il suo bonus.</li><li><b>Aiutare</b>: spendi 1 Speranza per dare vantaggio a un alleato.</li><li><b>Tiro di Squadra</b>: 3 Speranza; due PG tirano, si tiene il migliore. In combattimento i danni si sommano.</li></ul></div>
<div class="panel"><h4>Tiri reazione</h4><p>Per resistere a un effetto (es. Agilità contro l'annegamento). Non generano Speranza né Paura e il critico non dà benefici extra.</p></div>
<div class="panel"><h4>Danni e soglie</h4><p>Danni sotto la soglia <b>Grave</b>: 1 PF. Da Grave: 2 PF. Da <b>Severa</b>: 3 PF. Opzionale: danni massicci (≥ 2× Severa) = 4 PF. Spendendo 1 slot <b>Armatura</b> riduci di un livello. Quando non puoi segnare Stress, segni 1 PF al suo posto.</p></div>
<div class="panel"><h4>Mosse di Morte</h4><ul class="tight"><li><b>Gloria Finale</b>: un'ultima azione con successo critico automatico, poi il PG muore.</li><li><b>Evitare la Morte</b>: perdi i sensi; tira il dado Speranza: se ≤ livello, ottieni una cicatrice (cancella permanentemente uno slot Speranza).</li><li><b>Rischiare Tutto</b>: tira i Dadi della Dualità. Speranza più alto: recuperi PF e/o Stress per il valore del dado Speranza. Paura più alto: muori. Critico: recuperi tutti PF e Stress.</li></ul></div>
<div class="panel"><h4>Condizioni</h4><ul class="tight"><li><b>Vulnerabile</b>: i tiri contro di te hanno vantaggio.</li><li><b>Trattenuto</b>: non puoi muoverti, ma puoi agire.</li><li><b>Nascosto</b>: i tiri contro di te hanno svantaggio.</li><li>Le condizioni temporanee (es. Annegamento) si rimuovono con un tiro d'azione.</li></ul></div>
<div class="panel"><h4>Riposo</h4><p><b>Breve</b>: 2 mosse tra Curare ferite (1d4+Tier PF), Ricomporsi (1d4+Tier Stress), Riparare armatura (1d4+Tier slot), Prepararsi (+1 Speranza, +2 se in gruppo). Il GM ottiene 1d4 Paura. <b>Lungo</b>: le mosse recuperano tutto; il GM ottiene 2d4 Paura e avanza un conto a lungo termine.</p></div>
<div class="panel"><h4>Il GM e la Paura</h4><p>Il GM inizia con 1 Paura per PG (massimo 12). Spende Paura per: mosse extra, mettere avversari sotto i riflettori, azioni di avversari e ambienti, complicazioni.</p></div>
<div class="panel"><h4>Distanze</h4><p>Mischia · Molto Vicina · Vicina · Lontana · Molto Lontana. Gli avversari attaccano con d20 + ATK contro l'Evasione del PG.</p></div>
<div class="panel"><h4>Carte in deposito (vault)</h4><p>Non si possono usare; tornano nella dotazione durante un riposo. In alternativa segna Stress pari al costo di richiamo per scambiarle con una carta della dotazione.</p></div>
</div></div>`;

async function generate(){

  G.ctrl=new AbortController();
  const prompt=`Sei un game designer esperto di Daggerheart (Darrington Press). Crea UNA sezione giocabile per il GM, in italiano, coerente con la campagna e con il punto in cui si trova il gruppo.

${campaignContext()}

TONO: ${G.tone}
INDICAZIONI EXTRA DEL GM: ${G.extra||"nessuna"}

Regole da rispettare: avversari Tier 1 con statistiche plausibili (Difficoltà 9-15, ATK da +0 a +3, soglie Grave/Severa tipo 6/12 o 8/14, PF 1-8, Stress 1-4, danni come 1d6+2 / 2d6+3 / 1d10+4 con tipo fis o mag). Usa la terminologia di Daggerheart: tiri d'azione con tratti (Agilità, Forza, Finezza, Istinto, Presenza, Conoscenza), Speranza, Paura, mosse del GM, conti alla rovescia, tiri reazione, condizioni (Vulnerabile, Trattenuto, Nascosto). Se pertinente, indica come la scena può influire sul Contatore d'Assalto alla Città. Non risolvere la trama principale e non contraddire i fatti dello stato. Scrivi testi evocativi ma brevi.

Rispondi SOLO con un oggetto JSON con questa forma:
{"titolo":"","tipo":"","luogo":"","leggi_ad_alta_voce":"testo da leggere ai giocatori, 2-4 frasi","descrizione_gm":"cosa succede e come gestirlo, 3-6 frasi","aggancio":"come si collega al punto attuale della campagna","difficolta_tiri":[{"azione":"","tratto":"","difficolta":12}],"conti_alla_rovescia":[{"nome":"","valore":4,"nota":""}],"avversari":[{"nome":"","tier":1,"ruolo":"Standard|Bruiser|Minion|Leader|Solo|Skulk|Social","quantita":1,"difficolta":12,"soglie":"6/12","pf":4,"stress":2,"atk":1,"attacco":"Nome · Mischia · 1d8+2 fis","caratteristiche":["Nome. effetto"]}],"png":[{"nome":"","descrizione":"","motivazione":""}],"mosse_paura":["spendi 1 Paura: ..."],"esiti":{"successo":"","fallimento":""},"effetto_contatore":"","ricompense":[""]}
Lascia vuoti gli array non pertinenti.`;
  try{
    const out=await sample.json(prompt,{signal:G.ctrl.signal,modelTier:"default",onText:({text})=>{G.stream=text;const el=document.getElementById("gen-stream");if(el)el.textContent=text.slice(-600)}});
    out.id=uid();out.atto=S.act;out.quando=new Date().toTimeString().slice(0,5);
    S.gens.unshift(out);if(S.gens.length>25)S.gens.length=25;
    log(`Generata sezione: ${out.titolo||"senza titolo"}`);persist();
  }catch(e){
    const m={not_granted:"Accesso a Claude negato per questa pagina. Puoi riattivarlo dal menu Permessi dell'artefatto.",rate_limited:"Troppe richieste ravvicinate. Aspetta un momento e riprova.",cancelled:"Generazione annullata.",invalid_json:"La risposta non era nel formato atteso. Riprova.",refused:"Claude non ha generato questa sezione. Prova a cambiare le indicazioni.",session_expired:"Sessione scaduta: ricarica la pagina.",sampling_disabled:"La generazione con Claude non è attiva per questo account."};
    G.err=m[e?.code]||"Generazione non riuscita. Riprova tra poco.";
  }
  G.busy=false;G.ctrl=null;render();
}

function renderGen(){
  const a=ACTS.find(x=>x.id===S.act);
  return `<div class="stack"><h2>Generatore di sezioni</h2>
  <p class="muted">Claude crea un incontro o una situazione su misura per il punto attuale: Atto ${a.n}, ${a.t}. Legge lo stato del tracker (Luna, patto, Contatore, salute del gruppo, eventi recenti) e restituisce una sezione giocabile con statistiche Daggerheart.</p>
  <div class="panel stack">
   <div class="row"><span class="lab">Tipo</span>${KINDS.map(k=>`<button class="btn xs ${G.kind===k?"pri":""}" data-a="g-kind" data-k="${k}">${k}</button>`).join("")}</div>
   <div class="row"><label class="inl">Tono <select id="g-tone" data-f="g" data-k="tone">${["tetro e fiabesco","horror boschivo","leggero e buffo","epico","malinconico","teso e frenetico"].map(t=>`<option ${G.tone===t?"selected":""}>${t}</option>`).join("")}</select></label></div>
   <textarea id="g-extra" data-f="g" data-k="extra" rows="2" placeholder="Indicazioni extra (facoltative): es. «qualcosa che metta alla prova il patto con lo Strixwolf», «un mercante di Hush»…">${esc(G.extra)}</textarea>
   <div class="row"><button class="btn pri" data-a="gen" ${G.busy?"disabled":""}>${G.busy?"Sto generando…":"Genera sezione"}</button>${G.busy?`<button class="btn" data-a="gen-stop">Interrompi</button>`:""}</div>
   ${G.busy?`<pre class="mono small muted" id="gen-stream" style="white-space:pre-wrap;max-height:140px;overflow:auto;margin:0">${esc(G.stream.slice(-600))||"Claude sta pensando…"}</pre>`:""}
   ${G.err?`<div class="warn small">${esc(G.err)}</div>`:""}
  </div>
  ${S.gens.length?S.gens.map(genCard).join(""):`<div class="panel muted">Le sezioni generate compariranno qui e restano salvate con la partita.</div>`}
  </div>`;
}

  const b=e.target.closest("[data-a]");if(!b)return;
  const o=b.dataset;
  if(b.classList.contains("pip")&&PIPMAP[o.a]){PIPMAP[o.a](o);return}
  const f=A[o.a];if(f)f(o,b);
});
document.addEventListener("change",e=>{
  const el=e.target,o=el.dataset;if(!o.f)return;
  const v=el.value;
  switch(o.f){
    case "pc":{const p=pcById(o.id);if(!p)return;const num=["hpMax","stMax","arMax","eva","major","severe"].includes(o.k);p[o.k]=num?clamp(+v||0,0,num&&o.k.endsWith("Max")?12:99):v;if(num){p.hp=Math.min(p.hp,p.hpMax);p.st=Math.min(p.st,p.stMax);p.ar=Math.min(p.ar,p.arMax)}persist();if(num||o.k==="name")render();return}
    case "r":R[o.k]=o.k==="who"?v:(+v||0);if(o.k==="who")R.helpers=R.helpers.filter(x=>x!==v);render();return;
    case "critter":S.critters[+o.i]=v;persist();render();return;
    case "bargain":S.flags.bargain=v;log(v?`${pcById(v).name} accetta il patto dello Strixwolf`:"Nessun patto fatato","fear");persist();render();return;
    case "drownpc":drownPick=v;return;
    case "elderpc":elderPick=v;return;
    case "home-n":S.home[+o.i].n=v;persist();return;
    case "home-note":S.home[+o.i].note=v;persist();return;
    case "notes":S.notes=v;persist();return;
    case "simple":simple.expr=v;return;
    case "g":G[o.k]=v;return;
  }
});
render();
</script>
