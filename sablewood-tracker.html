<title>Sablewood Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra fissa (Paura · Contatore · Atti · Gruppo · Dadi) / copione dell'atto al centro / pannello Gruppo a scomparsa a destra / dadi in un pannello flottante */
:root{
  --bg:#e4e7df; --paper:#f1f2ec; --ink:#1d2421; --muted:#5b665f; --line:#c3cabf;
  --moss:#3f5a48; --moss-soft:#d5dfd3;
  --hope:#a8741a; --hope-soft:#f0e2c2;
  --fear:#6a3f86; --fear-soft:#e5daee;
  --blood:#9b2f2a; --blood-soft:#f1d9d5;
  --ok:#2f6d43; --plate:#2a312d; --plate-fg:#f1f2ec;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-read:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293;
  --plate:#cfd6cc; --plate-fg:#161b18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293;
  --plate:#cfd6cc; --plate-fg:#161b18; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hope);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .xsmall{font-size:.76rem}
.lab{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
@media (max-width:700px){.bar{position:static}}
.bar-in{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.brand span{font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.meter{display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 11px;cursor:pointer;font-family:var(--f-display);font-size:1rem}
.acts button.on{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.acts button.done{border-color:var(--moss);color:var(--moss)}
.bar-r{display:flex;gap:6px;margin-left:auto;align-items:center}
.fear-pips{display:flex;gap:3px;flex-wrap:wrap;max-width:250px}
.fp{width:14px;height:14px;transform:rotate(45deg);border:1.5px solid var(--fear);background:transparent;cursor:pointer;padding:0;border-radius:2px}
.fp.on{background:var(--fear)}
.counter{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:3px 8px}
.counter.live{border-color:var(--blood);background:var(--blood-soft)}
.counter .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;min-width:2ch;text-align:center}
.tgl{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:4px 12px;cursor:pointer;font-weight:700}
.tgl.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* pagina */
.page{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.page.party{grid-template-columns:minmax(0,1fr) 360px}
.party-pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 86px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.party-pane[hidden]{display:none}
@media (max-width:1100px){
  .page.party{grid-template-columns:minmax(0,1fr)}
  .party-pane{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);max-height:none;z-index:40;background:var(--bg);border-left:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 30px rgba(0,0,0,.25)}
}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hope)}
.main{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel>h4{margin-bottom:6px}
.scn{border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.scn>summary{list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;cursor:pointer}
.scn>summary::-webkit-details-marker{display:none}
.scn>summary::before{content:"▸";color:var(--muted);font-size:.8rem}
.scn[open]>summary::before{content:"▾"}
.scn[open]>summary{border-bottom:1px solid var(--line)}
.scn-n{font-family:var(--f-mono);font-size:.72rem;background:var(--ink);color:var(--paper);padding:1px 7px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.scn-k{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.scn-t{font-family:var(--f-display);font-size:1.35rem;line-height:1.15;flex:1 1 200px;min-width:0}
.scn.cur{border-color:var(--hope);box-shadow:inset 4px 0 0 var(--hope)}
.scn.done .scn-t{color:var(--muted)}
.scn-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.scn.imp{border-color:var(--fear);margin-left:22px}
.scn.imp .scn-n{background:var(--fear)}
.scn.imp .scn-k{color:var(--fear)}
@media (max-width:600px){.scn.imp{margin-left:8px}}
.frame{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);font-size:.92rem}
.frame>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.scn-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dotted var(--line);padding-top:10px}
.scn-end{border:1px dashed var(--moss);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--moss-soft)}
.scn-end.imp-end{margin-left:22px}
@media (max-width:600px){.scn-end.imp-end{margin-left:8px}}
.act-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.act-h .num{font-family:var(--f-mono);font-size:.8rem;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;letter-spacing:.08em}

.read{font-family:var(--f-read);font-size:1.08rem;line-height:1.55;background:var(--moss-soft);border-left:3px solid var(--moss);padding:12px 16px;border-radius:0 var(--r) var(--r) 0}
.read p{margin:0 0 .6em} .read p:last-child{margin:0}
.cue{font-family:var(--f-body);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--moss);font-weight:700;display:block;margin-bottom:4px}
.note{border-left:3px solid var(--hope);padding:8px 12px;background:var(--hope-soft);border-radius:0 var(--r) var(--r) 0}
.warn{border-left:3px solid var(--blood);padding:8px 12px;background:var(--blood-soft);border-radius:0 var(--r) var(--r) 0}
ul.tight,ol.tight{margin:4px 0;padding-left:20px} .tight li{margin:2px 0}
p{margin:0}

/* box di regole (inseguimento, fiume, rituale) */
.stat{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.stat-h{background:var(--plate);color:var(--plate-fg);display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 12px;flex-wrap:wrap}
.stat-h b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.stat-h span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.stat-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}

/* pips */
.pips{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.pip{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.pip.on{background:var(--ink);border-color:var(--ink)}
.pip.hp{border-radius:4px;width:19px;height:13px}
.pip.hp.on{background:var(--blood);border-color:var(--blood)}
.pip.st{border-radius:4px;width:19px;height:13px}
.pip.st.on{background:var(--fear);border-color:var(--fear)}
.pip.hope{transform:rotate(45deg);width:12px;height:12px;margin:2px 3px;border-radius:2px;border-color:var(--hope)}
.pip.hope.on{background:var(--hope)}
.pip.ar{width:14px;height:16px;border:0;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);border-radius:0;background:var(--line)}
.pip.ar.on{background:var(--moss)}
.pip.cd{width:24px;height:24px;border-radius:50%;border-color:var(--moss)}
.pip.cd.on{background:var(--moss);border-color:var(--moss)}

/* scudo (Evasione, Armatura, Difficoltà) come sulla scheda */
.shield{display:inline-flex;flex-direction:column;align-items:center;flex:none}
.shield .sv{width:46px;height:50px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;line-height:1;background:var(--ink);clip-path:polygon(0 0,50% 9%,100% 0,100% 64%,50% 100%,0 64%);padding:3px;position:relative}
.shield .sv>span{width:100%;height:100%;display:grid;place-items:center;background:var(--paper);clip-path:polygon(0 0,50% 9%,100% 0,100% 64%,50% 100%,0 64%);padding-bottom:7px}
.shield .sl{margin-top:-7px;background:var(--ink);color:var(--paper);font-size:.58rem;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:2px;position:relative}
.shield.sm .sv{width:38px;height:42px;font-size:1.3rem}
.shield.lg .sv{width:62px;height:68px;font-size:2.1rem}
.shield.diff .sv,.shield.diff .sl{background:var(--fear)}
.shield.arm .sv,.shield.arm .sl{background:var(--moss)}

/* soglie di danno come sul manuale */
.thr{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;row-gap:2px}
.thr.two{grid-template-columns:1fr auto 1fr}
.thr .seg{background:var(--plate);color:var(--plate-fg);border:0;font:800 .62rem/1.05 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px 6px 8px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);min-height:32px;text-align:center}
.thr .seg:first-child{border-radius:3px 0 0 3px}
.thr .seg.last{clip-path:none;border-radius:0 3px 3px 0;padding-right:8px}
.thr .seg:hover:not(:disabled){background:var(--blood);color:#fff}
.thr .seg:disabled{cursor:default}
.thr .tn{font-family:var(--f-display);font-size:1.2rem;background:var(--paper);border:2px solid var(--plate);border-radius:3px;min-width:2.1em;text-align:center;line-height:1.3;margin:0 -4px;position:relative;z-index:1}
.thr .sub{font-size:.62rem;color:var(--muted);text-align:center}
.thr.compact .seg{font-size:.55rem;min-height:26px;padding:4px 10px 4px 5px}
.thr.compact .tn{font-size:1.02rem}
.minion-note{font-size:.8rem;background:var(--plate);color:var(--plate-fg);padding:4px 8px;border-radius:3px;font-weight:700}

/* bottoni */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-weight:500;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.hope{background:var(--hope-soft);border-color:var(--hope)}
.btn.fear{background:var(--fear-soft);border-color:var(--fear)}
.btn.bad{background:var(--blood-soft);border-color:var(--blood)}
.btn.ok{background:var(--moss-soft);border-color:var(--moss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:1px 7px;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 8px;font-size:.74rem;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.chip.fear{border-color:var(--fear);color:var(--fear)} .chip.hope{border-color:var(--hope);color:var(--hope)}
.chip.bad{border-color:var(--blood);color:var(--blood)} .chip.ok{border-color:var(--moss);color:var(--moss)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 7px;min-width:0}
input[type=number]{width:4.2em}
textarea{width:100%;resize:vertical}
label.inl{display:inline-flex;align-items:center;gap:5px;font-size:.92rem}
.cond{display:flex;flex-wrap:wrap;gap:4px}
.cond button{border:1px dashed var(--line);background:none;border-radius:999px;font-size:.74rem;padding:0 8px;cursor:pointer;color:var(--muted)}
.cond button.on{border-style:solid;border-color:var(--blood);color:var(--blood);font-weight:700}

/* card PG compatte */
.pcc{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pcc.down{border-color:var(--blood);box-shadow:inset 3px 0 0 var(--blood)}
.pcc-top{display:flex;gap:8px;align-items:center}
.pcc-id{flex:1;min-width:0;cursor:pointer}
.pcc-id b{font-family:var(--f-display);font-weight:400;font-size:1.12rem;display:block;line-height:1.1}
.pcc-id span{font-size:.75rem;color:var(--muted)}
.trk{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.trk>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.trk .lab{font-size:.6rem}
.pcc .pip.hp,.pcc .pip.st{width:16px;height:12px}
.pcc-x{border-top:1px dotted var(--line);padding-top:8px;display:flex;flex-direction:column;gap:10px}
.traits{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.traits button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.traits button b{font-family:var(--f-display);font-size:1.05rem;font-weight:400}
.traits button span{font-size:.55rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.feat{font-size:.84rem} .feat b{font-weight:700}
.feat .k{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.wpn{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.86rem;border:1px solid var(--line);border-radius:4px;padding:6px 8px}

/* incontri: card riassuntive + dettaglio */
.scene{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fc{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.fc:hover{border-color:var(--ink)}
.fc.open{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fc.dead{opacity:.5}
.fc.acted{background:var(--bg)}
.fc-h{display:flex;gap:8px;align-items:flex-start}
.fc-h .nm{flex:1;min-width:0}
.fc-h .nm b{font-family:var(--f-display);font-weight:400;font-size:1.08rem;line-height:1.1;display:block}
.fc-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fc-row .lab{width:3.4em;font-size:.6rem}
.act-b{border:1px solid var(--moss);background:none;color:var(--moss);border-radius:999px;font-size:.72rem;font-weight:800;padding:0 9px;cursor:pointer}
.act-b.done{background:var(--moss);color:var(--paper)}
.fd{grid-column:1/-1;border:1px solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.fd-h{background:var(--plate);color:var(--plate-fg);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fd-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fd-h b{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.05}
.fd-h i{font-size:.9rem;opacity:.85}
.fd-h .tier{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.fd-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr)}
@media (max-width:860px){.fd-b{grid-template-columns:minmax(0,1fr)}}
.fd-c{padding:12px 14px;display:flex;flex-direction:column;gap:9px;border-right:1px dotted var(--line)}
.fd-c:last-child{border-right:0}
.fd-c h5{margin:0;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;border-bottom:1px solid var(--line);padding-bottom:2px}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.88rem;margin:0}
.kv2 dt{color:var(--muted);font-weight:700} .kv2 dd{margin:0}
.ftr{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.ftr-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ftr-h b{font-weight:800}
.ktag{font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:2px;background:var(--line);color:var(--ink)}
.ktag.Azione{background:var(--ink);color:var(--paper)} .ktag.Reazione{background:var(--moss);color:var(--paper)}
.fd-f{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);background:var(--bg)}

.enc{border:1px solid var(--line);border-radius:10px;background:var(--paper);position:relative;overflow:hidden}
.enc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kc)}
.enc.k-Combattimento{--kc:var(--blood)} .enc.k-Sociale{--kc:var(--hope)} .enc.k-Ambientale{--kc:var(--moss)}
.enc:not(.open){display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px 12px 20px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.enc:not(.open):hover{border-color:var(--kc);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.enc-ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:1.3rem;background:var(--bg);border:1px solid var(--kc);color:var(--kc)}
.enc-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.enc-main b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.1}
.enc-main p{font-size:.92rem;color:var(--muted)}
.enc-kind{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--kc)}
.enc-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.enc-go{font-weight:800;color:var(--kc);margin-left:6px}
@media (max-width:640px){.enc:not(.open){grid-template-columns:auto minmax(0,1fr)}.enc-meta{grid-column:1/-1;justify-content:flex-start}}
.enc.open{border-color:var(--kc);padding:14px 16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.enc-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=n=>1+Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sgn=n=>(n>=0?"+":"")+n;
function rollExpr(expr){
  const m=String(expr).replace(/\s/g,"").match(/^(\d*)d(\d+)([+-]\d+)?$/i);
  if(!m){const n=parseInt(expr);return isNaN(n)?null:{total:n,rolls:[],text:String(n)}}
  const c=+(m[1]||1),f=+m[2],mod=+(m[3]||0);const rolls=[];for(let i=0;i<c;i++)rolls.push(d(f));
  const total=rolls.reduce((a,b)=>a+b,0)+mod;
  return {total,rolls,text:`${expr} → [${rolls.join(", ")}]${mod?" "+sgn(mod):""} = ${total}`};
}
function log(text,kind=""){S.log.unshift({t:new Date().toTimeString().slice(0,5),text,kind});if(S.log.length>250)S.log.length=250}
let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

let deathFor=null;
function pcMarkStress(id,n,why){
  const r=pcRaw(id),p=P(r);let over=0;
  for(let i=0;i<n;i++){if(r.st<p.stMax)r.st++;else over++}
  log(`${p.name}: +${n-over} Stress${why?" ("+why+")":""}`);
  if(over){r.hp=Math.min(p.hpMax,r.hp+over);log(`${p.name}: Stress pieno → segna ${over} PF`,"bad")}
  checkDown(id);
}
function hpFromDamage(dmg,major,severe){
  if(dmg<=0)return 0;
  if(severe!=null&&dmg>=severe)return 3;
  if(major!=null&&dmg>=major)return 2;
  return 1;
}
function pcMarkHp(id,hp,why){const r=pcRaw(id),p=P(r);r.hp=Math.min(p.hpMax,r.hp+hp);log(`${p.name} segna ${hp} PF${why?" ("+why+")":""}`,"bad");checkDown(id)}
function pcDamage(id,dmg,useArmor){
  const r=pcRaw(id),p=P(r);let hp=hpFromDamage(dmg,p.major,p.severe);let note="";
  if(useArmor&&hp>0&&r.ar<p.arMax){r.ar++;hp--;note=", −1 con 1 slot Armatura"}
  r.hp=Math.min(p.hpMax,r.hp+hp);log(`${p.name} subisce ${dmg} danni → ${hp} PF${note}`,"bad");checkDown(id);
}
function checkDown(id){const r=pcRaw(id),p=P(r);if(r.hp>=p.hpMax){deathFor=id;log(`${p.name} ha segnato l'ultimo PF: Mossa di Morte!`,"bad")}}

const dieSides=expr=>{const m=String(expr).match(/d(\d+)/i);return m?+m[1]:6};
function facesOf(res){
  if(res.t==="dual")return [{v:res.hope,s:12,c:"h"},{v:res.fear,s:12,c:"f"},...res.adv.map(v=>({v,s:6,c:"n"})),...res.dis.map(v=>({v,s:6,c:"n"}))];
  if(res.t==="atk")return [{v:res.d20,s:20,c:"n"}];

function startRoll(o){
  const r=o.who&&o.who!=="gen"?pcRaw(o.who):null;
  if(o.t==="dual"&&!o.who){ROLL.pend={o,ask:"who"};renderRoll();return}
  if(o.t==="dual"&&o.trait==="ask"&&r){ROLL.pend={o,ask:"trait"};renderRoll();return}
  if(o.t==="atk"&&!o.target){ROLL.pend={o,ask:"target"};renderRoll();return}
  ROLL.pend=null;
  const res=o.t==="dual"?rollDual(o):o.t==="atk"?rollAtk(o):rollDmg(o);
  if(!res)return;
  persist();showResult(res);

function recalc(res){

function encSugs(def){const s=typeof def.sug==="function"?def.sug():(def.sug||[]);return s}
function encounterCard(key,def,forceOpen){
  const parts=S.foes.filter(f=>f.where===key),up=parts.filter(f=>!f.dead).length;
  const open=forceOpen||(encOpen.has(key)?encOpen.get(key):false);
  const kc="k-"+def.k;
  if(!open)return `<div class="enc ${kc}" data-a="enc-toggle" data-k="${key}" role="button" tabindex="0" aria-expanded="false">
   <span class="enc-ico" aria-hidden="true">${KIND_ICON[def.k]||"✦"}</span>
   <div class="enc-main"><span class="enc-kind">Incontro ${def.k.toLowerCase()}</span><b>${esc(def.t)}</b><p>${def.d}</p></div>
   <div class="enc-meta">${parts.length?`<span class="chip">${up}/${parts.length} in piedi</span>${parts.slice(0,5).map(f=>`<span class="ava sm" title="${esc(f.name)}">${initial(f.name)}</span>`).join("")}`:`<span class="xsmall muted">${def.env?"Ambiente e conti":"Nessun partecipante"}</span>`}<span class="enc-go">Apri ›</span></div></div>`;
  const sugs=encSugs(def);
  const pick=picker===key?`<div class="mc pick"><div class="lab">Aggiungi partecipante</div>
    ${sugs.length?`<div class="row">${sugs.map(([k,n,label])=>`<button class="btn xs ok" data-a="enc-add" data-k="${k}" data-n="${n}" data-w="${key}">${label||`${n>1?n+"× ":""}${esc(T[k].name)}`}</button>`).join("")}</div>`:""}
    ${def.devSug?def.devSug():""}
    <div class="row"><select id="pick-${key.replace(/[:.]/g,"_")}" aria-label="Avversario o PNG">${Object.entries(T).map(([k,t])=>`<option value="${k}">${esc(t.name)} · ${t.type}</option>`).join("")}</select>
     <button class="btn xs pri" data-a="enc-add-sel" data-w="${key}">Aggiungi</button><button class="btn xs" data-a="enc-plus" data-k="">Annulla</button></div></div>`
   :`<button class="enc-plus" data-a="enc-plus" data-k="${key}" aria-label="Aggiungi partecipante" title="Aggiungi partecipante">+</button>`;
  const sel=parts.find(f=>f.id===openFoe);
  return `<div class="enc open ${kc}" id="enc-${key.replace(/[:.]/g,"_")}">
   <div class="enc-head"><div class="enc-main"><span class="enc-kind">${KIND_ICON[def.k]||"✦"} Incontro ${def.k.toLowerCase()}</span><b>${esc(def.t)}</b><p>${def.d}</p></div>
    <div class="enc-tools">
     <div class="box fearbox"><span class="lab">Paura</span><b>${S.fear}</b><button class="btn xs" data-a="fear-step" data-k="-1" aria-label="Paura −1">−</button><button class="btn xs fear" data-a="fear-step" data-k="1" aria-label="Paura +1">+</button></div>
     ${parts.length?`<div class="box"><span class="lab">In piedi</span><b>${up}<small>/${parts.length}</small></b></div>`:""}
     <button class="btn" data-a="new-round" data-w="${key}">Nuovo giro GM</button>
     ${encResetAsk===key?`<button class="btn bad" data-a="enc-reset" data-k="${key}">Conferma reimposta</button><button class="btn xs" data-a="enc-reset-no">No</button>`:`<button class="btn" data-a="enc-reset-ask" data-k="${key}">Reimposta</button>`}
     ${forceOpen?"":`<button class="btn" data-a="enc-toggle" data-k="${key}">Chiudi</button>`}</div></div>
   ${def.env?`<div class="enc-env">${def.env()}</div>`:""}
   <div class="enc-grid">${parts.map(miniCard).join("")}${pick}</div>
   ${sel?foeSheet(sel):""}
  </div>`;
}

function parseDev(raw){
  const o={tiri:[],png:[],avv:[],conti:[],paura:[],domande:[]};let last=null;
  const multi={TIRO:"tiri",PNG:"png",AVVERSARIO:"avv",CONTO:"conti",PAURA:"paura",DOMANDA:"domande"};
  const single=["TITOLO","TIPO","LUOGO","POSTA","LEGGI","SCENA","USCITA","RACCORDO","SUCCESSO","FALLIMENTO","CONTATORE"];
  for(const line of String(raw||"").split("\n")){
    const m=line.match(/^\s*[*-]?\s*\**([A-ZÀÈÉÌÒÙ]+)\**\s*:\s*(.*)$/);
    if(m&&(multi[m[1]]||single.includes(m[1]))){
      const k=m[1],v=m[2].trim();
      if(multi[k]){if(v&&!/^nessun/i.test(v))o[multi[k]].push(v.split("|").map(s=>s.trim()));last=null}
      else{o[k.toLowerCase()]=v;last=k.toLowerCase()}
    }else if(last&&line.trim())o[last]+=" "+line.trim();
  }
  return o;
}
function sceneNum(act,id){let n=0;for(const a of ACTS)for(const s of SECTIONS[a.id]()){n++;if(a.id===act&&s.id===id)return n}return "?"}
function nextScene(act,id){
  const secs=SECTIONS[act](),i=secs.findIndex(s=>s.id===id);
  if(secs[i+1])return {act,s:secs[i+1],n:sceneNum(act,secs[i+1].id)};
  const na=ACTS[ACTS.findIndex(a=>a.id===act)+1];
  if(na){const s=SECTIONS[na.id]()[0];return {act:na.id,s,n:sceneNum(na.id,s.id),actN:na.n}}
  return null;
}
function devPrompt(where,userText,kind,excludeId){
  const [act,secId]=where.split(":");
  const sec=SECTIONS[act]().find(s=>s.id===secId),nx=nextScene(act,secId),a=ACTS.find(x=>x.id===act);
  const chain=S.devs.filter(x=>x.where===where&&x.raw&&x.id!==excludeId).map((x,i)=>{const p=parseDev(x.raw);return `${i+1}) «${p.titolo||"?"}» — al tavolo: ${x.user||"—"}; posta: ${p.posta||"—"}; uscita: ${p.uscita||"—"}`.slice(0,300)}).join("\n");

CONTO: nome | valore 3-6 | cosa succede a zero   (0 o 1 riga)

async function generate(where,userText,kind,regenId){
  let sample=null;
  try{sample=window.claude?.use?await window.claude.use("sample"):null}catch(e){sample=null}
  const errKey=regenId?"re:"+regenId:where;
  if(!sample){G.err[errKey]="L'improvvisazione usa Claude dal tuo account: apri il tracker su claude.ai per usarla.";render();return}
  let dv=regenId&&S.devs.find(x=>x.id===regenId);
  const prompt=devPrompt(where,userText,kind,regenId);
  if(dv){dv.prev=dv.raw;dv.raw="";dv.user=userText;dv.kind=kind;dv.done=false}
  else{dv={id:uid(),where,act:where.split(":")[0],user:userText,kind,raw:"",done:false,at:new Date().toTimeString().slice(0,5)};S.devs.push(dv)}
  G.busy=dv.id;G.err[errKey]="";composer=null;scnOpen.set("dev:"+dv.id,true);render();
  document.querySelector(`details[data-dev="${dv.id}"]`)?.scrollIntoView({behavior:"smooth",block:"start"});
  G.ctrl=new AbortController();
  try{
    const out=await sample(prompt,{signal:G.ctrl.signal,modelTier:"quick",cache:false,
      onText:({text})=>{dv.raw=text;const el=document.getElementById("devb-"+dv.id);if(el)el.innerHTML=devBody(dv);const t=document.getElementById("devt-"+dv.id);if(t)t.textContent=parseDev(text).titolo||"Sto improvvisando…"}});
    dv.raw=out.text;delete dv.prev;log(`Scena improvvisata: ${parseDev(dv.raw).titolo||"senza titolo"}`);
  }catch(e){
    const m={not_granted:"Accesso a Claude negato per questa pagina: puoi riattivarlo dal menu Permessi dell'artefatto.",rate_limited:"Troppe richieste ravvicinate: aspetta un momento.",cancelled:"Generazione interrotta.",refused:"Claude non ha generato questa scena: prova a cambiare il racconto.",session_expired:"Sessione scaduta: ricarica la pagina.",sampling_disabled:"La generazione con Claude non è attiva per questo account."};
    if(e?.code==="refused")dv.raw="";else if(e?.text&&e.code!=="cancelled")dv.raw=e.text;
    if(!dv.raw&&dv.prev){dv.raw=dv.prev}
    delete dv.prev;
    if(!dv.raw)S.devs=S.devs.filter(x=>x!==dv);
    G.err[regenId?"re:"+dv.id:where]=m[e?.code]||"Generazione non riuscita. Riprova.";
  }
  G.busy=null;G.ctrl=null;persist();render();
}

  ${p.successo||p.fallimento?`<div class="grid2 small"><div class="out-card"><b>Successo</b><div>${esc(p.successo||"")}</div></div><div class="out-card"><b>Fallimento</b><div>${esc(p.fallimento||"")}</div></div></div>`:""}
  ${p.raccordo?`<div class="note small"><b>Ritorno alla trama:</b> ${esc(p.raccordo)}</div>`:""}

function renderAct(){
  const a=ACTS.find(x=>x.id===S.act),secs=SECTIONS[S.act]();
  const cur=secs.find(s=>!S.scn[S.act+":"+s.id]);
  return `<div class="act-h"><span class="num">ATTO ${a.n}</span><h2>${a.t}</h2><span class="small muted">${secs.filter(s=>S.scn[S.act+":"+s.id]).length}/${secs.length} scene concluse</span></div>`+secs.map(s=>{
    const key=S.act+":"+s.id,n=sceneNum(S.act,s.id),done=!!S.scn[key];
    const open=scnOpen.has(key)?scnOpen.get(key):!done;
    const devs=S.devs.filter(x=>x.where===key);
    const chainDone=done&&(!devs.length||devs[devs.length-1].done);
    return `<details class="scn ${done?"done":""} ${cur===s?"cur":""}" data-scn="${key}" id="scn-${S.act.replace(".","_")}-${s.id}" ${open?"open":""}><summary><span class="scn-n">Scena ${n}</span><span class="scn-k">${s.f.k}</span><span class="scn-t">${s.t}</span>${done?`<span class="chip ok">conclusa</span>`:cur===s?`<span class="chip hope">in corso</span>`:""}</summary>
    <div class="scn-b">${frameHTML(s.f)}${s.html()}
    ${ENC[key]?encounterCard(key,ENC[key]):""}
    <div class="scn-foot">${done?`<span class="chip ok">Scena conclusa</span><button class="btn xs" data-a="scn-reopen" data-k="${key}">Riapri</button>`:`<button class="btn pri" data-a="scn-done" data-k="${key}">Concludi scena</button><span class="xsmall muted">Alla fine della scena potrai proseguire come previsto o improvvisarne una nuova.</span>`}</div>
    </div></details>
    ${devs.map((dv,i)=>devCard(dv,`${n}.${i+1}`)).join("")}
    ${chainDone?sceneEnd(S.act,s,key,devs.length?`${n}.${devs.length}`:n,devs.length?"imp-end":""):""}`;
  }).join("");
}

  <h3>Conti alla rovescia</h3>
  <div class="stack">${S.cds.map(c=>`<div class="row"><b>${esc(c.name)}</b>${pips(c.max,c.v,"cd","cd-pip",`data-id="${c.id}"`)}<span class="mono">${c.v}</span><button class="btn xs" data-a="cd-tick" data-id="${c.id}" data-k="-1">−1</button><button class="btn xs" data-a="cd-tick" data-id="${c.id}" data-k="1">+1</button><button class="btn xs" data-a="cd-del" data-id="${c.id}" aria-label="Rimuovi">×</button>${c.note?`<span class="small muted">${esc(c.note)}</span>`:""}</div>`).join("")}

  <div class="note small"><b>Riflettori:</b> dopo un tiro con Paura o un fallimento il GM fa una mossa. Spendi 1 Paura per mettere sotto i riflettori un avversario in più o per un'azione che costa Paura. Il badge «ha agito» ricorda chi è già stato sotto i riflettori in questo giro.</div></div>`;

const RULES=`<div class="stack"><h2>Regole di Daggerheart in breve</h2><div class="grid2">
<div class="panel"><h4>Tiro d'azione</h4><p>Tira 2d12 (Speranza e Paura), somma il tratto e i bonus: ≥ Difficoltà è un successo.</p><ul class="tight"><li><b>Con Speranza</b>: il PG ottiene 1 Speranza.</li><li><b>Con Paura</b>: il GM ottiene 1 Paura e di solito fa una mossa.</li><li><b>Critico</b> (dadi uguali): successo automatico, +1 Speranza, −1 Stress; in attacco danni massimi più il tiro.</li></ul></div>
<div class="panel"><h4>Vantaggio, Esperienze, Aiuto</h4><ul class="tight"><li><b>Vantaggio</b> +d6, <b>svantaggio</b> −d6; si annullano.</li><li><b>Esperienza</b>: 1 Speranza per aggiungere il bonus (+2).</li><li><b>Aiutare</b>: 1 Speranza per dare un d6 di vantaggio a un alleato.</li><li><b>Tiro di Squadra</b>: 3 Speranza; tirano due PG, si tiene il migliore.</li></ul></div>
<div class="panel"><h4>Soglie di danno</h4><p>Sotto la soglia <b>Grave</b>: 1 PF. Da Grave: 2 PF. Da <b>Severa</b>: 3 PF. Le soglie vengono dall'armatura più il livello. Uno slot <b>Armatura</b> riduce la gravità di una soglia. Se devi segnare Stress e non puoi, segni 1 PF. All'ultimo PF: Mossa di Morte.</p></div>
<div class="panel"><h4>Attacchi</h4><p>I PG attaccano con il tratto dell'arma contro la Difficoltà dell'avversario; i danni usano i dadi dell'arma per la Competenza (1). Gli avversari tirano d20 + ATK contro l'Evasione del PG.</p></div>
<div class="panel"><h4>Tiri reazione</h4><p>Per resistere a un effetto. Non generano Speranza né Paura.</p></div>
<div class="panel"><h4>Mosse di Morte</h4><ul class="tight"><li><b>Gloria Finale</b>: un'ultima azione con successo critico automatico, poi il PG muore.</li><li><b>Evitare la Morte</b>: perdi i sensi; tira il dado Speranza: se ≤ livello ottieni una cicatrice.</li><li><b>Rischiare Tutto</b>: tira i Dadi della Dualità. Speranza più alto: recuperi PF/Stress per il suo valore. Paura più alto: muori. Critico: recuperi tutto.</li></ul></div>
<div class="panel"><h4>Condizioni</h4><ul class="tight"><li><b>Vulnerabile</b>: i tiri contro di te hanno vantaggio.</li><li><b>Trattenuto</b>: non puoi muoverti; essendo temporanea, il GM può terminarla solo con una sua mossa.</li><li><b>Nascosto</b>: i tiri contro di te hanno svantaggio.</li><li>Le condizioni temporanee si rimuovono con un tiro d'azione.</li></ul></div>
<div class="panel"><h4>Riposo breve</h4><p>Due mosse a testa tra Curare ferite (1d4+1 PF), Ricomporsi (1d4+1 Stress), Riparare armatura (1d4+1 slot), Prepararsi (+1 Speranza, +2 se insieme). Il GM ottiene 1d4 Paura.</p></div>
<div class="panel"><h4>Il GM e la Paura</h4><p>Il GM inizia con 1 Paura per PG (massimo 12). Spende Paura per mosse extra, per mettere altri avversari sotto i riflettori, per azioni che costano Paura e per complicazioni. Non c'è ordine di turno: i riflettori passano a chi agisce.</p></div>
<div class="panel"><h4>Scene</h4><p>Una scena ha un luogo, dei personaggi e una posta in gioco. Il GM la inquadra, fa domande ai giocatori per coinvolgerli, sposta i riflettori e la chiude quando la posta è risolta. Se i PG prendono una strada inattesa, nasce una nuova scena: qui la improvvisi alla fine di quella appena giocata.</p></div>
<div class="panel"><h4>Distanze</h4><p>Mischia · Molto Vicina · Vicina · Lontana · Molto Lontana.</p></div>
</div></div>`;

 "rest-group":()=>upd(()=>{const ps=S.pcs.filter(p=>(S.rest[p.id]||[]).length<2);ps.forEach(p=>{(S.rest[p.id]=S.rest[p.id]||[]).push("prep");p.hope=Math.min(6,p.hope+2)});log(`Preparazione di gruppo: +2 Speranza a ${ps.map(p=>pcName(p.id)).join(", ")}`,"hope")}),
 "rest-reset":()=>upd(()=>{S.rest={};S.flags.rest=null}),
 downtime:()=>upd(()=>{const x=rollShow("1d4","Paura del GM per il riposo");addFear(x.total,"riposo breve ("+x.text+")");counterAdd(2,"riposo breve");S.flags.rest="taken"}),
 "skip-rest":()=>upd(()=>{S.flags.rest="skipped";log("Il gruppo salta il riposo per guadagnare tempo")}),
 ritual:o=>upd(()=>{if(o.k==="hit"){S.ritual.v=Math.min(8,S.ritual.v+1);log(`L'Arcanista è colpita: Rituale +1 → ${S.ritual.v}`,"bad")}if(o.k==="kill"){S.ritual.v=Math.max(0,S.ritual.v-1);log(`Rituale −1 → ${S.ritual.v}`,"ok")}}),
 "ritual-pip":o=>upd(()=>{const n=+o.i+1;S.ritual.v=S.ritual.v===n?n-1:n}),
 "ritual-spawn":()=>upd(()=>{spawn("skeleton",5,"4:rituale");spawn("hero",2,"4:rituale")}),
 vengeance:()=>upd(()=>{addFear(-1,"Vendetta degli Antichi Dèi");spawn("skeleton",Math.min(2,10-aliveSkel()),"4:rituale")}),
 "ritual-end":()=>upd(()=>{S.flags.ritualDone=true;S.ritual.v=0;S.foes.filter(f=>f.where==="4:rituale").forEach(f=>f.dead=true);log("Il rituale è completo: i nemici rimasti diventano polvere","ok");if(!S.counter.on)counterStart(15,"fine del rituale")}),
 "home-add":()=>upd(()=>S.home.push({n:"",note:""})),
 "home-del":o=>upd(()=>S.home.splice(+o.i,1)),
 // dadi
 // PG
 "pc-open":o=>{openPc=openPc===o.id?null:o.id;renderParty()},
 "pc-pip":o=>upd(()=>{const r=pcRaw(o.id),k=o.k,n=+o.i+1;r[k]=r[k]===n?n-1:n;if(k==="hp"){if(r.hp<P(r).hpMax&&deathFor===r.id)deathFor=null;checkDown(r.id)}}),
 "pc-thr":o=>upd(()=>pcMarkHp(o.id,+o.k,`danni ${["","minori","gravi","severi"][+o.k]}`)),
 "pc-armor":o=>upd(()=>{const r=pcRaw(o.id),p=P(r);if(r.ar>=p.arMax){toast("Nessuno slot Armatura libero");return}if(r.hp<1){toast("Nessun PF da togliere");return}r.ar++;r.hp--;if(deathFor===r.id)deathFor=null;log(`${p.name} segna 1 slot Armatura: −1 PF`)}),
 "pc-sage":o=>upd(()=>{const r=pcRaw(o.id);r.over.sage=!P(r).sage}),
 "pc-cond":o=>upd(()=>{const r=pcRaw(o.id);r.cond=r.cond.includes(o.k)?r.cond.filter(c=>c!==o.k):[...r.cond,o.k];log(`${pcName(r.id)}: ${o.k} ${r.cond.includes(o.k)?"attivo":"rimosso"}`)}),
 "pc-dmg":o=>{const v=+document.getElementById("dmg-"+o.id).value;if(!(v>0)){toast("Inserisci i danni");return}const arm=document.getElementById("arm-"+o.id).checked;upd(()=>pcDamage(o.id,v,arm))},
 "hope-feat":o=>upd(()=>{const r=pcRaw(o.id),p=P(r);if(r.hope<3)return;r.hope-=3;log(`${p.name} usa ${p.hopeF[0]} (−3 Speranza)`,"hope");if(r.id==="khari")r.ar=Math.max(0,r.ar-2)}),
 potion:o=>upd(()=>{const r=pcRaw(o.id),p=P(r);const x=rollShow("1d4",`${p.name}: ${p.item[0]}`);r.item=true;if(p.item[2]==="hp")r.hp=Math.max(0,r.hp-x.total);else r.st=Math.max(0,r.st-x.total);log(`${p.name} beve ${p.item[0]}: −${x.total} ${p.item[2]==="hp"?"PF":"Stress"}`,"ok")}),
 death:o=>upd(()=>{const r=pcRaw(o.id),p=P(r);deathFor=null;
  if(o.k==="blaze")log(`${p.name} sceglie la Gloria Finale: un'ultima azione con successo critico, poi muore`,"bad");
  if(o.k==="avoid"){const h=rollShow("1d12",`${p.name}: dado Speranza`).total;if(!r.cond.includes("Incosciente"))r.cond.push("Incosciente");log(`${p.name} evita la morte e perde i sensi. Dado Speranza ${h}${h<=1?": ottiene una cicatrice":": nessuna cicatrice"}`,"bad")}
  if(o.k==="risk"){const h=rollShow("1d12","Rischiare Tutto: Speranza").total,f=rollShow("1d12","Rischiare Tutto: Paura").total;
   if(h===f){r.hp=0;r.st=0;log(`${p.name} rischia tutto: ${h}/${f}, critico! Recupera tutti PF e Stress`,"ok")}
   else if(h>f){let c=h;const hp=Math.min(r.hp,c);r.hp-=hp;c-=hp;r.st=Math.max(0,r.st-c);log(`${p.name} rischia tutto: Speranza ${h} > Paura ${f}. Recupera ${h} tra PF e Stress`,"ok")}
   else log(`${p.name} rischia tutto: Paura ${f} > Speranza ${h}. Il personaggio muore`,"bad")}}),
 // avversari
 "foe-open":o=>{openFoe=openFoe===o.id?null:o.id;sheetTab="cap";render();if(openFoe)setTimeout(()=>document.getElementById("fd-"+o.id)?.scrollIntoView({behavior:"smooth",block:"nearest"}),0)},
 "foe-pip":o=>upd(()=>{const f=foe(o.id),n=+o.i+1;f[o.k]=f[o.k]===n?n-1:n;if(o.k==="st"&&f.tmpl==="elder"){S.elderSt=f.st;syncElder()}if(o.k==="hp"){if(f.hp>=f.hpMax)foeDefeated(f);else f.dead=false}}),
 "foe-thr":o=>upd(()=>{const f=foe(o.id);foeMark(f,"hp",+o.k);log(`${f.name} segna ${o.k} PF (${f.hpMax-f.hp}/${f.hpMax} rimasti)`)}),
 "foe-acted":o=>upd(()=>{const f=foe(o.id);f.acted=!f.acted}),
 "foe-cond":o=>upd(()=>{const f=foe(o.id);f.cond=f.cond.includes(o.k)?f.cond.filter(c=>c!==o.k):[...f.cond,o.k]}),
 "foe-feat":o=>upd(()=>{const f=foe(o.id),x=f.feats[+o.i];
  if(x.fx==="no-hosp"){noHosp();f.acted=true;return}if(x.fx==="peace"){peace();f.acted=true;return}
  if(x.c){const [k,n]=x.c.split(":");if(k==="fear"){if(S.fear<+n){toast("Paura insufficiente");return}addFear(-n,`${f.name}: ${x.n}`)}else{foeMark(f,"st",+n);log(`${f.name} segna ${n} Stress per ${x.n}`)}}
  f.acted=true;log(`${f.name} usa ${x.n}`,"fear")}),
 "foe-hit":o=>upd(()=>{const f=foe(o.id);const v=+document.getElementById("fd-in-"+o.id).value||0;if(!v)return;foeTakeDamage(f,v)}),
 r:o=>startRoll({...o}),
 "r-who":o=>{if(ROLL.pend)startRoll({...ROLL.pend.o,who:o.id})},
 "r-trait":o=>{if(ROLL.pend)startRoll({...ROLL.pend.o,trait:o.i})},
 "r-tgt":o=>{if(ROLL.pend)startRoll({...ROLL.pend.o,target:o.id})},
 "rp-cancel":()=>{ROLL.pend=null;renderRoll()},
 "rp-close":()=>{ROLL.cur=null;ROLL.showHist=false;renderRoll()},
 "rp-hist":()=>{ROLL.showHist=!ROLL.showHist;renderRoll()},
 "rm-exp":o=>{const res=ROLL.cur,r=pcRaw(res?.who);if(!r)return;const e=P(r).exp[+o.i];if(r.hope<1){toast("Speranza esaurita");return}r.hope--;res.exps.push({n:e[0],v:e[1]});res.effects.push(`${pcName(r.id)}: −1 Speranza per l'Esperienza.`);recalc(res);log(`${res.label}: +${e[1]} «${e[0]}» → ${res.total} (${res.verdict})`);persist();render()},
 "rm-help":o=>{const res=ROLL.cur,h=pcRaw(o.id);if(!res||!h||h.hope<1)return;h.hope--;res.helpers.push(pcName(h.id));res.adv.push(d(6));recalc(res);log(`${res.label}: aiuto di ${pcName(h.id)} → ${res.total} (${res.verdict})`);persist();render()},
 "rm-adv":()=>{const res=ROLL.cur;if(!res)return;res.adv.push(d(6));recalc(res);persist();render()},
 "rm-dis":()=>{const res=ROLL.cur;if(!res)return;res.dis.push(d(6));recalc(res);persist();render()},
 "rp-apply-pc":o=>upd(()=>{const res=ROLL.cur;if(!res||res.total==null)return;pcDamage(o.id,res.total,!!o.arm);res.applied=true;toast(`${pcName(o.id)} subisce ${res.total} danni`)}),
 "rp-apply-foe":o=>upd(()=>{const res=ROLL.cur,f=foe(o.id);if(!res||!f||res.total==null)return;foeTakeDamage(f,res.total);toast(`${f.name} subisce ${res.total} danni`)}),
 "foe-kill":o=>upd(()=>{const f=foe(o.id);if(f.dead){f.dead=false;f.hp=Math.min(f.hp,Math.max(0,f.hpMax-1))}else{f.hp=f.hpMax;foeDefeated(f)}}),
 "foe-del":o=>upd(()=>{S.foes=S.foes.filter(f=>f.id!==o.id);if(openFoe===o.id)openFoe=null}),
 "new-round":o=>upd(()=>{S.foes.filter(f=>!o.w||f.where===o.w).forEach(f=>f.acted=false);log("Nuovo giro di riflettori")}),
 "add-foe":()=>upd(()=>spawn(document.getElementById("add-tmpl").value,clamp(+document.getElementById("add-n").value||1,1,12),S.act+":"+SECTIONS[S.act]()[0].id)),
 "clear-dead":()=>upd(()=>S.foes=S.foes.filter(f=>!f.dead)),
 "clear-foes":()=>upd(()=>{S.foes=[];foeRoll.res=null;openFoe=null}),
 "cd-pip":o=>upd(()=>{const c=S.cds.find(x=>x.id===o.id),n=+o.i+1;c.v=c.v===n?n-1:n}),
 "cd-tick":o=>upd(()=>{const c=S.cds.find(x=>x.id===o.id);c.v=clamp(c.v+(+o.k),0,c.max);log(`${c.name}: ${c.v}`)}),
 "cd-del":o=>upd(()=>S.cds=S.cds.filter(c=>c.id!==o.id)),
 "cd-add":()=>{const n=document.getElementById("cd-name").value.trim();if(!n){toast("Dai un nome al conto");return}const m=clamp(+document.getElementById("cd-max").value||4,1,12);upd(()=>S.cds.push({id:uid(),name:n,max:m,v:m,note:""}))},
 // generatore
 "scn-done":o=>upd(()=>{S.scn[o.k]=true;scnOpen.delete(o.k);const [a,id]=o.k.split(":");log(`Scena ${sceneNum(a,id)} conclusa`);setTimeout(()=>document.getElementById("end-"+o.k.replace(/[:.]/g,"_"))?.scrollIntoView({behavior:"smooth",block:"center"}),0)}),
 "scn-reopen":o=>upd(()=>{delete S.scn[o.k];scnOpen.set(o.k,true)}),
 "scn-fold":o=>{scnOpen.set(o.k,false);render()},
 "scn-next":o=>{const [a,id]=o.k.split(":");scnOpen.set(o.k,true);if(a!==S.act){A.goact({k:a})}else{render()}setTimeout(()=>document.getElementById(`scn-${a.replace(".","_")}-${id}`)?.scrollIntoView({behavior:"smooth",block:"start"}),30)},
 "dev-done":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);dv.done=true;scnOpen.delete("dev:"+dv.id);log(`Scena improvvisata conclusa: ${parseDev(dv.raw).titolo||""}`);setTimeout(()=>document.getElementById("end-"+dv.where.replace(/[:.]/g,"_"))?.scrollIntoView({behavior:"smooth",block:"center"}),0)}),
 "dev-reopen":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);dv.done=false;scnOpen.set("dev:"+dv.id,true)}),
 "dev-edit":o=>{composer={where:"re:"+o.id};const dv=S.devs.find(x=>x.id===o.id);if(dv)G.kind=dv.kind||G.kind;scnOpen.set("dev:"+o.id,true);render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "gen-open":o=>{composer={where:o.w};render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "gen-close":()=>{composer=null;render()},
 "g-kind":o=>{const t=document.getElementById("gen-txt")?.value;G.kind=o.k;render();const e=document.getElementById("gen-txt");if(e&&t!=null)e.value=t},
 "gen-go":o=>{const t=(document.getElementById("gen-txt")?.value||"").trim();if(o.w.startsWith("re:")){const dv=S.devs.find(x=>x.id===o.w.slice(3));if(dv)generate(dv.where,t,G.kind,dv.id)}else generate(o.w,t,G.kind)},
 "gen-stop":()=>G.ctrl?.abort(),
 "dev-regen":o=>{const dv=S.devs.find(x=>x.id===o.id);if(dv&&!G.busy)generate(dv.where,dv.user,dv.kind,dv.id)},
 "dev-del":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);S.devs=S.devs.filter(x=>x!==dv);if(dv)S.foes=S.foes.filter(f=>f.where!==dv.act+":dev:"+dv.id)}),
 "dev-foe":o=>upd(()=>{picker=null;const dv=S.devs.find(x=>x.id===o.id);const r=parseDev(dv.raw).avv[+o.i];if(!r)return;const thr=String(r[4]||"").split("/").map(x=>parseInt(x));
  const dmg=(String(r[9]||"").match(/\d*d\d+\s*[+-]?\s*\d*/)||[""])[0].replace(/\s/g,"");
  const src={name:r[0],tier:1,type:r[1]||"Standard",diff:parseInt(r[3])||12,thr:[isNaN(thr[0])?null:thr[0],isNaN(thr[1])?null:thr[1]],hp:clamp(parseInt(r[5])||3,1,12),st:clamp(parseInt(r[6])||1,0,6),atk:parseInt(r[7])||0,
   attack:{n:(r[8]||"Attacco").split(/[·,(]/)[0].trim(),r:((r[8]||"").match(/Molto Vicina|Molto Lontana|Mischia|Vicina|Lontana/i)||["Mischia"])[0],d:dmg||"1d6+2",ty:/mag/i.test(r[9]||"")?"mag":"fis"},
   feats:r.slice(10).filter(Boolean).map(x=>{const [n,...rest]=x.split(":");return {n:n.trim(),k:"Azione",x:rest.join(":").trim()||x}}),minion:/minion|gregar/i.test(r[1]||""),desc:parseDev(dv.raw).titolo||""};
  const n=clamp(parseInt(r[2])||1,1,10);for(let i=0;i<n;i++)S.foes.push(mkFoe(src,dv.act+":dev:"+dv.id,n>1?` #${i+1}`:""));log(`In scena: ${n>1?n+"× ":""}${src.name}`)}),
 "dev-npc":o=>upd(()=>{picker=null;const dv=S.devs.find(x=>x.id===o.id);const r=parseDev(dv.raw).png[+o.i];if(!r)return;
  S.foes.push(mkFoe({name:r[0],type:"PNG",desc:r[1]||"",mot:r[2]||"",diff:parseInt(r[3])||12,feats:[]},dv.act+":dev:"+dv.id,""));log(`In scena: ${r[0]}`)}),
 "dev-cd":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);const c=parseDev(dv.raw).conti[+o.i];if(!c)return;const m=clamp(parseInt(c[1])||4,1,12);S.cds.push({id:uid(),name:c[0],max:m,v:m,note:c[2]||""});toast("Conto aggiunto nella scheda Scontro")}),
 reset:()=>{resetAsk=true;renderBar()},
 "reset-no":()=>{resetAsk=false;renderBar()},
 "reset-yes":()=>{resetAsk=false;S=fresh();openFoe=openPc=null;scnOpen.clear();encOpen.clear();picker=null;composer=null;deathFor=null;ROLL={cur:null,hist:[],pend:null,showHist:false};foeRoll.res=null;top0();persist();render();toast("Nuova campagna pronta")}
};

document.addEventListener("click",e=>{
  const sum=e.target.closest("details.scn>summary");
  if(sum){const d=sum.parentElement,key=d.dataset.scn||"dev:"+d.dataset.dev;setTimeout(()=>scnOpen.set(key,d.open),0);return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const f=A[b.dataset.a];if(f){f(b.dataset,b);flushShows()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".mc[data-a],.enc[data-a]")){e.preventDefault();A[e.target.dataset.a](e.target.dataset)}});
document.addEventListener("change",e=>{
  const el=e.target,o=el.dataset;if(!o.f)return;const v=el.value;
  switch(o.f){
    case "pc-over":{const r=pcRaw(o.id);r.over[o.k]=clamp(+v||0,0,o.k.endsWith("Max")?12:40);const p=P(r);r.hp=Math.min(r.hp,p.hpMax);r.st=Math.min(r.st,p.stMax);r.ar=Math.min(r.ar,p.arMax);persist();render();return}
    case "foe-cond-add":{const f=foe(o.id);if(v&&f&&!f.cond.includes(v)){f.cond.push(v);log(`${f.name}: ${v}`);persist();render()}return}
    case "pc-notes":pcRaw(o.id).notes=v;persist();return;
    case "critter":S.critters[+o.i]=v;persist();render();return;
    case "bargain":S.flags.bargain=v;log(v?`${pcName(v)} accetta il patto dello Strixwolf`:"Nessun patto fatato","fear");persist();render();return;
    case "drownpc":drownPick=v;return;
    case "elderpc":elderPick=v;return;
    case "home-n":S.home[+o.i].n=v;persist();return;
    case "home-note":S.home[+o.i].note=v;persist();return;
    case "notes":S.notes=v;persist();return;
  }
});
render();
</script>
