<meta charset="utf-8">
<title>Tavolo di Daggerheart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: barra fissa (Paura · Contatore · Atti · Gruppo · Dadi) / copione dell'atto al centro / pannello Gruppo a scomparsa a destra / dadi in un pannello flottante */
:root{
  --bg:#e4e7df; --paper:#f1f2ec; --ink:#1d2421; --muted:#5b665f; --line:#c3cabf;
  --moss:#3f5a48; --moss-soft:#d5dfd3;
  --hope:#a8741a; --hope-soft:#f0e2c2;
  --fear:#6a3f86; --fear-soft:#e5daee;
  --blood:#9b2f2a; --blood-soft:#f1d9d5;
  --ok:#2f6d43; --plate:#2a312d; --plate-fg:#f1f2ec; --ask:#1f6f8b; --ask-soft:#d9ebf0;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-read:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293;
  --plate:#cfd6cc; --plate-fg:#161b18; --ask:#6cc3df; --ask-soft:#14303a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293;
  --plate:#cfd6cc; --plate-fg:#161b18; --ask:#6cc3df; --ask-soft:#14303a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hope);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .xsmall{font-size:.76rem}
.lab{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* temi scelti dalle Opzioni: valgono sulla pagina e sulle anteprime ([data-skin] su qualsiasi elemento) */
:root[data-skin="bosco"],[data-skin="bosco"]{--bg:#e4e7df; --paper:#f1f2ec; --ink:#1d2421; --muted:#5b665f; --line:#c3cabf; --moss:#3f5a48; --moss-soft:#d5dfd3; --hope:#a8741a; --hope-soft:#f0e2c2; --fear:#6a3f86; --fear-soft:#e5daee; --blood:#9b2f2a; --blood-soft:#f1d9d5; --ok:#2f6d43; --plate:#2a312d; --plate-fg:#f1f2ec; --ask:#1f6f8b; --ask-soft:#d9ebf0; color-scheme:light}
:root[data-skin="notte"],[data-skin="notte"]{--bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32; --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17; --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293; --plate:#cfd6cc; --plate-fg:#161b18; --ask:#6cc3df; --ask-soft:#14303a; color-scheme:dark}
:root[data-skin="pergamena"],[data-skin="pergamena"]{--bg:#e8dcc2; --paper:#f4ead3; --ink:#2b2118; --muted:#6e5d48; --line:#cdb994; --moss:#7a2e22; --moss-soft:#ead0c2; --hope:#9a6a12; --hope-soft:#f1dfb5; --fear:#5a3a78; --fear-soft:#e3d6e8; --blood:#9b2f2a; --blood-soft:#f0d3c9; --ok:#4d6b2f; --plate:#3a2a1e; --plate-fg:#f4ead3; --ask:#2c5f73; --ask-soft:#d6e4e3; color-scheme:light}
:root[data-skin="brace"],[data-skin="brace"]{--bg:#15100c; --paper:#1f1813; --ink:#f0e4d2; --muted:#b09a82; --line:#3b2e24; --moss:#e08a4a; --moss-soft:#3a2516; --hope:#f0b44c; --hope-soft:#3b2c12; --fear:#c48ad8; --fear-soft:#32223a; --blood:#ef7a6a; --blood-soft:#3d1c18; --ok:#9cc27a; --plate:#e9d6bb; --plate-fg:#1a130e; --ask:#7cc6d8; --ask-soft:#15303a; color-scheme:dark}
:root[data-skin="abisso"],[data-skin="abisso"]{--bg:#0c141d; --paper:#122030; --ink:#dde8f2; --muted:#93a8bb; --line:#26394c; --moss:#5fb8c9; --moss-soft:#143140; --hope:#e6b450; --hope-soft:#33290f; --fear:#a99af0; --fear-soft:#26214a; --blood:#ef7f7a; --blood-soft:#3a1b1e; --ok:#78c79a; --plate:#c9dbe8; --plate-fg:#0e1822; --ask:#7fd0ea; --ask-soft:#12303d; color-scheme:dark}
:root[data-skin="arcano"],[data-skin="arcano"]{--bg:#e6e2ee; --paper:#f4f2f8; --ink:#211c2c; --muted:#625a73; --line:#c9c1d8; --moss:#4f3f86; --moss-soft:#dcd5ee; --hope:#a26d12; --hope-soft:#f1e2c0; --fear:#8a2f6e; --fear-soft:#f0d8e8; --blood:#a2302e; --blood-soft:#f2d8d6; --ok:#2f6d50; --plate:#2a2438; --plate-fg:#f4f2f8; --ask:#1f6f8b; --ask-soft:#d9ebf0; color-scheme:light}
:root[data-skin="contrasto"],[data-skin="contrasto"]{--bg:#ffffff; --paper:#ffffff; --ink:#000000; --muted:#2e2e2e; --line:#000000; --moss:#00552b; --moss-soft:#d8eedf; --hope:#7a4c00; --hope-soft:#ffe9b8; --fear:#4b0f7a; --fear-soft:#eadcf7; --blood:#9a0000; --blood-soft:#ffd9d9; --ok:#00552b; --plate:#000000; --plate-fg:#ffffff; --ask:#00506b; --ask-soft:#d6eef7; color-scheme:light}
/* ---- opzioni ---- */
.opt-btn{display:inline-flex;align-items:center;gap:6px}
.opt-btn svg{width:16px;height:16px}
.opt{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(10,12,11,.55);animation:lbFade .18s ease both}
.opt-p{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:sbIn .25s both}
.opt-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.opt-b{padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.skin{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);transition:transform .15s,border-color .15s}
.skin:hover{transform:translateY(-2px)}
.skin:focus-visible{outline:2px solid var(--hope);outline-offset:2px}
.skin.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.sk{background:var(--bg);color:var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px;height:92px;position:relative}
.sk-bar{height:10px;border-radius:3px;background:var(--plate)}
.sk-card{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:5px}
.sk-l{height:5px;border-radius:3px;background:var(--ink);width:70%} .sk-l.m{background:var(--muted);width:45%}
.sk-d{display:flex;gap:4px;margin-top:auto} .sk-d i{width:10px;height:10px;border-radius:50%}
.sk.auto{background:linear-gradient(135deg,#e4e7df 50%,#111613 50%)}
.skin-n{padding:6px 10px 8px;font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:6px;align-items:center}
.skin-n small{font-weight:400;color:var(--muted);font-size:.74rem}
/* ---- barra: pulsanti a icona, linguetta del gruppo ---- */
.ib{width:34px;height:34px;display:inline-grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);cursor:pointer;color:var(--ink);padding:0;transition:background .15s,color .15s}
.ib svg{width:18px;height:18px}
.ib:hover:not(:disabled){background:var(--paper)}
.ib:disabled{opacity:.38;cursor:default}
.ib.xs{width:24px;height:24px} .ib.xs svg{width:14px;height:14px}
.save-ind.ib{cursor:help;color:var(--muted);background:transparent;border-color:transparent}
.save-ind.ok{color:var(--moss)} .save-ind.bad{color:var(--blood)}
.bar-r{gap:4px}
@media (max-width:1400px){body .bar-in{gap:10px 12px}body .brand b{max-width:14ch;font-size:1.25rem}body .fp{width:12px;height:12px}body .counter .lab{font-size:.62rem}}
.opt-sec{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;flex-direction:column;gap:8px}
.log-undo{margin-left:auto}
.party-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:-6px 0 18px rgba(0,0,0,.14);transition:padding .2s,background .2s}
.party-tab:hover{padding-right:12px;background:var(--bg)}
.party-tab svg{width:20px;height:20px}
.party-tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.party-tab[hidden],body.alt .party-tab,body.hub .party-tab{display:none}
/* incontri: ambiente a tutta larghezza, partecipanti in fila */
.enc-grid:not(.with-pcs){display:flex;flex-wrap:wrap;align-items:stretch}
.enc-grid:not(.with-pcs)>.mc{flex:0 1 250px;min-width:min(100%,220px)}
.enc-grid:not(.with-pcs)>.mc.pick{flex:1 1 320px}
.enc-grid:not(.with-pcs)>.enc-plus{flex:0 0 64px;min-height:0;align-self:stretch}
.ec-wide .ec-h{flex-wrap:wrap;gap:8px}
.ec-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ec-sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.ec-trk{display:inline-flex;gap:3px}
@media (max-width:600px){.enc-grid:not(.with-pcs)>.mc{flex:1 1 100%}.ec-sep{display:none}}
.ec-trk i{width:14px;height:14px;border:1.5px solid var(--blood);border-radius:3px}
.ec-trk i.on{background:var(--blood)}
/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
@media (max-width:700px){.bar{position:static}}
.bar-in{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.brand span{font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.meter{display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 11px;cursor:pointer;font-family:var(--f-display);font-size:1rem}
.acts button.on{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.acts button.done{border-color:var(--moss);color:var(--moss)}
.bar-r{display:flex;gap:6px;margin-left:auto;align-items:center}
.fear-pips{display:flex;gap:3px;flex-wrap:wrap;max-width:250px}
.fp{width:14px;height:14px;transform:rotate(45deg);border:1.5px solid var(--fear);background:transparent;cursor:pointer;padding:0;border-radius:2px}
.fp.on{background:var(--fear)}
.counter{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:3px 8px}
.counter.live{border-color:var(--blood);background:var(--blood-soft)}
.counter .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;min-width:2ch;text-align:center}
.tgl{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:4px 12px;cursor:pointer;font-weight:700}
.tgl.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* pagina */
.page{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.page.party{grid-template-columns:minmax(0,1fr) 360px}
.party-pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 86px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.party-pane[hidden]{display:none}
@media (max-width:1100px){
  .page.party{grid-template-columns:minmax(0,1fr)}
  .party-pane{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);max-height:none;z-index:40;background:var(--bg);border-left:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 30px rgba(0,0,0,.25)}
}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hope)}
.main{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel>h4{margin-bottom:6px}
.scn{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);scroll-margin-top:84px}
.scn>summary{list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;cursor:pointer}
.scn>summary::-webkit-details-marker{display:none}
.scn>summary::before{content:"▸";color:var(--muted);font-size:.8rem}
.scn[open]>summary::before{content:"▾"}
.scn[open]>summary{border-bottom:1px solid var(--line)}
.scn-n{font-family:var(--f-mono);font-size:.72rem;background:var(--ink);color:var(--paper);padding:1px 7px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.scn-k{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.scn-t{font-family:var(--f-display);font-size:1.35rem;line-height:1.15;flex:1 1 200px;min-width:0}
.scn.cur{border-color:var(--hope);box-shadow:inset 4px 0 0 var(--hope)}
.scn.done .scn-t{color:var(--muted)}
.scn-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.scn.imp{border-color:var(--fear);margin-left:22px}
.scn.pre{border-style:dashed}
.scn.pre .scn-n{background:var(--ask)}
.ask textarea{margin-top:2px}
.scn.imp .scn-n{background:var(--fear)}
.scn.imp .scn-k{color:var(--fear)}
@media (max-width:600px){.scn.imp{margin-left:8px}}
.frame{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);font-size:.92rem}
.frame>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.scn-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dotted var(--line);padding-top:10px}
.scn-end{border:1px dashed var(--moss);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--moss-soft)}
.scn-end.imp-end{margin-left:22px}
@media (max-width:600px){.scn-end.imp-end{margin-left:8px}}
.act-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.act-h .num{font-family:var(--f-mono);font-size:.8rem;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;letter-spacing:.08em}

/* «leggi ad alta voce»: un foglio di pergamena appoggiato sulla pagina, uguale in ogni tema */
.read{--ink-p:#2e2215;position:relative;font-family:var(--f-read);font-style:italic;font-size:1.14rem;line-height:1.6;color:var(--ink-p);
 background:radial-gradient(ellipse at 50% 45%,rgba(255,250,232,.55),rgba(255,250,232,0) 70%),url("diario/parchment-a.jpg") center/160% auto,#eadcb8;
 padding:20px 24px 18px;margin:6px 4px;border-radius:3px 7px 4px 6px/6px 3px 7px 4px;transform:rotate(-.25deg);
 box-shadow:inset 0 0 26px rgba(122,78,28,.38),inset 0 0 3px rgba(90,55,20,.45),0 1px 1px rgba(0,0,0,.12),0 8px 18px -6px rgba(40,25,10,.35)}
.read:nth-of-type(even){transform:rotate(.2deg)}
.read::before{content:"";position:absolute;top:-9px;left:50%;width:92px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(236,226,196,.62);
 box-shadow:0 1px 2px rgba(0,0,0,.12);backdrop-filter:blur(1px);border-left:1px dashed rgba(120,100,60,.25);border-right:1px dashed rgba(120,100,60,.25)}
.read p{margin:0 0 .6em} .read p:last-child{margin:0}
.read b,.read strong{font-style:normal;font-family:var(--f-display);font-weight:400}
.read .cue{color:#7a2e22;font-style:normal;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.read,.read:nth-of-type(even){transform:none}}
.cue{font-family:var(--f-body);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--moss);font-weight:700;display:block;margin-bottom:4px}
.note{border-left:3px solid var(--hope);padding:8px 12px;background:var(--hope-soft);border-radius:0 var(--r) var(--r) 0}
.warn{border-left:3px solid var(--blood);padding:8px 12px;background:var(--blood-soft);border-radius:0 var(--r) var(--r) 0}
ul.tight,ol.tight{margin:4px 0;padding-left:20px} .tight li{margin:2px 0}
p{margin:0}

.ask{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--ask-soft);border:1.5px solid var(--ask);border-radius:14px 14px 14px 3px;padding:10px 14px 12px 10px;position:relative}
.ask-ico{width:34px;height:34px;border-radius:50%;background:var(--ask);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:1.35rem;line-height:1;flex:none}
.ask-cue{display:block;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ask);margin-bottom:2px}
.ask p{font-size:1.05rem;font-weight:500;line-height:1.4}
.ask .ask-x{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.asks{display:flex;flex-direction:column;gap:8px}

.pact{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--fear);border-radius:10px;padding:10px 12px;background:var(--fear-soft)}
.pact>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.pact b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.pact.yes{border-color:var(--hope);background:var(--hope-soft)} .pact.no{border-color:var(--blood);background:var(--blood-soft)}
.pend{border:1px dashed var(--muted);border-radius:var(--r);padding:8px 12px;color:var(--muted);font-size:.92rem}
details.alt{border:1px dashed var(--line);border-radius:var(--r);padding:6px 12px}
details.alt>summary{font-weight:700;color:var(--muted);font-size:.9rem}
details.alt[open]>summary{margin-bottom:8px}
.scn.skipped{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 14px;opacity:.6;border-style:dashed}
.scn.skipped .scn-t{flex:0 1 auto;font-size:1.1rem;text-decoration:line-through}
.outq{border:2px solid var(--hope);border-radius:10px;background:var(--hope-soft);padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* pips */

  return {v:2,savedAt:0,act:'1',tab:'atto',fear:5,counter:{on:false,value:15},critters:["",""],
   flags:{luna:null,pact:null,ring:false,bargain:"",bargainUsed:false,learned:null,shortcut:null,searchTick:false,elderDone:false,peaceUsed:false,ritualHere:null,rest:null,ritualDone:false,final:null},
   chase:{d:3,t:3},river:{t:4},ritual:{v:8},villagers:0,elderSt:0,undertow:null,loot:[],
   pcs:Object.keys(PREGEN).map(mkPC),home:[{n:"",note:""}],foes:[],cds:[],log:[],devs:[],scn:{},out:{},notes:"",rest:{}};
}
function migrate(s){
  if(!s||typeof s!=="object")return fresh();
  if(s.v===2){
    s.scn=s.scn||{};s.out=s.out||{};s.home=Array.from(s.home||[],h=>h||{n:"",note:""});if(s.flags&&s.flags.pact===undefined)s.flags.pact=null;
    const moved={"2:silenzio":"2:emissari","3:ingresso":"3:arcanista","4:fine":"4:rituale"};
    (s.devs||[]).forEach(x=>{if(moved[x.where])x.where=moved[x.where];if(x.done==null)x.done=false});
    (s.foes||[]).forEach(f=>{if(moved[f.where])f.where=moved[f.where]});
    return s;
  }
  const n=fresh();
  for(const k of["act","fear","counter","critters","flags","chase","river","ritual","villagers","elderSt","loot","home","log","notes","cds"])if(s[k]!==undefined)n[k]=s[k];
  return n;
}

// unione per id: vince la voce toccata più di recente; le campagne eliminate restano come lapidi
function mergeCamps(r){
  if(!r||!Array.isArray(r.list))return false;
  const before=JSON.stringify(CAMPS),del=new Set([...CAMPS.del,...(r.del||[])]),m=new Map();
  [...CAMPS.list,...r.list].forEach(c=>{if(!c||!c.id||del.has(c.id))return;const o=m.get(c.id);if(!o||(c.at||0)>(o.at||0))m.set(c.id,c)});
  CAMPS={list:[...m.values()].sort((a,b)=>(a.created||0)-(b.created||0)),del:[...del]};
  return JSON.stringify(CAMPS)!==before;
}

let UNDO=[],undoBase=null,undoTop="",undoAt=0;
const undoKey=s=>JSON.stringify(Object.assign({},s,{savedAt:0,tab:""}));
const logSig=s=>s.log&&s.log[0]?s.log[0].t+"|"+s.log[0].text:"";
function undoReset(){UNDO=[];undoAt=0;undoBase=APP.camp?undoKey(S):null;undoTop=APP.camp?logSig(S):"";undoPaint()}
function undoTrack(){
  const cur=undoKey(S),top=logSig(S);
  if(undoBase==null){undoBase=cur;undoTop=top;return}
  if(cur===undoBase)return;
  const now=Date.now(),grew=top!==undoTop;
  // più salvataggi ravvicinati dello stesso clic diventano un solo passo
  if(now-undoAt>400||!UNDO.length){UNDO.push({json:undoBase,label:grew?S.log[0].text:"",sig:grew?top:""});if(UNDO.length>60)UNDO.shift()}
  else if(grew){const u=UNDO[UNDO.length-1];u.label=S.log[0].text;u.sig=top}
  undoAt=now;undoBase=cur;undoTop=top;undoPaint();
}
const undoTitle=()=>UNDO.length?"Annulla: "+(UNDO[UNDO.length-1].label||"ultima modifica"):"Niente da annullare";
function undoPaint(){const b=document.getElementById("undo-btn");if(b){b.disabled=!UNDO.length;b.title=undoTitle();b.setAttribute("aria-label",undoTitle())}}
function undo(){
  const u=UNDO.pop();if(!u)return;
  const tab=S.tab;S=migrate(JSON.parse(u.json));S.tab=tab;
  undoBase=undoKey(S);undoTop=logSig(S);undoAt=0;
  openFoe=openPc=null;picker=null;composer=null;deathFor=null;
  persist();render();toast("Annullato"+(u.label?": "+u.label:""));
}

/* ================= utilità ================= */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=n=>1+Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sgn=n=>(n>=0?"+":"")+n;
function rollExpr(expr){
  const m=String(expr).replace(/\s/g,"").match(/^(\d*)d(\d+)([+-]\d+)?$/i);
  if(!m){const n=parseInt(expr);return isNaN(n)?null:{total:n,rolls:[],text:String(n)}}
  const c=+(m[1]||1),f=+m[2],mod=+(m[3]||0);const rolls=[];for(let i=0;i<c;i++)rolls.push(d(f));
  const total=rolls.reduce((a,b)=>a+b,0)+mod;
  return {total,rolls,text:`${expr} → [${rolls.join(", ")}]${mod?" "+sgn(mod):""} = ${total}`};
}
function log(text,kind=""){S.log.unshift({t:new Date().toTimeString().slice(0,5),text,kind});if(S.log.length>250)S.log.length=250}
let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}
function upd(fn){fn();persist();render()}

function counterAdd(n,why){if(!S.counter.on)return false;S.counter.value+=n;log(`Contatore d'Assalto ${sgn(n)} → ${S.counter.value}${why?" ("+why+")":""}`,"bad");return true}

/* ================= meccaniche PG ================= */
let deathFor=null;
function pcMarkStress(id,n,why){
  const r=pcRaw(id),p=P(r);let over=0;
  for(let i=0;i<n;i++){if(r.st<p.stMax)r.st++;else over++}
  log(`${p.name}: +${n-over} Stress${why?" ("+why+")":""}`);
  if(over){r.hp=Math.min(p.hpMax,r.hp+over);log(`${p.name}: Stress pieno → segna ${over} PF`,"bad")}
  checkDown(id);
}
function hpFromDamage(dmg,major,severe){
  if(dmg<=0)return 0;
  if(severe!=null&&dmg>=severe)return 3;
  if(major!=null&&dmg>=major)return 2;
  return 1;
}
function pcMarkHp(id,hp,why){const r=pcRaw(id),p=P(r);r.hp=Math.min(p.hpMax,r.hp+hp);log(`${p.name} segna ${hp} PF${why?" ("+why+")":""}`,"bad");checkDown(id)}
function toggleCond(list,c,who){
  if(list.includes(c))return list.filter(x=>x!==c);
  if(who==="khari"&&list.includes("Inarrestabile")&&(c==="Vulnerabile"||c==="Trattenuto")){toast("Khari è Inarrestabile: non può essere Vulnerabile né Trattenuta");return list}
  let out=[...list,c];
  if(c==="Inarrestabile")out=out.filter(x=>x!=="Vulnerabile"&&x!=="Trattenuto");
  return out;
}
const pcHpPreview=(r,dmg)=>{const q=P(r);return Math.max(0,hpFromDamage(dmg,q.major,q.severe)-(r.cond.includes("Inarrestabile")?1:0))};
function pcDamage(id,dmg,useArmor){
  const r=pcRaw(id),p=P(r);let hp=hpFromDamage(dmg,p.major,p.severe);let note="";
  if(r.cond.includes("Inarrestabile")&&hp>0){hp--;note+=", −1 Inarrestabile"}
  if(useArmor&&hp>0&&r.ar<p.arMax){r.ar++;hp--;note+=", −1 con 1 slot Armatura"}
  r.hp=Math.min(p.hpMax,r.hp+hp);log(`${p.name} subisce ${dmg} danni → ${hp} PF${note}`,"bad");checkDown(id);
}
function checkDown(id){const r=pcRaw(id),p=P(r);if(r.hp>=p.hpMax){deathFor=id;log(`${p.name} ha segnato l'ultimo PF: Mossa di Morte!`,"bad")}}

const dieSides=expr=>{const m=String(expr).match(/d(\d+)/i);return m?+m[1]:6};
function facesOf(res){
  if(res.t==="dual")return [{v:res.hope,s:12,c:"h"},{v:res.fear,s:12,c:"f"},...res.adv.map(v=>({v,s:6,c:"n"})),...res.dis.map(v=>({v,s:6,c:"n"}))];
  if(res.t==="atk")return [{v:res.d20,s:20,c:"n"}];
  return res.parts.flatMap(pt=>pt.x.rolls.map(v=>({v,s:dieSides(pt.x.expr),c:"n"})));

function startRoll(o){
  const r=o.who&&o.who!=="gen"?pcRaw(o.who):null;
  if(o.t==="dual"&&!o.who){ROLL.pend={o,ask:"who"};renderRoll();return}
  if(o.t==="dual"&&o.trait==="ask"&&r){ROLL.pend={o,ask:"trait"};renderRoll();return}
  if(o.t==="atk"&&!o.target){ROLL.pend={o,ask:"target"};renderRoll();return}

    if(P0.ask==="trait"){const q=pcById(o.who);body=`<div class="rp-h"><div><span class="lab">${esc(q.name)} · con quale tratto?</span><b>${esc(o.label||"Tiro d'azione")}${o.diff?` · Diff ${esc(o.diff)}`:""}</b></div><button class="btn xs" data-a="rp-cancel" aria-label="Annulla">×</button></div>
      <div class="rp-mods">${TRAITS.map((t,i)=>`<button class="btn" data-a="r-trait" data-i="${i}">${t} <span class="mono">${sgn(q.tr[i])}</span></button>`).join("")}</div>`}
    if(P0.ask==="target"){const f=foe(o.foe);body=`<div class="rp-h"><div><span class="lab">Chi attacca?</span><b>${esc(f?.name||"")} · d20${sgn(f?.atk||0)}</b></div><button class="btn xs" data-a="rp-cancel" aria-label="Annulla">×</button></div>
      <div class="rp-mods">${S.pcs.map(r=>{const q=P(r);return `<button class="btn" data-a="r-tgt" data-id="${r.id}">${esc(q.name)} <span class="mono">Ev ${q.eva}</span></button>`}).join("")}</div>`}
    const fresh=lastShown!=="pend";lastShown="pend";
    el.innerHTML=`<div class="rp-card ${fresh?"fresh":""}">${body}</div>`;el.hidden=false;return;
  }
  if(!ROLL.cur){el.hidden=true;el.innerHTML="";return}
  const prev=ROLL.hist.filter(h=>h!==ROLL.cur).slice(0,5);
  const fresh=lastShown!==ROLL.cur.id;lastShown=ROLL.cur.id;
  el.innerHTML=`<div class="rp-card ${fresh?"fresh":""}">${resultHTML(ROLL.cur)}
   ${prev.length?`<button class="rp-hist-t" data-a="rp-hist">${ROLL.showHist?"▾":"▸"} Tiri precedenti (${prev.length})</button>${ROLL.showHist?`<ul class="rp-hist">${prev.map(h=>`<li><span class="mono xsmall muted">${esc(h.at)}</span> ${esc(h.label)} — <b>${h.t==="dual"?esc(h.verdict)+" ("+h.total+")":h.t==="atk"?(h.hit?"colpito":"mancato")+" ("+h.total+")":h.total??h.parts.map(p=>p.x.total).join(", ")}</b></li>`).join("")}</ul>`:""}`:""}</div>`;
  el.hidden=false;
}

function mkFoe(src,where,suffix){
  return {id:uid(),tmpl:src.key||"",name:(src.swarm&&src.plural?src.plural:src.name)+(suffix||""),swarm:src.swarm||"",tier:src.tier||1,type:src.type||"Standard",sub:src.sub||"",desc:src.desc||"",mot:src.mot||"",
    hpMax:src.hp||0,stMax:src.st||0,hp:0,st:0,thr:src.thr||[null,null],diff:src.diff??null,sugg:!!src.sugg,atk:src.atk??null,attack:src.attack||null,
    exp:src.exp||[],feats:src.feats||[],tips:src.tips||[],minion:!!src.minion,cond:[],acted:false,dead:false,where};
}
function spawn(key,n,where){
  const t={...T[key],key};const same=S.foes.filter(f=>f.tmpl===key).length;
  const numbered=t.type!=="PNG"&&t.type!=="Social"&&(n>1||same>0);
  for(let i=0;i<n;i++)S.foes.push(mkFoe(t,where,numbered?` #${same+i+1}`:""));
  log(`In scena: ${n>1?n+"× ":""}${t.name}`);
}
function foeDefeated(f){
  if(f.dead)return;f.dead=true;log(`${f.name} è sconfitto`,"ok");
  if(S.act==='4'&&!S.flags.ritualDone&&(f.tmpl==='skeleton'||f.tmpl==='hero')){S.ritual.v=Math.max(0,S.ritual.v-1);log(`Rituale −1 → ${S.ritual.v}`,"ok");if(S.ritual.v===0)toast("Il Rituale è a zero: leggi «Il rituale termina»")}
}
const foe=id=>S.foes.find(f=>f.id===id);
let openFoe=null;
function swarmDamage(f,v){
  const n=S[f.swarm]||0,k=Math.min(n,v>0?1+Math.floor(v/3):0);S[f.swarm]=n-k;
  log(`${v} danni a ${f.name}: ${k} sconfitti (${S[f.swarm]} restano)`);
  if(f.tmpl==="villager"&&k&&!S.flags.peaceUsed)toast("Un PG ha attaccato un paesano: l'Anziano può usare CI SARÀ PACE (2 Paura)");
}
const swarmRow=(f,big)=>{const n=S[f.swarm]||0;return `<div class="${big?"bt-row":"mc-r"} swarm-r"><span class="lab">Numero</span><button class="btn xs" data-a="swarm" data-id="${f.id}" data-k="-1" aria-label="Uno in meno">−</button><b class="mono swarm-n">${n}</b><button class="btn xs" data-a="swarm" data-id="${f.id}" data-k="1" aria-label="Uno in più">+</button>${n?"":`<span class="xsmall muted">nessuno in scena</span>`}</div>`};
function foeTakeDamage(f,v){
  if(f.swarm){swarmDamage(f,v);return}
  if(f.minion){foeDefeated(f);const extra=Math.floor(v/3);if(extra)log(`${v} danni: sconfiggi altri ${extra} gregari a portata`);return}
  const hp=hpFromDamage(v,f.thr[0],f.thr[1]);foeMark(f,"hp",hp);log(`${f.name} subisce ${v} danni → ${hp} PF (${f.hpMax-f.hp}/${f.hpMax})`);
}
function foeMark(f,k,n){
  if(k==="st"){const over=Math.max(0,f.st+n-f.stMax);f.st=Math.min(f.stMax,f.st+n);if(over&&f.hpMax){f.hp=Math.min(f.hpMax,f.hp+over);log(`${f.name}: Stress pieno → ${over} PF`)}}
  if(k==="hp")f.hp=Math.min(f.hpMax,f.hp+n);
  if(f.tmpl==="elder"){S.elderSt=f.st;syncElder()}
  if(f.hpMax&&f.hp>=f.hpMax)foeDefeated(f);
}

const ask=(q,extra="",cue="Chiedi ai giocatori")=>`<div class="ask"><span class="ask-ico" aria-hidden="true">?</span><div><span class="ask-cue">${cue}</span><p>${q}</p>${extra?`<div class="ask-x">${extra}</div>`:""}</div></div>`;
const read=(html,cue="Leggi ad alta voce")=>`<div class="read"><span class="cue">${cue}</span>${html}</div>`;
const hybrid=()=>{const [a,b]=S.critters;return a&&b?`${esc(a)}-${esc(b)}`:"[ibrido delle due creature]"};
const luna=()=>S.flags.luna==="saved";
const nShades=()=>S.pcs.length>=4?3:2;
const counterChip=()=>S.counter.on?`<span class="chip bad">Contatore: ${S.counter.value}</span>`:`<span class="chip">Contatore non attivo</span>`;
const aliveShades=()=>S.foes.filter(f=>f.tmpl==="scarshade"&&!f.dead).length;
const aliveSkel=()=>S.foes.filter(f=>f.tmpl==="skeleton"&&!f.dead).length;
let drownPick="",elderPick="";
const castBtn=(key,label,n,where)=>`<button class="btn xs ok" data-a="spawn" data-k="${key}" data-n="${n}" data-w="${where}">+ ${label}</button>`;

/* ---- testi finali da leggere: usano i PNG di casa e il rivale annotati all'inizio ---- */
const homeNames=()=>{const n=S.home.filter(Boolean).map(h=>(h.n||"").trim()).filter(Boolean).map(esc);return n.length?n.length>1?n.slice(0,-1).join(", ")+" e "+n[n.length-1]:n[0]:""};
const rivalName=()=>S.rival&&S.rival.trim()?esc(S.rival.trim()):"";
function ending(k){
  const npc=homeNames(),one=S.home.filter(h=>h&&(h.n||"").trim()).length===1,riv=rivalName()||"il vostro rivale",Riv=rivalName()||"Il vostro rivale";
  const who=npc||"le persone che speravate di proteggere",Who=npc?npc.charAt(0).toUpperCase()+npc.slice(1):"Le persone che speravate di proteggere";
  const letter=luna()?`<p>Una settimana dopo arriva una lettera da Hush, scritta con una calligrafia minuscola. Luna vi saluta, vi ringrazia, e vi fa notare che siete comunque arrivati in ritardo.</p>`
   :`<p>Una settimana dopo arriva una lettera da Hush, con un sigillo di cera bianca. L'Arcanista vi ringrazia e chiede, ancora una volta, come sta il piccolo Emeris.</p>`;
  const crowd=`<p>L'onda di magia passa sopra i tetti e la città si ferma di colpo. Le orso-vespe cadono come foglie secche, gli alberi animati tornano legno. Per un momento non si sente niente. Poi qualcuno, giù in piazza, grida i vostri nomi, e la piazza li ripete.</p>`;
  return {
   ff:`<p>Quando la luce si spegne, il silenzio pesa più dell'assedio. Le mura esterne sono annerite e metà dei tetti del quartiere basso non c'è più.</p>
    <p>Cercate ${who} tra la folla, ma la folla non vi restituisce ${one?"quel volto":"quei volti"}. Più tardi un sacerdote vi accompagna nel cortile del tempio, dove i lenzuoli sono allineati sull'erba.</p>
    <p>Re Emeris VIII vi riceve in piedi, senza farvi sedere. «Vi ho affidato la città, e me l'avete riportata a pezzi.» Non vuole spiegazioni. Prima di sera un araldo legge il bando in piazza: avete tre giorni per lasciare il regno.</p>
    <p>All'alba vi incamminate verso il confine. Alle vostre spalle qualcuno sta già sgomberando le macerie dalla porta est.</p>`,
   fh:`<p>L'ultima onda di magia si spegne e la città riprende fiato. Non tutta. ${Who} non ${one?"ce l'ha fatta":"ce l'hanno fatta"}: ve lo dicono quando il fumo si è ormai diradato.</p>
    <p>Tre giorni dopo, davanti alla statua di Emeris II, il re vi appunta sul petto una spilla d'argento. La folla applaude, i bambini salgono sulle spalle dei genitori per vedervi meglio.</p>
    <p>Poi il re alza una mano, e la piazza resta zitta per un minuto intero, per chi non è tornato a casa.</p>
    <p>La sera, nella corona della statua, il cippo brilla di nuovo. Da sotto non si vede quasi.</p>`,
   sf:`<p>Gli Scarshade vanno in frantumi come vetro e quel che resta dell'assedio scappa verso il Sablewood. ${Who} vi ${one?"viene":"vengono"} incontro zoppicando, con le bende sporche e graffi dappertutto, ma ${one?"ce l'ha fatta":"ce l'hanno fatta"}.</p>
    <p>Nella sala del trono, però, non si parla di voi. ${Riv} è in piedi accanto al re, con il mantello strappato ad arte, e racconta a tutti di come ha fatto da scudo a Emeris VIII sulle scale del castello. Il re annuncia per ${riv} un titolo nuovo e un posto nel consiglio.</p>
    <p>Quando uscite, ${riv} vi fa un cenno con la testa e sorride.</p>`,
   sh:`${crowd}<p>${Who} si ${one?"fa":"fanno"} largo tra la gente per abbracciarvi, senza un graffio.</p>
    <p>La sera stessa re Emeris VIII vi riceve a palazzo. Vi offre oro, terre e un posto alla sua tavola, e vi chiede una sola cosa: che fra un paio di secoli, quando il cippo si scaricherà di nuovo, qualcuno sappia raccontare questa storia all'Arcanista.</p>${letter}`,
   crit:`${crowd}<p>${Who} si ${one?"fa":"fanno"} largo tra la gente per abbracciarvi, senza un graffio.</p>
    <p>Più tardi, tra le macerie della porta est, le guardie trovano il corpo di ${riv}, tra le poche vittime dell'assedio. Al banchetto nessuno ne parla, e voi non fate domande.</p>
    <p>Re Emeris VIII vi offre oro, terre e un posto alla sua tavola. Il vino è buono e la musica va avanti fino a tardi.</p>${letter}`
  }[k];
}
const rivalInput=()=>`<label class="inl small">Rivale odiato <input type="text" id="rival-in" data-f="rival" value="${esc(S.rival||"")}" placeholder="nome, se i giocatori ne hanno uno" aria-label="Rivale odiato"></label>`;
const F={
 inizio:{k:"Inseguimento",luogo:"Un bivacco nel Sablewood, sotto alberi alti centinaia di metri: è giorno, ma sembra notte fonda.",posta:"Raggiungere Luna prima che sia troppo tardi.",uscita:"Distanza a 0: Luna è viva. Tempo a 0: Luna è morta. In entrambi i casi si arriva alla radura."},
 prezzo:{k:"Sociale · Combattimento",luogo:"Una piccola radura tra radici enormi.",posta:"La vita di Luna, e forse un debito con uno spirito antico.",uscita:"Patto accettato, Strixwolf in fuga o Luna morta: il gruppo riprende il cammino verso Hush."},
 emissari:{k:"Combattimento",luogo:"Il sentiero, avvolto da un silenzio innaturale.",posta:"Il segreto del pacco: se gli Scarshade leggono il Saggio di Corte, la città è in pericolo.",uscita:"Gli Scarshade cadono o svaniscono; si stabilisce se hanno scoperto la verità."},
 polvere:{k:"Scelta",luogo:"Il sentiero dopo lo scontro, tra le tracce degli Scarshade.",posta:"Il tempo: ogni ora persa avvicina l'assalto alla città.",uscita:"Scorciatoia (Atto II½) oppure sentiero lungo, con il Contatore +2 (Atto III)."},
 fiume:{k:"Traversata",luogo:"Le rive del fiume Orfanatore, una cascata orizzontale di acqua bianca.",posta:"Attraversare senza perdere nessuno, né l'equipaggiamento.",uscita:"Traversata a 0 senza nessuno che annega."},
 arcanista:{k:"Esplorazione · Sociale",luogo:"Hush, oltre la barriera del cippo silenzioso: capanne di legno e sguardi ostili.",posta:()=>luna()?"Farsi accettare: Luna garantisce per il gruppo.":"Trovare l'Arcanista senza farsi cacciare dal villaggio.",uscita:()=>luna()?"Luna li guida verso l'Arcanista: arriva l'Anziano Halython.":"Un paesano accetta di guidarli: arriva l'Anziano Halython."},
 anziano:{k:"Sociale",luogo:"La piazza di Hush, con i paesani che si radunano attorno.",posta:"Essere accolti o cacciati, e la pace del villaggio.",uscita:"Con 4 Stress l'Anziano si arrende e indica la villa."},
 villa:{k:"Sociale",luogo:"Il viale dei volti intagliati e la villa sull'albero più alto.",posta:"Capire cosa serve al rituale, e quanto tempo resta.",uscita:"L'Arcanista propone la Valle Aperta (o il villaggio) per il rituale."},
 preparare:{k:"Riposo",luogo:()=>S.flags.ritualHere?"Hush, ai piedi dell'albero della villa.":"La Valle Aperta, l'unico punto del Sablewood da cui si vede il cielo.",posta:"Recuperare le forze, al prezzo di tempo e Paura.",uscita:"Il rituale inizia."},
 rituale:{k:"Combattimento · Evento",luogo:()=>S.flags.ritualHere?"Hush, mentre la foresta attorno al villaggio urla.":"La Valle Aperta, mentre la foresta urla.",posta:"Proteggere l'Arcanista finché il sigillo non è rinnovato.",uscita:"Rituale a 0: i nemici diventano polvere e i PG diventano libellule."},
 finale:{k:"Evento",luogo:"Il cielo sopra la città assediata.",posta:"Le persone care ai PG e il regno stesso.",uscita:"Il tiro finale decide l'esito."},
 risolvere:{k:"Epilogo",luogo:"Il castello e la statua di re Emeris II.",posta:"Come verrete ricordati.",uscita:"Fine dell'avventura."}
};
const SECTIONS={
'1':()=>[
 {id:"inizio",t:"Grida nel buio",f:F.inizio,html:()=>`
 ${ask("Nominate due creature della foresta: si fonderanno in un ibrido che brulica nel sottobosco.",`<input type="text" id="cr0" data-f="critter" data-i="0" value="${esc(S.critters[0])}" placeholder="es. tasso" aria-label="Prima creatura"><span>+</span><input type="text" id="cr1" data-f="critter" data-i="1" value="${esc(S.critters[1])}" placeholder="es. falena" aria-label="Seconda creatura"><b>= ${hybrid()}</b>`,"Prima di leggere")}
 ${read(`<p>Siete attorno a un fuoco. Dovrebbe essere giorno, ma gli alberi del Sablewood salgono per centinaia di metri e coprono il cielo intero: sembra piena notte.</p>
 <p>Tutto intorno sentite il gracidare dei lemuri-rospo e il brulicare di sciami di <b>${hybrid()}</b> nel sottobosco.</p>
 <p>Da un paio d'ore aspettate Luna, una cacciatrice del villaggio di Hush che, secondo le lettere scambiate, dovrebbe guidarvi. È <i>molto</i> in ritardo.</p>`)}
 ${campfire()}
 ${read(`<p>Poi, in lontananza, delle grida. Qualcuno chiede aiuto, e potrebbe essere lei. Le urla vengono da un centinaio di metri, e il terreno è così impervio che non siete sicuri di arrivare in tempo, se non date tutto. Cosa fate?</p>`)}
 <p class="small muted">Questo incontro insegna i tiri d'azione. Descrivi 1 o 2 ostacoli alla volta.</p>
 `},
 {id:"prezzo",t:"Un prezzo da pagare",f:F.prezzo,html:()=>{
  const dead=`${read(`<p>D'un tratto vi rendete conto che sono quasi dieci secondi che non sentite più gridare.</p><p>Arrivate in una piccola radura, ma trovate solo il corpo senza vita della cacciatrice che doveva guidarvi. Chi o cosa l'ha uccisa se n'è già andato.</p>`)}
  ${ask("Chi si avvicina al corpo, e cosa fa?","","Se il gruppo si ferma")}
  ${read(`<p>A un dito porta un anello magico che tira sempre in una direzione: una fede nuziale, incantata per indicare dove si trova lo sposo di chi la indossa.</p>`,"Se perquisiscono il corpo")}`;
  const saved=`${read(`<p>Vedete una fata ferita a terra che grida aiuto. È grande appena come due mele e indossa una pelle d'ornitorinco come mantello da caccia.</p>
  <p>Accanto a lei c'è un lupo gigante e maestoso con la testa di gufo. Il suo pelo è così bianco che sembra un'apparizione. Quando si volta verso di voi, sentite una voce nella testa:</p>
  <p>«Allontanatevi, mortali. Costei ha cacciato un cucciolo del mio branco, e per questo deve pagare un prezzo.»</p>`)}
  <p>Lo <b>Strixwolf</b> è un grande spirito, creato per proteggere le specie più rare del Sablewood. Luna non sapeva che l'ornitorinco che indossa era sotto la sua protezione.</p>
  ${ask("Chi di voi risponde allo Strixwolf, e cosa gli dice?","","Dopo le parole dello Strixwolf")}
  <div class="panel stack"><h4>Patto fatato</h4>
  ${read(`<p>«Una vita per una vita: questo è il prezzo che chiedo. Eppure vedo fuoco nella tua anima, e mi fa credere che potresti saziare la mia fame con la <i>sorpresa</i> invece che con il sangue.</p><p>Concedimi un solo momento del tuo tempo, e lo userò per metterti alla prova. Prima che il tuo viaggio finisca reclamerò quel momento, e ti farò minacciare la vita che mi è dovuta. Cosa accadrà dopo, sono curioso di scoprirlo.»</p>`,"Se viene chiesto")}
  <p class="small muted">Chi accetta: ad Hush attaccherà un PNG (se è drammatico), <i>oppure</i> nel tiro finale saboterà gli alleati dando svantaggio.</p>
  ${pactUI()}</div>`;
  return branch(S.flags.luna==="saved"?"a":S.flags.luna==="dead"?"b":null,["Se Luna è viva",saved],["Se Luna è morta",dead],S.out["1:inizio"]==="Deviazione improvvisata"?"Si decide alla fine della scena improvvisata: quando torni alla trama qui resterà solo il ramo giusto.":"Concludi la scena 1: in base all'inseguimento qui resterà solo il ramo giusto.")}},
],
'2':()=>[
 {id:"emissari",t:"Emissari degli Antichi Dèi",f:F.emissari,html:()=>`
 ${read(`<p>Mentre continuate a camminare succede qualcosa di strano. Non sentite più gli scarabei-serpente né i lama-saltafango. La foresta si fa stranamente silenziosa.</p>`)}
 ${luna()?read(`<p>Luna si volta verso di voi: «Oh, <i>bastoncini</i>, qualunque cosa stiate trasportando, sembra che gli Dèi Dimenticati l'abbiano percepita, e ne vogliono un pezzo.»</p>`,"Luna è con il gruppo"):""}
 <p>I giocatori hanno un paio di minuti per prepararsi. Gli shade sono attratti dalla magia che filtra dal pacco ma non ne conoscono la posizione esatta. I PG possono nascondersi, ma gli shade usano l'Esperienza <b>Percepire la Magia +4</b>.</p>
 ${ask("Avete un paio di minuti: come vi preparate?","","Prima che arrivino gli shade")}
 <h4>Arrivano gli emissari</h4>
 ${read(`<p>Sagome gigantesche e distorte emergono dalla boscaglia. Sono come buchi nel tessuto della realtà: puoi vederci attraverso, ma ciò che vedi è un'altra foresta.</p><p>Gli alberi sono più verdi, più sottili, non così assurdamente alti. È come se dentro questi squarci a forma umana ci fosse la visione di com'era la foresta in un passato lontano, prima che gli Antichi Dèi venissero uccisi qui.</p>`)}
 ${read(`<p>Uno di loro tende un braccio verso il pacco. E capite subito cosa questa cosa ha detto senza parole: pretende di sapere cos'è.</p>`,"Se vedono il pacco")}
 <p>Gli Scarshade sono resti degli Antichi Dèi, con un odio infinito per chi adora i Nuovi Dèi, compreso il regno dei PG. Proveranno lo <b>Scavo nella Memoria</b>.</p>
 ${ask("Descrivi un momento terrificante della tua infanzia.","","Al PG colpito dallo Scavo nella Memoria")}`},
 {id:"polvere",t:"Al bivio",f:F.polvere,html:()=>{
  const L=S.flags.learned;
  if(L==null)return pendNote(S.out["2:emissari"]==="Deviazione improvvisata"?"Si decide alla fine della scena improvvisata: torna alla trama dicendo se gli Scarshade hanno scoperto il pacco.":"Concludi la scena 3: se gli Scarshade hanno scoperto il pacco, qui comparirà il bivio della scorciatoia.");
  if(L===false)return `<div class="note">Gli Scarshade non hanno scoperto nulla: nessuna urgenza e nessun bivio. Il gruppo prosegue verso Hush.</div>`;
  return `<div class="warn">Gli Scarshade sanno del pacco. Contatore d'Assalto alla Città: <b>${S.counter.on?S.counter.value:"—"}</b>, la Difficoltà del tiro finale.</div>
  <p><b>La scorciatoia.</b> Con questa urgenza, i giocatori potrebbero cercare una scorciatoia attraverso le parti più pericolose del Sablewood.</p>
  <ul class="tight"><li>${luna()?"<b>Luna è con il gruppo:</b> può indicare la strada.":"Luna non c'è: un PG fa un tiro di <b>Istinto</b> a Diff 15 per trovarla."}</li><li>Se proseguono senza scorciatoia, il Contatore sale di <b>2</b>.</li></ul>
  ${ask("Rischiate la scorciatoia nelle parti più pericolose della foresta, o restate sul sentiero?","","Al gruppo")}
  ${luna()?"":`<div class="row">${rb("Istinto · Diff 15",{t:"dual",trait:3,diff:15,label:"Trovare la scorciatoia"})}</div>`}`}}
],
'2.5':()=>[
 {id:"fiume",t:"Il fiume Orfanatore",f:F.fiume,html:()=>{const dr=S.pcs.filter(p=>p.cond.includes("Annegamento"));return `
 ${read(`<p>Il fragore incessante del famigerato fiume Orfanatore minaccia di assordarvi molto prima che lo vediate.</p><p>L'acqua è così turbolenta che sembra una cascata orizzontale.</p>`)}
 ${ask("Ognuno di voi mi dica una cosa che vede sporgere dall'acqua.","","Chiedi a ogni giocatore")}
 ${S.pcs.some(p=>p.id==="barnacle")?`<div class="note small">Barnacle è anfibio, ma ha paura dell'acqua e non nuota.</div>`:""}
 
 <div class="note small"><b>Glossario:</b> una condizione temporanea come Annegamento si rimuove con un tiro d'azione riuscito: qui contro la Difficoltà 13 del fiume. Finché non riesce, ogni tiro d'azione di un PG (anche il suo tentativo di liberarsi) fa segnare 1 Stress a chi annega. I tiri reazione non generano Speranza né Paura. Le carte nel deposito non si possono usare: tornano nella dotazione con un riposo, oppure segni Stress pari al costo di richiamo per scambiarle con una carta della dotazione.</div>
 ${S.river.t===0?`<div class="note">Il gruppo ha attraversato il fiume.</div>`:""}`}}
],
'3':()=>[
 {id:"arcanista",t:"Il villaggio che non vuole ospiti",f:F.arcanista,html:()=>`
 ${read(`<p>Dopo un altro paio d'ore nel Sablewood trovate un cippo di pietra a terra, scolpito come un volto accigliato con un dito premuto in verticale sulle labbra corrugate.</p><p>Sembra che i suoi occhi seguano i vostri movimenti, anche se siete <i>quasi certi</i> che la statua sia immobile.</p>`)}
 ${luna()?read(`<p>Luna gli svolazza accanto con disinvoltura… e scompare.</p>`,"Luna è con il gruppo"):""}
 ${read(`<p>Sentite una piccola sensazione, come lo scoppio di una bolla, e il brusio si fa più forte. Oltre questa barriera magica si rivela il villaggio di Hush, con decine di capanne di legno e gli sguardi di qualche dozzina di volti diffidenti. </p>`,"Quando superano il cippo")}
 ${ask("Ditemi tre cose che vedete e che vi fanno capire quanto questo posto sia ostile.")}
 ${luna()?`<div class="note">Luna è con il gruppo: passa direttamente all'<b>Anziano Halython</b>.</div>`:""}
 ${luna()?"":`<h4>Trovare l'Arcanista</h4>
 ${S.counter.on?`<div class="row">${counterChip()}<span class="small muted">qualche minuto di ricerca costa +1, applicato alla fine della scena</span></div>`:""}
 <p>Quasi tutti rifiutano di parlare con i PG: bisbigliano, fissano, sputano a terra, se ne vanno. La posizione dell'Arcanista dovrebbe restare segreta: temono che il gruppo sia un intruso.</p>
 ${ask("Chi di voi prova ad attaccare discorso, e come?","","Mentre cercano")}
 <p class="small">Dopo un po' trovano gli unici disposti a parlare: Fidget, Lausa e Octavio.${S.flags.ring?" <b>Il gruppo ha la fede di Luna: indica Octavio, suo marito.</b>":""}</p>`}`},
 {id:"anziano",t:"L'Anziano Halython",f:F.anziano,html:()=>`
 ${read(`<p>D'improvviso sentite un tonfo alle vostre spalle. Un uomo anziano, alto poco più di un metro, ha appena sbattuto a terra la punta del suo bastone, pretendendo attenzione e rispetto.</p><p>La persona con cui stavate parlando balbetta: «Anziano Halython? Non stavo cercando di…»</p><p>Il vecchio halfling la interrompe: «Non un'altra parola. Hai già detto troppo. Quanto a voi, dovete lasciare questo villaggio. Subito.»</p>`,"Quando un paesano accetta di guidarli")}
 ${ask("Cosa dite all'Anziano per non farvi cacciare?","","Dopo le sue parole")}
 `}
],
'4':()=>[
 {id:"villa",t:"Villa Fuocobianco",f:F.villa,html:()=>`
 ${read(`<p>Superando le case notate che qui gli alberi hanno centinaia di volti intagliati su ogni lato, con gli occhi che scrutano in ogni direzione. Quando passate accanto a un intaglio, la bocca si apre ed emette piccole fiamme bianche che illuminano il sentiero.</p><p>Un albero, più alto degli altri, regge tra i rami una villa di legno. Rune blu dipinte nella corteccia si accendono, il ramo si anima e l'intera struttura scende lentamente fino a terra.</p><p>Al posto della porta c'è un bocciolo gigante, largo forse tre metri, che si schiude rivelando petali colorati. Al centro c'è un'apertura da cui esce una figura alta più di due metri: un misto tra un umanoide e una lucciola, in vesti da maga bianca, carica di libri e pozioni.</p><p>«Vi stavo aspettando. Spero che nessuno abbia scoperto cosa trasportavate. L'ultima volta che la vostra città è rimasta indifesa così, i seguaci degli Antichi Dèi l'hanno quasi rasa al suolo. Comunque, come sta il piccolo Emeris? È ancora vivo?»</p>`)}
 <p class="small">L'Arcanista ha diverse migliaia di anni. Parla di Emeris IV; il re che ha assunto il gruppo è Emeris VIII. Ha creato il sigillo e ha un accordo con la stirpe reale: ogni paio di secoli lo rinnova, e il Regno in cambio evita il Sablewood. Se le chiedono perché i paesani non sapessero della consegna: «Oh, l'avevo detto… mi pare 12 o 13 anni fa?»</p>
 ${ask("Cosa volete chiedere all'Arcanista?","","Mentre conversano")}
 ${read(`<p>«Dovremmo andare nella Valle Aperta per il rituale. È solo a un paio di miglia. Un incantesimo del genere attirerà creature pericolose dagli angoli più oscuri del Sablewood: dalle vostre facce capisco che ne avete già incontrate alcune. …E preferirei che succedesse fuori dal villaggio. Quel ragazzino Lylython è un tipo lunatico, si mette a urlarmi contro ogni volta che un esperimento va storto.»</p>`,"Quando ha parlato abbastanza")}`},
 {id:"preparare",t:"La quiete prima",f:F.preparare,html:()=>`
 ${S.flags.ritualHere!==true?read(`<p>Entrate in una radura larga un paio di centinaia di metri, così perfettamente circolare da sembrare innaturale. Per quanto ne sapete, è l'unico posto del Sablewood dove si vede il cielo.</p><p>L'Arcanista inizia a preparare il rituale: «Mi serve un'ora per prepararmi. Godetevi l'aria della notte finché potete. Presto saremo molto occupati.»</p>`,"Se vanno alla Valle Aperta"):""}
 ${ask(S.flags.ritualHere?"Come passate l'ora prima del rituale?":"Come passate l'ora sotto il cielo, l'unico che si veda nel Sablewood?","","Mentre l'Arcanista si prepara")}
 ${S.counter.on?`<p class="small">Con il Contatore attivo i giocatori possono saltare il riposo e aiutare con la preparazione: lo sceglierai alla fine della scena.</p>`:""}
 <div class="panel stack"><h4>Riposo breve</h4><p class="small">Ogni PG sceglie fino a due opzioni (anche la stessa due volte).</p>

 {id:"rituale",t:"Il Rituale del Rinnovo",f:F.rituale,html:()=>`
 ${read(`<p>Quando siete pronti, l'Arcanista dà inizio al rituale. Il suo corpo e la pietra del sigillo iniziano a brillare, e grida ultraterrene risuonano dai boschi mentre le creature vicine percepiscono l'energia arcana.</p>`)}
 ${ask("Come vi disponete attorno all'Arcanista?","","Prima che escano dagli alberi")}

 ${S.flags.ritualDone||S.ritual.v===0?"":`<details class="alt"><summary>Il rituale termina (quando il conto arriva a zero)</summary>`}

 ${read(`<p>Lancia un incantesimo che vi trasforma tutti in libellule con la testa umanoide. «L'insetto più veloce della natura, con qualche miglioria mia. Dovrebbe aiutarvi a tornare a casa. Buona fortuna, e salutatemi il piccolo Emeris!»</p>`,"Quando i giocatori accettano")}
 ${S.flags.ritualDone||S.ritual.v===0?"":"</details>"}`}
],

 {id:"finale",t:"La città sotto assedio",f:F.finale,html:()=>{const bp=pcById(S.flags.bargain);return `
 ${read(`<p>Dopo aver volato per centinaia di chilometri in un paio d'ore, vedete finalmente la vostra città all'orizzonte: tre cerchi concentrici di mura, ognuno più alto del precedente, e un enorme castello al centro.</p><p>E in questo momento la città è sotto assedio: orso-vespe giganti attaccano dal cielo, alberi animati del Sablewood colpiscono le mura con le radici, e alcuni degli Scarshade di prima seminano il caos per le strade.</p><p>Ora sapete esattamente dove va la pietra: l'avete vista decine di volte, come uno dei gioielli della corona della statua di re Emeris II, davanti al castello. Tutto si riduce a questo: riuscirete ad arrivarci in tempo?</p>`)}
 ${ask(`Chi cercate con lo sguardo tra le mura?${S.home.filter(h=>h&&h.n).length?` <span class="small muted">(PNG di casa: ${esc(S.home.filter(h=>h&&h.n).map(h=>h.n).join(", "))})</span>`:""}`,"","Prima del tiro finale")}

 <ul class="tight small"><li>1 Speranza: usare un'<b>Esperienza</b> per un bonus.</li><li>1 Speranza: <b>Aiutare</b> (vantaggio, +d6; con più fonti si tiene il più alto).</li><li>3 Speranza ciascuno: <b>Tiro di Squadra</b>, si tiene il migliore.</li><li>Istinti Felini di Varian o Adattabilità di Garrick possono fare la differenza.</li></ul>
 ${bp&&!S.flags.bargainUsed?`<div class="warn"><b>Patto fatato:</b> ${esc(bp.name)} non ha attaccato nessuno ad Hush, quindi sabota gli alleati: il tiro finale ha <b>svantaggio</b>.</div>`:""}

function parseDev(raw){
  const o={tiri:[],png:[],avv:[],conti:[],paura:[],domande:[],scelte:[]};let last=null;
  const multi={TIRO:"tiri",PNG:"png",AVVERSARIO:"avv",CONTO:"conti",PAURA:"paura",DOMANDA:"domande",SCELTA:"scelte"};
  const single=["TITOLO","TIPO","LUOGO","POSTA","LEGGI","SCENA","USCITA","RACCORDO","SUCCESSO","FALLIMENTO","CONTATORE"];
  for(const line of String(raw||"").split("\n")){
    const m=line.match(/^\s*[*-]?\s*\**([A-ZÀÈÉÌÒÙ]+)\**\s*:\s*(.*)$/);
    if(m&&(multi[m[1]]||single.includes(m[1]))){
      const k=m[1],v=m[2].trim();
      if(multi[k]){if(v&&!/^nessun/i.test(v))o[multi[k]].push(v.split("|").map(s=>s.trim()));last=null}

    }else if(last&&line.trim())o[last]+=" "+line.trim();
  }
  return o;
}

async function polish(dv,sample){

async function generate(where,userText,kind,regenId){

  const errKey=regenId?"re:"+regenId:where;
  if(!sample){G.err[errKey]="L'improvvisazione usa Claude dal tuo account: apri il tracker su claude.ai per usarla.";render();return}
  let dv=regenId&&S.devs.find(x=>x.id===regenId);
  const prompt=devPrompt(where,userText,kind,regenId);
  if(dv){dv.prev=dv.raw;dv.raw="";dv.user=userText;dv.kind=kind;dv.done=false;delete dv.choice;delete dv.res}
  else{dv={id:uid(),where,act:where.split(":")[0],user:userText,kind,raw:"",done:false,at:new Date().toTimeString().slice(0,5)};S.devs.push(dv)}
  G.busy=dv.id;G.err[errKey]="";composer=null;scnOpen.set("dev:"+dv.id,true);render();
  document.querySelector(`details[data-dev="${dv.id}"]`)?.scrollIntoView({behavior:"smooth",block:"start"});
  G.ctrl=new AbortController();
  try{
    const out=await sample(prompt,{signal:G.ctrl.signal,modelTier:"default",cache:false,
      onText:({text})=>{dv.raw=text;const el=document.getElementById("devb-"+dv.id);if(el)el.innerHTML=devBody(dv);const t=document.getElementById("devt-"+dv.id);if(t)t.textContent=parseDev(text).titolo||"Sto improvvisando…"}});
    dv.raw=out.text;delete dv.prev;delete dv.polished;delete dv.polishErr;
    await polish(dv,sample);log(`Scena improvvisata: ${parseDev(dv.raw).titolo||"senza titolo"}`);
  }catch(e){
    const m={not_granted:"Accesso a Claude negato per questa pagina: puoi riattivarlo dal menu Permessi dell'artefatto.",rate_limited:"Troppe richieste ravvicinate: aspetta un momento.",cancelled:"Generazione interrotta.",refused:"Claude non ha generato questa scena: prova a cambiare il racconto.",session_expired:"Sessione scaduta: ricarica la pagina.",sampling_disabled:"La generazione con Claude non è attiva per questo account."};
    if(e?.code==="refused")dv.raw="";else if(e?.text&&e.code!=="cancelled")dv.raw=e.text;
    if(!dv.raw&&dv.prev){dv.raw=dv.prev}
    delete dv.prev;
    if(!dv.raw)S.devs=S.devs.filter(x=>x!==dv);
    G.err[regenId?"re:"+dv.id:where]=m[e?.code]||"Generazione non riuscita. Riprova.";
  }
  G.busy=null;G.ctrl=null;persist();render();
}

function renderAct(){

  const cur=secs.find(s=>!S.scn[S.act+":"+s.id]&&!skipReason(S.act+":"+s.id));
  return `<div class="act-h"><span class="num">ATTO ${a.n}</span><h2>${a.t}</h2><span class="small muted">${(()=>{const live=secs.filter(s=>!skipReason(S.act+":"+s.id));return live.length?`${live.filter(s=>S.scn[S.act+":"+s.id]).length}/${live.length} scene concluse`:"atto saltato"})()}</span></div>`+(S.act==="1"?preGame():"")+secs.map(s=>{

    const why=skipReason(key);
    if(why)return `<div class="scn skipped"><span class="scn-n">Scena ${n}</span><span class="scn-k">${s.f.k}</span><span class="scn-t">${s.t}</span><span class="chip">saltata</span><span class="small muted">${why}</span></div>`;
    const open=scnOpen.has(key)?scnOpen.get(key):!done;
    const devs=S.devs.filter(x=>x.where===key);
    return `<details class="scn ${done?"done":""} ${cur===s?"cur":""}" data-scn="${key}" id="scn-${S.act.replace(".","_")}-${s.id}" ${open?"open":""}><summary><span class="scn-n">Scena ${n}</span><span class="scn-k">${s.f.k}</span><span class="scn-t">${s.t}</span>${done?`<span class="chip ok">conclusa</span>`:cur===s?`<span class="chip hope">in corso</span>`:""}</summary>

}

const RULES=`<div class="stack"><h2>Regole di Daggerheart in breve</h2><div class="grid2">
<div class="panel"><h4>Tiro d'azione</h4><p>Tira 2d12 (Speranza e Paura), somma il tratto e i bonus: ≥ Difficoltà è un successo.</p><ul class="tight"><li><b>Con Speranza</b>: il PG ottiene 1 Speranza.</li><li><b>Con Paura</b>: il GM ottiene 1 Paura e di solito fa una mossa.</li><li><b>Critico</b> (dadi uguali): successo automatico, +1 Speranza, −1 Stress; in attacco danni massimi più il tiro.</li></ul></div>
<div class="panel"><h4>Vantaggio, Esperienze, Aiuto</h4><ul class="tight"><li><b>Vantaggio</b> +d6, <b>svantaggio</b> −d6; si annullano.</li><li><b>Esperienza</b>: 1 Speranza per aggiungere il bonus (+2).</li><li><b>Aiutare</b>: 1 Speranza per dare un d6 di vantaggio a un alleato.</li><li><b>Tiro di Squadra</b>: 3 Speranza; tirano due PG, si tiene il migliore.</li></ul></div>
<div class="panel"><h4>Soglie di danno</h4><p>Sotto la soglia <b>Grave</b>: 1 PF. Da Grave: 2 PF. Da <b>Severa</b>: 3 PF. Le soglie vengono dall'armatura più il livello. Uno slot <b>Armatura</b> riduce la gravità di una soglia. Se devi segnare Stress e non puoi, segni 1 PF. All'ultimo PF: Mossa di Morte.</p></div>
<div class="panel"><h4>Attacchi</h4><p>I PG attaccano con il tratto dell'arma contro la Difficoltà dell'avversario; i danni usano i dadi dell'arma per la Competenza (1). Gli avversari tirano d20 + ATK contro l'Evasione del PG.</p></div>
<div class="panel"><h4>Tiri reazione</h4><p>Per resistere a un effetto. Non generano Speranza né Paura.</p></div>
<div class="panel"><h4>Mosse di Morte</h4><ul class="tight"><li><b>Gloria Finale</b>: un'ultima azione con successo critico automatico, poi il PG muore.</li><li><b>Evitare la Morte</b>: perdi i sensi; tira il dado Speranza: se ≤ livello ottieni una cicatrice.</li><li><b>Rischiare Tutto</b>: tira i Dadi della Dualità. Speranza più alto: recuperi PF/Stress per il suo valore. Paura più alto: muori. Critico: recuperi tutto.</li></ul></div>
<div class="panel"><h4>Condizioni</h4><ul class="tight"><li><b>Vulnerabile</b>: i tiri contro di te hanno vantaggio.</li><li><b>Trattenuto</b>: non puoi muoverti; essendo temporanea, il GM può terminarla solo con una sua mossa.</li><li><b>Nascosto</b>: i tiri contro di te hanno svantaggio.</li><li>Le condizioni temporanee si rimuovono con un tiro d'azione.</li></ul></div>
<div class="panel"><h4>Riposo breve</h4><p>Due mosse a testa tra Curare ferite (1d4+1 PF), Ricomporsi (1d4+1 Stress), Riparare armatura (1d4+1 slot), Prepararsi (+1 Speranza, +2 se insieme). Il GM ottiene 1d4 Paura.</p></div>
<div class="panel"><h4>Il GM e la Paura</h4><p>Il GM inizia con 1 Paura per PG (massimo 12). Spende Paura per mosse extra, per mettere altri avversari sotto i riflettori, per azioni che costano Paura e per complicazioni. Non c'è ordine di turno: i riflettori passano a chi agisce.</p></div>
<div class="panel"><h4>Scene</h4><p>Una scena ha un luogo, dei personaggi e una posta in gioco. Il GM la inquadra, fa domande ai giocatori per coinvolgerli, sposta i riflettori e la chiude quando la posta è risolta. Se i PG prendono una strada inattesa, nasce una nuova scena: qui la improvvisi alla fine di quella appena giocata.</p></div>
<div class="panel"><h4>Distanze</h4><p>Mischia · Molto Vicina · Vicina · Lontana · Molto Lontana.</p></div>
</div></div>`;

async function shrinkImage(file,max){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file),k=Math.min(1,max/Math.max(bmp.width,bmp.height));
   if(k===1&&file.size<1.5e6)return file;
   const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
   return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.85))}catch(e){return file}
}
const asDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
async function uploadImages(files){
  VIEW.busy=true;render();let n=0;
  for(const f of files){
    if(!f.type.startsWith("image/"))continue;
    const title=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim()||"Immagine";
    try{
      if(VIEW.tdb){const b=await shrinkImage(f,2400),up=await VIEW.assets.upload(b);VIEW.gallery=VIEW.gallery.concat({gid:uid(),id:up.id,url:up.url,title})}
      else{const b=await shrinkImage(f,1280);VIEW.gallery=VIEW.gallery.concat({gid:uid(),url:await asDataURL(b),title})}
      n++;
    }catch(e){toast(e&&e.code==="quota_or_state"?"Spazio per le immagini esaurito: eliminane qualcuna":`Non sono riuscito a caricare «${title}»`)}
  }
  if(n)saveGallery();VIEW.busy=false;render();if(n)toast(n===1?"Immagine caricata":`${n} immagini caricate`);
}
