<title>Sablewood Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra fissa (Paura · Contatore · Atti · Gruppo · Dadi) / copione dell'atto al centro / pannello Gruppo a scomparsa a destra / dadi in un pannello flottante */
:root{
  --bg:#e4e7df; --paper:#f1f2ec; --ink:#1d2421; --muted:#5b665f; --line:#c3cabf;
  --moss:#3f5a48; --moss-soft:#d5dfd3;
  --hope:#a8741a; --hope-soft:#f0e2c2;
  --fear:#6a3f86; --fear-soft:#e5daee;
  --blood:#9b2f2a; --blood-soft:#f1d9d5;
  --ok:#2f6d43; --plate:#2a312d; --plate-fg:#f1f2ec; --ask:#1f6f8b; --ask-soft:#d9ebf0;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-read:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293;
  --plate:#cfd6cc; --plate-fg:#161b18; --ask:#6cc3df; --ask-soft:#14303a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --paper:#192019; --ink:#e3e7df; --muted:#9aa69c; --line:#2f3a32;
  --moss:#8fb79a; --moss-soft:#24332a; --hope:#e0aa4c; --hope-soft:#3a2e17;
  --fear:#b892d6; --fear-soft:#2f2339; --blood:#e0786e; --blood-soft:#3b1f1c; --ok:#7cc293;
  --plate:#cfd6cc; --plate-fg:#161b18; --ask:#6cc3df; --ask-soft:#14303a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hope);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .xsmall{font-size:.76rem}
.lab{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
@media (max-width:700px){.bar{position:static}}
.bar-in{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.brand span{font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.meter{display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 11px;cursor:pointer;font-family:var(--f-display);font-size:1rem}
.acts button.on{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.acts button.done{border-color:var(--moss);color:var(--moss)}
.bar-r{display:flex;gap:6px;margin-left:auto;align-items:center}
.fear-pips{display:flex;gap:3px;flex-wrap:wrap;max-width:250px}
.fp{width:14px;height:14px;transform:rotate(45deg);border:1.5px solid var(--fear);background:transparent;cursor:pointer;padding:0;border-radius:2px}
.fp.on{background:var(--fear)}
.counter{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:3px 8px}
.counter.live{border-color:var(--blood);background:var(--blood-soft)}
.counter .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;min-width:2ch;text-align:center}
.tgl{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:4px 12px;cursor:pointer;font-weight:700}
.tgl.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* pagina */
.page{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.page.party{grid-template-columns:minmax(0,1fr) 360px}
.party-pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 86px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.party-pane[hidden]{display:none}
@media (max-width:1100px){
  .page.party{grid-template-columns:minmax(0,1fr)}
  .party-pane{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);max-height:none;z-index:40;background:var(--bg);border-left:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 30px rgba(0,0,0,.25)}
}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hope)}
.main{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel>h4{margin-bottom:6px}
.scn{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);scroll-margin-top:84px}
.scn>summary{list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;cursor:pointer}
.scn>summary::-webkit-details-marker{display:none}
.scn>summary::before{content:"▸";color:var(--muted);font-size:.8rem}
.scn[open]>summary::before{content:"▾"}
.scn[open]>summary{border-bottom:1px solid var(--line)}
.scn-n{font-family:var(--f-mono);font-size:.72rem;background:var(--ink);color:var(--paper);padding:1px 7px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.scn-k{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.scn-t{font-family:var(--f-display);font-size:1.35rem;line-height:1.15;flex:1 1 200px;min-width:0}
.scn.cur{border-color:var(--hope);box-shadow:inset 4px 0 0 var(--hope)}
.scn.done .scn-t{color:var(--muted)}
.scn-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.scn.imp{border-color:var(--fear);margin-left:22px}
.scn.pre{border-style:dashed}
.scn.pre .scn-n{background:var(--ask)}
.ask textarea{margin-top:2px}
.scn.imp .scn-n{background:var(--fear)}
.scn.imp .scn-k{color:var(--fear)}
@media (max-width:600px){.scn.imp{margin-left:8px}}
.frame{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);font-size:.92rem}
.frame>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.scn-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dotted var(--line);padding-top:10px}
.scn-end{border:1px dashed var(--moss);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--moss-soft)}
.scn-end.imp-end{margin-left:22px}
@media (max-width:600px){.scn-end.imp-end{margin-left:8px}}
.act-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.act-h .num{font-family:var(--f-mono);font-size:.8rem;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;letter-spacing:.08em}

.read{font-family:var(--f-read);font-size:1.08rem;line-height:1.55;background:var(--moss-soft);border-left:3px solid var(--moss);padding:12px 16px;border-radius:0 var(--r) var(--r) 0}
.read p{margin:0 0 .6em} .read p:last-child{margin:0}
.cue{font-family:var(--f-body);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--moss);font-weight:700;display:block;margin-bottom:4px}
.note{border-left:3px solid var(--hope);padding:8px 12px;background:var(--hope-soft);border-radius:0 var(--r) var(--r) 0}
.warn{border-left:3px solid var(--blood);padding:8px 12px;background:var(--blood-soft);border-radius:0 var(--r) var(--r) 0}
ul.tight,ol.tight{margin:4px 0;padding-left:20px} .tight li{margin:2px 0}
p{margin:0}

.ask{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--ask-soft);border:1.5px solid var(--ask);border-radius:14px 14px 14px 3px;padding:10px 14px 12px 10px;position:relative}
.ask-ico{width:34px;height:34px;border-radius:50%;background:var(--ask);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:1.35rem;line-height:1;flex:none}
.ask-cue{display:block;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ask);margin-bottom:2px}
.ask p{font-size:1.05rem;font-weight:500;line-height:1.4}
.ask .ask-x{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.asks{display:flex;flex-direction:column;gap:8px}

.pact{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--fear);border-radius:10px;padding:10px 12px;background:var(--fear-soft)}
.pact>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.pact b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.pact.yes{border-color:var(--hope);background:var(--hope-soft)} .pact.no{border-color:var(--blood);background:var(--blood-soft)}
.pend{border:1px dashed var(--muted);border-radius:var(--r);padding:8px 12px;color:var(--muted);font-size:.92rem}
details.alt{border:1px dashed var(--line);border-radius:var(--r);padding:6px 12px}
details.alt>summary{font-weight:700;color:var(--muted);font-size:.9rem}
details.alt[open]>summary{margin-bottom:8px}
.scn.skipped{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 14px;opacity:.6;border-style:dashed}
.scn.skipped .scn-t{flex:0 1 auto;font-size:1.1rem;text-decoration:line-through}
.outq{border:2px solid var(--hope);border-radius:10px;background:var(--hope-soft);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.outq>b{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.outopt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.outopt:hover{border-color:var(--ink)}
.outopt b{font-size:1rem}
.outopt span{font-size:.85rem;color:var(--muted)}
.outopt i{font-size:.7rem;font-weight:800;font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--hope)}
.outopt.sug{border-color:var(--hope);box-shadow:inset 3px 0 0 var(--hope)}
.outopt .go{font-size:.75rem;font-weight:700;color:var(--moss)}
.outopt.imp{border-style:dashed;border-color:var(--fear);background:var(--fear-soft)}
.outopt.imp b{color:var(--fear)}
.outq .composer{border:0;padding:0;background:none}

/* box di regole (inseguimento, fiume, rituale) */
.stat{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.stat-h{background:var(--plate);color:var(--plate-fg);display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 12px;flex-wrap:wrap}
.stat-h b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.stat-h span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.stat-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}

/* pips */
.pips{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.pip{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.pip.on{background:var(--ink);border-color:var(--ink)}
.pip.hp{border-radius:4px;width:19px;height:13px}
.pip.hp.on{background:var(--blood);border-color:var(--blood)}
.pip.st{border-radius:4px;width:19px;height:13px}
.pip.st.on{background:var(--fear);border-color:var(--fear)}
.pip.hope{transform:rotate(45deg);width:12px;height:12px;margin:2px 3px;border-radius:2px;border-color:var(--hope)}
.pip.hope.on{background:var(--hope)}
.pip.ar{width:14px;height:16px;border:0;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);border-radius:0;background:var(--line)}
.pip.ar.on{background:var(--moss)}
.pip.cd{width:24px;height:24px;border-radius:50%;border-color:var(--moss)}
.pip.cd.on{background:var(--moss);border-color:var(--moss)}

/* scudo (Evasione, Armatura, Difficoltà) come sulla scheda */
.shield{display:inline-flex;flex-direction:column;align-items:center;flex:none}
.shield .sv{width:46px;height:50px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;line-height:1;background:var(--ink);clip-path:polygon(0 0,50% 9%,100% 0,100% 64%,50% 100%,0 64%);padding:3px;position:relative}
.shield .sv>span{width:100%;height:100%;display:grid;place-items:center;background:var(--paper);clip-path:polygon(0 0,50% 9%,100% 0,100% 64%,50% 100%,0 64%);padding-bottom:7px}
.shield .sl{margin-top:-7px;background:var(--ink);color:var(--paper);font-size:.58rem;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:2px;position:relative}
.shield.sm .sv{width:38px;height:42px;font-size:1.3rem}
.shield.lg .sv{width:62px;height:68px;font-size:2.1rem}
.shield.diff .sv,.shield.diff .sl{background:var(--fear)}
.shield.arm .sv,.shield.arm .sl{background:var(--moss)}

/* soglie di danno come sul manuale */
.thr{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;row-gap:2px}
.thr.two{grid-template-columns:1fr auto 1fr}
.thr .seg{background:var(--plate);color:var(--plate-fg);border:0;font:800 .62rem/1.05 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px 6px 8px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);min-height:32px;text-align:center}
.thr .seg:first-child{border-radius:3px 0 0 3px}
.thr .seg.last{clip-path:none;border-radius:0 3px 3px 0;padding-right:8px}
.thr .seg:hover:not(:disabled){background:var(--blood);color:#fff}
.thr .seg:disabled{cursor:default}
.thr .tn{font-family:var(--f-display);font-size:1.2rem;background:var(--paper);border:2px solid var(--plate);border-radius:3px;min-width:2.1em;text-align:center;line-height:1.3;margin:0 -4px;position:relative;z-index:1}
.thr .sub{font-size:.62rem;color:var(--muted);text-align:center}
.thr.compact .seg{font-size:.55rem;min-height:26px;padding:4px 10px 4px 5px}
.thr.compact .tn{font-size:1.02rem}
.minion-note{font-size:.8rem;background:var(--plate);color:var(--plate-fg);padding:4px 8px;border-radius:3px;font-weight:700}

/* bottoni */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-weight:500;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.hope{background:var(--hope-soft);border-color:var(--hope)}
.btn.fear{background:var(--fear-soft);border-color:var(--fear)}
.btn.bad{background:var(--blood-soft);border-color:var(--blood)}
.btn.ok{background:var(--moss-soft);border-color:var(--moss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:1px 7px;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 8px;font-size:.74rem;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.chip.fear{border-color:var(--fear);color:var(--fear)} .chip.hope{border-color:var(--hope);color:var(--hope)}
.chip.bad{border-color:var(--blood);color:var(--blood)} .chip.ko{background:var(--blood);border-color:var(--blood);color:#fff;letter-spacing:.06em} .chip.ok{border-color:var(--moss);color:var(--moss)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 7px;min-width:0}
input[type=number]{width:4.2em}
textarea{width:100%;resize:vertical}
label.inl{display:inline-flex;align-items:center;gap:5px;font-size:.92rem}
.cond{display:flex;flex-wrap:wrap;gap:4px}
.cond button{border:1px dashed var(--line);background:none;border-radius:999px;font-size:.74rem;padding:0 8px;cursor:pointer;color:var(--muted)}
.cond button.on{border-style:solid;border-color:var(--blood);color:var(--blood);font-weight:700}

/* card PG compatte */
.pcc{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pcc.down{border-color:var(--blood);box-shadow:inset 3px 0 0 var(--blood)}
.pcc-top{display:flex;gap:8px;align-items:center}
.pcc-id{flex:1;min-width:0;cursor:pointer}
.pcc-id b{font-family:var(--f-display);font-weight:400;font-size:1.12rem;display:block;line-height:1.1}
.pcc-id span{font-size:.75rem;color:var(--muted)}
.trk{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.trk>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.trk .lab{font-size:.6rem}
.pcc .pip.hp,.pcc .pip.st{width:16px;height:12px}
.pcc-x{border-top:1px dotted var(--line);padding-top:8px;display:flex;flex-direction:column;gap:10px}
.traits{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.traits button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.traits button b{font-family:var(--f-display);font-size:1.05rem;font-weight:400}
.traits button span{font-size:.55rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.feat{font-size:.84rem} .feat b{font-weight:700}
.feat .k{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.wpn{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.86rem;border:1px solid var(--line);border-radius:4px;padding:6px 8px}

/* incontri: card riassuntive + dettaglio */
.scene{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fc{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.fc:hover{border-color:var(--ink)}
.fc.open{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fc.dead{opacity:.5}
.fc.acted{background:var(--bg)}
.fc-h{display:flex;gap:8px;align-items:flex-start}
.fc-h .nm{flex:1;min-width:0}
.fc-h .nm b{font-family:var(--f-display);font-weight:400;font-size:1.08rem;line-height:1.1;display:block}
.fc-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fc-row .lab{width:3.4em;font-size:.6rem}
.act-b{border:1px solid var(--moss);background:none;color:var(--moss);border-radius:999px;font-size:.72rem;font-weight:800;padding:0 9px;cursor:pointer}
.act-b.done{background:var(--moss);color:var(--paper)}
.fd{grid-column:1/-1;border:1px solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.fd-h{background:var(--plate);color:var(--plate-fg);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

details.pv-sec>summary{font-size:.95rem}
.pv-traits{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.pv-traits>div{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:4px 0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.pv-traits b{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.pv-traits span{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pv .feat{font-size:.95rem}
.pv-q{font-size:1.05rem;font-weight:500;color:var(--ask)}
.pv-scr{width:100%;border-radius:4px;margin-top:8px;background:#000}
.pv-secret{border-color:var(--hope)}
/* lo schermo è sempre scuro, come una sala buia */
.stage{--ink:#e9ece5;--muted:#9aa69c;--line:#3a463d;--paper:#141a16;--blood:#e0786e;--fear:#b892d6;--hope:#e0aa4c;--moss:#8fb79a;
 position:fixed;inset:0;background:#060807;color:var(--ink);overflow:hidden;display:grid;place-items:center;container-type:size}
.stage.mini{position:relative;inset:auto;width:100%;aspect-ratio:16/9;border-radius:var(--r);border:1px solid var(--line)}
.st-img{width:100%;height:100%;object-fit:contain;display:block}
.st-title{display:flex;flex-direction:column;align-items:center;gap:1.5cqh;text-align:center;padding:0 6cqw}
.st-title span{font-family:var(--f-body);font-size:max(10px,2.6cqh);letter-spacing:.3em;text-transform:uppercase;color:var(--hope)}
.st-title b{font-family:var(--f-display);font-weight:400;font-size:min(13cqh,9cqw);line-height:1.05;text-wrap:balance}
@media (prefers-reduced-motion:no-preference){.st-img.fresh,.st-title.fresh{animation:st-in .9s ease-out}}
@keyframes st-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.st-cap{position:absolute;left:0;right:0;bottom:0;padding:8cqh 6cqw 4cqh;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:var(--f-read);font-size:max(10px,4.6cqh);text-align:center;text-wrap:balance}
.stage:has(.st-party) .st-cap{bottom:15cqh}
.st-fear{position:absolute;top:3cqh;right:3cqw;display:flex;flex-direction:column;align-items:flex-end;gap:.8cqh;font-size:max(8px,1.8cqh);letter-spacing:.2em;text-transform:uppercase;color:var(--fear);font-weight:800}
.st-fear div{display:flex;gap:.7cqh}
.st-fear i{width:2.2cqh;height:2.2cqh;transform:rotate(45deg);border:max(1px,.25cqh) solid var(--fear);border-radius:2px}
.st-fear i.on{background:var(--fear)}
.st-party{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:1.5cqw;padding:1.5cqh 2cqw;background:rgba(6,8,7,.82);border-top:1px solid var(--line)}
.st-party>div{display:flex;flex-direction:column;gap:.4cqh;min-width:0}
.st-party>div.down b{color:var(--blood)}
.st-party b{font-family:var(--f-display);font-weight:400;font-size:max(9px,2.8cqh);line-height:1}
.st-party span{display:flex;align-items:center;gap:.6cqw}
.st-party em{font-style:normal;font-size:max(6px,1.3cqh);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:6.5cqh}
.st-party .pips{gap:.3cqh;flex-wrap:nowrap}
.st-party .pip.hp,.st-party .pip.st{width:2.2cqh;height:1.6cqh;border-width:max(1px,.2cqh)}
.st-party .pip.hope{width:1.4cqh;height:1.4cqh;margin:.2cqh .35cqh;border-width:max(1px,.2cqh)}
.scr-ctl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;opacity:.35;transition:opacity .3s}
.tgl.back{background:var(--hope-soft);border-color:var(--hope)}
.scr-ctl:hover,.scr-ctl:focus-within{opacity:1}
@media (hover:none){.scr-ctl{opacity:.7}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.gal-i{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.gal-i.on{border:2px solid var(--ok);padding:5px}
.gal-th{border:0;padding:0;background:#060807;border-radius:4px;aspect-ratio:16/10;overflow:hidden;cursor:pointer;display:block;width:100%}
.gal-th img{width:100%;height:100%;object-fit:cover;display:block}
.gal-i input{width:100%}
.gal-up{display:inline-flex;align-items:center}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=n=>1+Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sgn=n=>(n>=0?"+":"")+n;
function rollExpr(expr){
  const m=String(expr).replace(/\s/g,"").match(/^(\d*)d(\d+)([+-]\d+)?$/i);
  if(!m){const n=parseInt(expr);return isNaN(n)?null:{total:n,rolls:[],text:String(n)}}
  const c=+(m[1]||1),f=+m[2],mod=+(m[3]||0);const rolls=[];for(let i=0;i<c;i++)rolls.push(d(f));
  const total=rolls.reduce((a,b)=>a+b,0)+mod;
  return {total,rolls,text:`${expr} → [${rolls.join(", ")}]${mod?" "+sgn(mod):""} = ${total}`};
}

  if(over){r.hp=Math.min(p.hpMax,r.hp+over);log(`${p.name}: Stress pieno → segna ${over} PF`,"bad")}

function hpFromDamage(dmg,major,severe){
  if(dmg<=0)return 0;

}

function pcDamage(id,dmg,useArmor){

  if(r.cond.includes("Inarrestabile")&&hp>0){hp--;note+=", −1 Inarrestabile"}

    hope:d(12),fear:d(12),adv:Array.from({length:+o.adv||0},()=>d(6)),dis:Array.from({length:+o.dis||0},()=>d(6)),exps:[],helpers:[],react:!!o.react,final:!!o.final,
    dmg:o.dmg||"",foe:o.foe||"",effects:[],at:new Date().toTimeString().slice(0,5)};

function mkFoe(src,where,suffix){

    hpMax:src.hp||0,stMax:src.st||0,hp:0,st:0,thr:src.thr||[null,null],diff:src.diff??null,sugg:!!src.sugg,atk:src.atk??null,attack:src.attack||null,
    exp:src.exp||[],feats:src.feats||[],tips:src.tips||[],minion:!!src.minion,cond:[],acted:false,dead:false,where};
}
function spawn(key,n,where){
  const t={...T[key],key};const same=S.foes.filter(f=>f.tmpl===key).length;
  const numbered=t.type!=="PNG"&&t.type!=="Social"&&(n>1||same>0);
  for(let i=0;i<n;i++)S.foes.push(mkFoe(t,where,numbered?` #${same+i+1}`:""));
  log(`In scena: ${n>1?n+"× ":""}${t.name}`);
}
function foeDefeated(f){
  if(f.dead)return;f.dead=true;log(`${f.name} è sconfitto`,"ok");
  if(S.act==='4'&&!S.flags.ritualDone&&(f.tmpl==='skeleton'||f.tmpl==='hero')){S.ritual.v=Math.max(0,S.ritual.v-1);log(`Rituale −1 → ${S.ritual.v}`,"ok");if(S.ritual.v===0)toast("Il Rituale è a zero: leggi «Il rituale termina»")}
}

function foeTakeDamage(f,v){
  if(f.minion){foeDefeated(f);const extra=Math.floor(v/3);if(extra)log(`${v} danni: sconfiggi altri ${extra} gregari a portata`);return}
  const hp=hpFromDamage(v,f.thr[0],f.thr[1]);foeMark(f,"hp",hp);log(`${f.name} subisce ${v} danni → ${hp} PF (${f.hpMax-f.hp}/${f.hpMax})`);
}
function foeMark(f,k,n){
  if(k==="st"){const over=Math.max(0,f.st+n-f.stMax);f.st=Math.min(f.stMax,f.st+n);if(over&&f.hpMax){f.hp=Math.min(f.hpMax,f.hp+over);log(`${f.name}: Stress pieno → ${over} PF`)}}
  if(k==="hp")f.hp=Math.min(f.hpMax,f.hp+n);
  if(f.tmpl==="elder"){S.elderSt=f.st;syncElder()}
  if(f.hpMax&&f.hp>=f.hpMax)foeDefeated(f);
}

 rituale:{k:"Combattimento · Evento",luogo:()=>S.flags.ritualHere?"Hush, mentre la foresta attorno al villaggio urla.":"La Valle Aperta, mentre la foresta urla.",posta:"Proteggere l'Arcanista finché il sigillo non è rinnovato.",uscita:"Rituale a 0: i nemici diventano polvere e i PG diventano libellule."},
 finale:{k:"Evento",luogo:"Il cielo sopra la città assediata.",posta:"Le persone care ai PG e il regno stesso.",uscita:"Il tiro finale decide l'esito."},

const SECTIONS={
'1':()=>[
 {id:"inizio",t:"Grida nel buio",f:F.inizio,html:()=>`
 ${ask("Nominate due creature della foresta: si fonderanno in un ibrido che brulica nel sottobosco.",`<input type="text" id="cr0" data-f="critter" data-i="0" value="${esc(S.critters[0])}" placeholder="es. tasso" aria-label="Prima creatura"><span>+</span><input type="text" id="cr1" data-f="critter" data-i="1" value="${esc(S.critters[1])}" placeholder="es. falena" aria-label="Seconda creatura"><b>= ${hybrid()}</b>`,"Prima di leggere")}
 ${read(`<p>Siete attorno a un fuoco. Dovrebbe essere giorno, ma gli alberi del Sablewood salgono per centinaia di metri e coprono il cielo intero: sembra piena notte.</p>
 <p>Tutto intorno sentite il gracidare dei lemuri-rospo e il brulicare di sciami di <b>${hybrid()}</b> nel sottobosco.</p>
 <p>Da un paio d'ore aspettate Luna, una cacciatrice del villaggio di Hush che, secondo le lettere scambiate, dovrebbe guidarvi. È <i>molto</i> in ritardo.</p>`)}
 ${ask("Cosa fate per ingannare l'attesa attorno al fuoco?","","Facoltativa · prima delle grida")}
 ${read(`<p>Poi, in lontananza, delle grida. Qualcuno chiede aiuto, e potrebbe essere lei. Le urla vengono da un centinaio di metri, e il terreno è così impervio che non siete sicuri di arrivare in tempo, se non date tutto. Cosa fate?</p>`)}
 <p class="small muted">Questo incontro insegna i tiri d'azione. Descrivi 1 o 2 ostacoli alla volta.</p>
 `},
 {id:"prezzo",t:"Un prezzo da pagare",f:F.prezzo,html:()=>{
  const dead=`${read(`<p>D'un tratto vi rendete conto che sono quasi dieci secondi che non sentite più gridare.</p><p>Arrivate in una piccola radura, ma trovate solo il corpo senza vita della cacciatrice che doveva guidarvi. Chi o cosa l'ha uccisa se n'è già andato.</p>`)}
  ${ask("Chi si avvicina al corpo, e cosa fa?","","Se il gruppo si ferma")}
  ${read(`<p>A un dito porta un anello magico che tira sempre in una direzione: una fede nuziale, incantata per indicare dove si trova lo sposo di chi la indossa.</p>`,"Se perquisiscono il corpo")}`;
  const saved=`${read(`<p>Vedete una fata ferita a terra che grida aiuto. È grande appena come due mele e indossa una pelle d'ornitorinco come mantello da caccia.</p>
  <p>Accanto a lei c'è un lupo gigante e maestoso con la testa di gufo. Il suo pelo è così bianco che sembra un'apparizione. Quando si volta verso di voi, sentite una voce nella testa:</p>
  <p>«Allontanatevi, mortali. Costei ha cacciato un cucciolo del mio branco, e per questo deve pagare un prezzo.»</p>`)}
  <p>Lo <b>Strixwolf</b> è un grande spirito, creato per proteggere le specie più rare del Sablewood. Luna non sapeva che l'ornitorinco che indossa era sotto la sua protezione.</p>
  ${ask("Chi di voi risponde allo Strixwolf, e cosa gli dice?","","Dopo le parole dello Strixwolf")}
  <div class="panel stack"><h4>Patto fatato</h4>
  ${read(`<p>«Una vita per una vita: questo è il prezzo che chiedo. Eppure vedo fuoco nella tua anima, e mi fa credere che potresti saziare la mia fame con la <i>sorpresa</i> invece che con il sangue.</p><p>Concedimi un solo momento del tuo tempo, e lo userò per metterti alla prova. Prima che il tuo viaggio finisca reclamerò quel momento, e ti farò minacciare la vita che mi è dovuta. Cosa accadrà dopo, sono curioso di scoprirlo.»</p>`,"Se viene chiesto")}
  <p class="small muted">Chi accetta: ad Hush attaccherà un PNG (se è drammatico), <i>oppure</i> nel tiro finale saboterà gli alleati dando svantaggio.</p>
  ${pactUI()}</div>`;
  return branch(S.flags.luna==="saved"?"a":S.flags.luna==="dead"?"b":null,["Se Luna è viva",saved],["Se Luna è morta",dead],S.out["1:inizio"]==="Deviazione improvvisata"?"Si decide alla fine della scena improvvisata: quando torni alla trama qui resterà solo il ramo giusto.":"Concludi la scena 1: in base all'inseguimento qui resterà solo il ramo giusto.")}},
],
'2':()=>[
 {id:"emissari",t:"Emissari degli Antichi Dèi",f:F.emissari,html:()=>`
 ${read(`<p>Mentre continuate a camminare succede qualcosa di strano. Non sentite più gli scarabei-serpente né i lama-saltafango. La foresta si fa stranamente silenziosa.</p>`)}
 ${luna()?read(`<p>Luna si volta verso di voi: «Oh, <i>bastoncini</i>, qualunque cosa stiate trasportando, sembra che gli Dèi Dimenticati l'abbiano percepita, e ne vogliono un pezzo.»</p>`,"Luna è con il gruppo"):""}
 <p>I giocatori hanno un paio di minuti per prepararsi. Gli shade sono attratti dalla magia che filtra dal pacco ma non ne conoscono la posizione esatta. I PG possono nascondersi, ma gli shade usano l'Esperienza <b>Percepire la Magia +4</b>.</p>
 ${ask("Avete un paio di minuti: come vi preparate?","","Prima che arrivino gli shade")}
 <h4>Arrivano gli emissari</h4>
 ${read(`<p>Sagome gigantesche e distorte emergono dalla boscaglia. Sono come buchi nel tessuto della realtà: puoi vederci attraverso, ma ciò che vedi è un'altra foresta.</p><p>Gli alberi sono più verdi, più sottili, non così assurdamente alti. È come se dentro questi squarci a forma umana ci fosse la visione di com'era la foresta in un passato lontano, prima che gli Antichi Dèi venissero uccisi qui.</p>`)}
 ${read(`<p>Uno di loro tende un braccio verso il pacco. E capite subito cosa questa cosa ha detto senza parole: pretende di sapere cos'è.</p>`,"Se vedono il pacco")}
 <p>Gli Scarshade sono resti degli Antichi Dèi, con un odio infinito per chi adora i Nuovi Dèi, compreso il regno dei PG. Proveranno lo <b>Scavo nella Memoria</b>.</p>
 ${ask("Descrivi un momento terrificante della tua infanzia.","","Al PG colpito dallo Scavo nella Memoria")}`},
 {id:"polvere",t:"Al bivio",f:F.polvere,html:()=>{
  const L=S.flags.learned;
  if(L==null)return pendNote(S.out["2:emissari"]==="Deviazione improvvisata"?"Si decide alla fine della scena improvvisata: torna alla trama dicendo se gli Scarshade hanno scoperto il pacco.":"Concludi la scena 3: se gli Scarshade hanno scoperto il pacco, qui comparirà il bivio della scorciatoia.");
  if(L===false)return `<div class="note">Gli Scarshade non hanno scoperto nulla: nessuna urgenza e nessun bivio. Il gruppo prosegue verso Hush.</div>`;
  return `<div class="warn">Gli Scarshade sanno del pacco. Contatore d'Assalto alla Città: <b>${S.counter.on?S.counter.value:"—"}</b>, la Difficoltà del tiro finale.</div>
  <p><b>La scorciatoia.</b> Con questa urgenza, i giocatori potrebbero cercare una scorciatoia attraverso le parti più pericolose del Sablewood.</p>
  <ul class="tight"><li>${luna()?"<b>Luna è con il gruppo:</b> può indicare la strada.":"Luna non c'è: un PG fa un tiro di <b>Istinto</b> a Diff 15 per trovarla."}</li><li>Se proseguono senza scorciatoia, il Contatore sale di <b>2</b>.</li></ul>
  ${ask("Rischiate la scorciatoia nelle parti più pericolose della foresta, o restate sul sentiero?","","Al gruppo")}
  ${luna()?"":`<div class="row">${rb("Istinto · Diff 15",{t:"dual",trait:3,diff:15,label:"Trovare la scorciatoia"})}</div>`}`}}
],
'2.5':()=>[
 {id:"fiume",t:"Il fiume Orfanatore",f:F.fiume,html:()=>{const dr=S.pcs.filter(p=>p.cond.includes("Annegamento"));return `
 ${read(`<p>Il fragore incessante del famigerato fiume Orfanatore minaccia di assordarvi molto prima che lo vediate.</p><p>L'acqua è così turbolenta che sembra una cascata orizzontale.</p>`)}
 ${ask("Ognuno di voi mi dica una cosa che vede sporgere dall'acqua.","","Chiedi a ogni giocatore")}
 ${S.pcs.some(p=>p.id==="barnacle")?`<div class="note small">Barnacle è anfibio, ma ha paura dell'acqua e non nuota.</div>`:""}
 
 <div class="note small"><b>Glossario:</b> una condizione temporanea come Annegamento si rimuove con un tiro d'azione riuscito: qui contro la Difficoltà 13 del fiume. Finché non riesce, ogni tiro d'azione di un PG (anche il suo tentativo di liberarsi) fa segnare 1 Stress a chi annega. I tiri reazione non generano Speranza né Paura. Le carte nel deposito non si possono usare: tornano nella dotazione con un riposo, oppure segni Stress pari al costo di richiamo per scambiarle con una carta della dotazione.</div>
 ${S.river.t===0?`<div class="note">Il gruppo ha attraversato il fiume.</div>`:""}`}}
],
'3':()=>[
 {id:"arcanista",t:"Il villaggio che non vuole ospiti",f:F.arcanista,html:()=>`
 ${read(`<p>Dopo un altro paio d'ore nel Sablewood trovate un cippo di pietra a terra, scolpito come un volto accigliato con un dito premuto in verticale sulle labbra corrugate.</p><p>Sembra che i suoi occhi seguano i vostri movimenti, anche se siete <i>quasi certi</i> che la statua sia immobile.</p>`)}
 ${luna()?read(`<p>Luna gli svolazza accanto con disinvoltura… e scompare.</p>`,"Luna è con il gruppo"):""}
 ${read(`<p>Sentite una piccola sensazione, come lo scoppio di una bolla, e il brusio si fa più forte. Oltre questa barriera magica si rivela il villaggio di Hush, con decine di capanne di legno e gli sguardi di qualche dozzina di volti diffidenti. </p>`,"Quando superano il cippo")}
 ${ask("Ditemi tre cose che vedete e che vi fanno capire quanto questo posto sia ostile.")}
 ${luna()?`<div class="note">Luna è con il gruppo: passa direttamente all'<b>Anziano Halython</b>.</div>`:""}
 ${luna()?"":`<h4>Trovare l'Arcanista</h4>
 ${S.counter.on?`<div class="row">${counterChip()}<span class="small muted">qualche minuto di ricerca costa +1, applicato alla fine della scena</span></div>`:""}
 <p>Quasi tutti rifiutano di parlare con i PG: bisbigliano, fissano, sputano a terra, se ne vanno. La posizione dell'Arcanista dovrebbe restare segreta: temono che il gruppo sia un intruso.</p>
 ${ask("Chi di voi prova ad attaccare discorso, e come?","","Mentre cercano")}
 <p class="small">Dopo un po' trovano gli unici disposti a parlare: Fidget, Lausa e Octavio.${S.flags.ring?" <b>Il gruppo ha la fede di Luna: indica Octavio, suo marito.</b>":""}</p>`}`},
 {id:"anziano",t:"L'Anziano Halython",f:F.anziano,html:()=>`
 ${read(`<p>D'improvviso sentite un tonfo alle vostre spalle. Un uomo anziano, alto poco più di un metro, ha appena sbattuto a terra la punta del suo bastone, pretendendo attenzione e rispetto.</p><p>La persona con cui stavate parlando balbetta: «Anziano Halython? Non stavo cercando di…»</p><p>Il vecchio halfling la interrompe: «Non un'altra parola. Hai già detto troppo. Quanto a voi, dovete lasciare questo villaggio. Subito.»</p>`,"Quando un paesano accetta di guidarli")}
 ${ask("Cosa dite all'Anziano per non farvi cacciare?","","Dopo le sue parole")}
 `}
],
'4':()=>[
 {id:"villa",t:"Villa Fuocobianco",f:F.villa,html:()=>`
 ${read(`<p>Superando le case notate che qui gli alberi hanno centinaia di volti intagliati su ogni lato, con gli occhi che scrutano in ogni direzione. Quando passate accanto a un intaglio, la bocca si apre ed emette piccole fiamme bianche che illuminano il sentiero.</p><p>Un albero, più alto degli altri, regge tra i rami una villa di legno. Rune blu dipinte nella corteccia si accendono, il ramo si anima e l'intera struttura scende lentamente fino a terra.</p><p>Al posto della porta c'è un bocciolo gigante, largo forse tre metri, che si schiude rivelando petali colorati. Al centro c'è un'apertura da cui esce una figura alta più di due metri: un misto tra un umanoide e una lucciola, in vesti da maga bianca, carica di libri e pozioni.</p><p>«Vi stavo aspettando. Spero che nessuno abbia scoperto cosa trasportavate. L'ultima volta che la vostra città è rimasta indifesa così, i seguaci degli Antichi Dèi l'hanno quasi rasa al suolo. Comunque, come sta il piccolo Emeris? È ancora vivo?»</p>`)}
 <p class="small">L'Arcanista ha diverse migliaia di anni. Parla di Emeris IV; il re che ha assunto il gruppo è Emeris VIII. Ha creato il sigillo e ha un accordo con la stirpe reale: ogni paio di secoli lo rinnova, e il Regno in cambio evita il Sablewood. Se le chiedono perché i paesani non sapessero della consegna: «Oh, l'avevo detto… mi pare 12 o 13 anni fa?»</p>
 ${ask("Cosa volete chiedere all'Arcanista?","","Mentre conversano")}
 ${read(`<p>«Dovremmo andare nella Valle Aperta per il rituale. È solo a un paio di miglia. Un incantesimo del genere attirerà creature pericolose dagli angoli più oscuri del Sablewood: dalle vostre facce capisco che ne avete già incontrate alcune. …E preferirei che succedesse fuori dal villaggio. Quel ragazzino Lylython è un tipo lunatico, si mette a urlarmi contro ogni volta che un esperimento va storto.»</p>`,"Quando ha parlato abbastanza")}`},
 {id:"preparare",t:"La quiete prima",f:F.preparare,html:()=>`
 ${S.flags.ritualHere!==true?read(`<p>Entrate in una radura larga un paio di centinaia di metri, così perfettamente circolare da sembrare innaturale. Per quanto ne sapete, è l'unico posto del Sablewood dove si vede il cielo.</p><p>L'Arcanista inizia a preparare il rituale: «Mi serve un'ora per prepararmi. Godetevi l'aria della notte finché potete. Presto saremo molto occupati.»</p>`,"Se vanno alla Valle Aperta"):""}
 ${ask(S.flags.ritualHere?"Come passate l'ora prima del rituale?":"Come passate l'ora sotto il cielo, l'unico che si veda nel Sablewood?","","Mentre l'Arcanista si prepara")}
 ${S.counter.on?`<p class="small">Con il Contatore attivo i giocatori possono saltare il riposo e aiutare con la preparazione: lo sceglierai alla fine della scena.</p>`:""}
 <div class="panel stack"><h4>Riposo breve</h4><p class="small">Ogni PG sceglie fino a due opzioni (anche la stessa due volte).</p>
 ${S.pcs.map(p=>{const used=(S.rest[p.id]||[]).length,dis=used>=2?"disabled":"";return `<div class="row small"><b style="min-width:8.5em">${esc(pcName(p.id))}</b><span class="muted mono">${used}/2</span>
  <button class="btn xs has-die" data-a="rest" data-k="wounds" data-id="${p.id}" ${dis}>${DIE_SVG}Curare ferite</button><button class="btn xs has-die" data-a="rest" data-k="stress" data-id="${p.id}" ${dis}>${DIE_SVG}Ricomporsi</button>
  <button class="btn xs has-die" data-a="rest" data-k="armor" data-id="${p.id}" ${dis}>${DIE_SVG}Riparare armatura</button><button class="btn xs" data-a="rest" data-k="prep" data-id="${p.id}" ${dis}>Prepararsi</button></div>`}).join("")}
 <div class="xsmall muted">Curare ferite: 1d4+1 PF · Ricomporsi: 1d4+1 Stress · Riparare armatura: 1d4+1 slot · Prepararsi: +1 Speranza (+2 a testa se insieme).</div>
 <div class="row small"><button class="btn xs" data-a="rest-group">Prepararsi insieme (+2 Speranza a chi ha mosse libere)</button><button class="btn xs" data-a="rest-reset">Nuovo riposo</button></div></div>`},
 {id:"rituale",t:"Il Rituale del Rinnovo",f:F.rituale,html:()=>`
 ${read(`<p>Quando siete pronti, l'Arcanista dà inizio al rituale. Il suo corpo e la pietra del sigillo iniziano a brillare, e grida ultraterrene risuonano dai boschi mentre le creature vicine percepiscono l'energia arcana.</p>`)}
 ${ask("Come vi disponete attorno all'Arcanista?","","Prima che escano dagli alberi")}
 <p>Piazza <b>5 Scheletri Antichi</b> e <b>2 Eroi Dimenticati</b> ai margini della radura, a distanza Lontana. Finché ci sono meno di 8 scheletri, se un giocatore tira con Paura, spendi quella Paura per la Vendetta degli Antichi Dèi. Altrimenti spendi Paura per turni extra in cui attacchi l'Arcanista.</p>
 
 ${S.flags.ritualDone||S.ritual.v===0?"":`<details class="alt"><summary>Il rituale termina (quando il conto arriva a zero)</summary>`}
 <h4>Il rituale termina</h4>
 ${read(`<p>Un'onda di magia riduce in polvere tutti i nemici rimasti.</p><p>L'Arcanista Fuocobianco vi ringrazia, ma vi esorta a riportare a casa la pietra il prima possibile… perché ora gli Antichi Dèi lo sanno di sicuro.</p>`,"Quando il conto arriva a zero")}
 ${read(`<p>Lancia un incantesimo che vi trasforma tutti in libellule con la testa umanoide. «L'insetto più veloce della natura, con qualche miglioria mia. Dovrebbe aiutarvi a tornare a casa. Buona fortuna, e salutatemi il piccolo Emeris!»</p>`,"Quando i giocatori accettano")}
 ${S.flags.ritualDone||S.ritual.v===0?"":"</details>"}`}
],
'5':()=>[
 {id:"finale",t:"La città sotto assedio",f:F.finale,html:()=>{const bp=pcById(S.flags.bargain);return `
 ${read(`<p>Dopo aver volato per centinaia di chilometri in un paio d'ore, vedete finalmente la vostra città all'orizzonte: tre cerchi concentrici di mura, ognuno più alto del precedente, e un enorme castello al centro.</p><p>E in questo momento la città è sotto assedio: orso-vespe giganti attaccano dal cielo, alberi animati del Sablewood colpiscono le mura con le radici, e alcuni degli Scarshade di prima seminano il caos per le strade.</p><p>Ora sapete esattamente dove va la pietra: l'avete vista decine di volte, come uno dei gioielli della corona della statua di re Emeris II, davanti al castello. Tutto si riduce a questo: riuscirete ad arrivarci in tempo?</p>`)}
 ${ask(`Chi cercate con lo sguardo tra le mura?${S.home.filter(h=>h.n).length?` <span class="small muted">(PNG di casa: ${esc(S.home.filter(h=>h.n).map(h=>h.n).join(", "))})</span>`:""}`,"","Prima del tiro finale")}
 <p>Chiedi <b>un ultimo tiro d'azione</b>. La Difficoltà è il Contatore d'Assalto: <b class="mono">${S.counter.value}</b>.</p>
 <ul class="tight small"><li>1 Speranza: usare un'<b>Esperienza</b> per un bonus.</li><li>1 Speranza: <b>Aiutare</b> (vantaggio, +d6; con più fonti si tiene il più alto).</li><li>3 Speranza ciascuno: <b>Tiro di Squadra</b>, si tiene il migliore.</li><li>Istinti Felini di Varian o Adattabilità di Garrick possono fare la differenza.</li></ul>
 ${bp&&!S.flags.bargainUsed?`<div class="warn"><b>Patto fatato:</b> ${esc(bp.name)} non ha attaccato nessuno ad Hush, quindi sabota gli alleati: il tiro finale ha <b>svantaggio</b>.</div>`:""}
 <div class="stack" style="gap:6px"><span class="lab">Chi fa il tiro finale? (Diff ${S.counter.on?S.counter.value:15}${bp&&!S.flags.bargainUsed?", con svantaggio":""})</span><div class="row">${S.pcs.map(r=>rb(pcName(r.id),{t:"dual",who:r.id,trait:"ask",diff:S.counter.on?S.counter.value:15,final:1,dis:bp&&!S.flags.bargainUsed?1:"",label:"Tiro finale"})).join("")}</div><span class="xsmall muted">Esperienze e Aiuto si aggiungono dal risultato del tiro.</span></div>`}},
 {id:"risolvere",t:"Epilogo",f:F.risolvere,html:()=>{const f=S.flags.final;return `
 ${read(`<p>Vi precipitate al castello, sfrecciando oltre squadroni di soldati che tengono a bada le bestie del Sablewood. Alla fine incastrate la pietra nell'incavo vuoto. Un'altra ondata di magia, molto più potente di quella ${S.flags.ritualHere?"del rituale a Hush":"nella Valle Aperta"}, investe l'intera città.</p><p>Gli Scarshade vanno in frantumi. Le orso-vespe vengono scagliate in cielo. Gli alberi animati si fermano.</p>`)}
 <div class="stack">${[["ff","Fallimento con Paura","I PNG da proteggere sono stati uccisi. Il re incolpa il gruppo e i PG vengono banditi dal regno."],
 ["fh","Fallimento con Speranza","I PNG da proteggere sono morti. Una cerimonia acclama i PG come eroi, con un minuto di silenzio per chi non ce l'ha fatta."],
 ["sf","Successo con Paura","I PNG da proteggere sono feriti ma vivi. Un rivale odiato dai PG viene acclamato per aver protetto re Emeris: il suo rango sale."],
 ["sh","Successo con Speranza","I PNG da proteggere sono salvi. I PG sono acclamati come eroi e re Emeris offre ricompense."],
 ["crit","Successo critico","Come un successo con Speranza, ma un rivale odiato dai giocatori ha trovato la fine durante l'attacco."]].filter(([k])=>!f||f===k).map(([k,t,x])=>`<div class="out-card ${f===k?"hit":""}"><b>${t}</b>${f===k?` <span class="chip hope">risultato</span>`:""}<div class="small">${x}</div></div>`).join("")}</div>${f?"":pendNote("Concludi la scena 11 con l'esito del tiro finale: qui resterà solo il finale giusto.")}
 ${f?ask("Cosa fate il giorno dopo?","","Per chiudere"):""}
 <h4>PNG di casa da proteggere</h4><p class="small muted">Li hai annotati in «Prima di iniziare», all'inizio dell'Atto I.</p>${homeEditor()}`}}
]};
const ENC={
 "1:inizio":{
  rules:()=>`<ul class="tight small">
   <li><b>Inseguimento · Diff 12.</b> Due conti: <b>Distanza 3</b> (a 0 raggiungono Luna) e <b>Tempo 3</b> (a 0 Luna muore prima che arrivino).</li>
   <li><b>Tiri d'azione:</b> ogni PG descrive come supera un ostacolo. Successo: Distanza −1 (−2 con un critico). Fallimento: Tempo −1.</li>
   <li><b>Ostacoli:</b> descrivine 1 o 2 alla volta per dare spunti ai giocatori. Serve a insegnare i tiri d'azione.</li>
   <li><b>Complicazioni (1 Paura):</b> il prossimo tiro d'azione dei PG ha svantaggio.</li></ul>`,t:"Corsa tra le Radici",k:"Ambientale",d:"Inseguimento · Diff 12. Distanza e Tempo decidono se il gruppo arriva da Luna in tempo.",env:()=>`

   <li><b>Caduta Letale:</b> dopo il Morso Primordiale vola a distanza Vicina e lascia cadere il bersaglio. Se nessuno lo impedisce nella prossima azione dei PG, all'atterraggio subisce 1d10+4 danni fisici.</li>

function encAutoFill(key,def){
  if(!def||!def.auto||S.foes.some(f=>f.where===key))return false;

  list.forEach(([k,n])=>spawn(k,n,key));return list.length>0;
}

function parseDev(raw){

  const multi={TIRO:"tiri",PNG:"png",AVVERSARIO:"avv",CONTO:"conti",PAURA:"paura",DOMANDA:"domande",SCELTA:"scelte"};

  }
  return o;
}

const RULES=`<div class="stack"><h2>Regole di Daggerheart in breve</h2><div class="grid2">

async function shrinkImage(file,max){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file),k=Math.min(1,max/Math.max(bmp.width,bmp.height));
   if(k===1&&file.size<1.5e6)return file;
   const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
   return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.85))}catch(e){return file}
}
const asDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});

      else{const b=await shrinkImage(f,1280);VIEW.gallery=VIEW.gallery.concat({gid:uid(),url:await asDataURL(b),title})}
      n++;
    }catch(e){toast(e&&e.code==="quota_or_state"?"Spazio per le immagini esaurito: eliminane qualcuna":`Non sono riuscito a caricare «${title}»`)}
  }

  const alt=!VIEW.ready||VIEW.mode!=="gm";document.body.classList.toggle("alt",alt);
  if(alt){renderAlt();return}
  document.getElementById("alt").innerHTML="";
  renderBar();renderTabs();renderParty();renderRoll();

}

 // generatore
 "scn-done":o=>upd(()=>{S.scn[o.k]=true;scnOpen.delete(o.k);const [a,id]=o.k.split(":");log(`Scena ${sceneNum(a,id)} conclusa`);setTimeout(()=>document.getElementById("end-"+o.k.replace(/[:.]/g,"_"))?.scrollIntoView({behavior:"smooth",block:"center"}),0)}),
 "scn-reopen":o=>upd(()=>{delete S.scn[o.k];scnOpen.set(o.k,true);toast("Scena riaperta: gli effetti dell'esito precedente restano applicati")}),
 "scn-end-ask":o=>{endAsk=o.k;composer=null;render()},
 "scn-end-no":()=>{endAsk=null;composer=null;render()},
 "scn-out":o=>{const opt=(OUT[o.k]||DEFAULT_OUT).opts().find(x=>x.k===o.o);if(!opt)return;let pc="";
  if(opt.pick){pc=document.getElementById("out-pc")?.value||"";if(!pc){toast("Scegli il PG che accetta il patto");return}}
  opt.apply(pc);const label=opt.l+(pc?` (${pcName(pc)})`:"");
  S.out[o.k]=label;S.scn[o.k]=true;endAsk=null;composer=null;scnOpen.delete(o.k);
  const [a,id]=o.k.split(":");
  if(o.c&&o.c.startsWith("dev:")){const dv=S.devs.find(x=>x.id===o.c.slice(4));if(dv){dv.done=true;dv.outL="Si torna alla trama: "+label;scnOpen.delete(o.c)}}
  log(`Scena ${sceneNum(a,id)} conclusa: ${label}`,"ok");
  const nx=nextScene(a,id);if(nx)goToScene(nx.act+":"+nx.s.id);else{persist();render();toast("Fine dell'avventura")}},
 "out-imp":o=>{composer={where:o.k,from:o.c};render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "dev-end-ask":o=>{endAsk="dev:"+o.id;render()},
 "scn-fold":o=>{scnOpen.set(o.k,false);render()},
 "scn-next":o=>{const [a,id]=o.k.split(":");scnOpen.set(o.k,true);if(a!==S.act){A.goact({k:a})}else{render()}setTimeout(()=>document.getElementById(`scn-${a.replace(".","_")}-${id}`)?.scrollIntoView({behavior:"smooth",block:"start"}),30)},
 "dev-done":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);dv.done=true;scnOpen.delete("dev:"+dv.id);log(`Scena improvvisata conclusa: ${parseDev(dv.raw).titolo||""}`);setTimeout(()=>document.getElementById("end-"+dv.where.replace(/[:.]/g,"_"))?.scrollIntoView({behavior:"smooth",block:"center"}),0)}),
 "dev-reopen":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);dv.done=false;scnOpen.set("dev:"+dv.id,true)}),
 "dev-edit":o=>{composer={where:"re:"+o.id};const dv=S.devs.find(x=>x.id===o.id);if(dv)G.kind=dv.kind||G.kind;scnOpen.set("dev:"+o.id,true);render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "gen-open":o=>{composer={where:o.w};render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "gen-close":()=>{composer=null;render()},
 "g-kind":o=>{const t=document.getElementById("gen-txt")?.value;G.kind=o.k;render();const e=document.getElementById("gen-txt");if(e&&t!=null)e.value=t},
 "gen-go":o=>{const t=(document.getElementById("gen-txt")?.value||"").trim();
  if(!o.w.startsWith("re:")&&composer&&composer.from){const from=composer.from;
   if(from.startsWith("dev:")){const dv=S.devs.find(x=>x.id===from.slice(4));if(dv){dv.done=true;dv.outL="Altro imprevisto";scnOpen.delete(from)}}
   else if(!S.scn[o.w]){S.scn[o.w]=true;S.out[o.w]="Deviazione improvvisata";scnOpen.delete(o.w)}
   endAsk=null}
  if(o.w.startsWith("re:")){const dv=S.devs.find(x=>x.id===o.w.slice(3));if(dv)generate(dv.where,t,G.kind,dv.id)}else generate(o.w,t,G.kind)},
 "gen-stop":()=>G.ctrl?.abort(),
 "dev-regen":o=>{const dv=S.devs.find(x=>x.id===o.id);if(dv&&!G.busy)generate(dv.where,dv.user,dv.kind,dv.id)},
 "dev-choice":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);if(!dv||dv.choice!=null)return;const c=parseDev(dv.raw).scelte[+o.i];if(!c)return;
  const fx=parseFx((c.slice(1).join("|").match(/EFFETTI\s*:(.*)$/i)||[,""])[1]);dv.choice=+o.i;log(`Scelta: ${c[0]}`,"ok");applyFx(fx,`scelta «${c[0]}»`)}),
 "dev-res":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);if(!dv||dv.res)return;const p=parseDev(dv.raw);const r=splitFx(o.k==="s"?p.successo:p.fallimento);dv.res=o.k;log(`Esito della scena improvvisata: ${o.k==="s"?"successo":"fallimento"}`);applyFx(r.fx,o.k==="s"?"successo della scena":"fallimento della scena")}),
 "dev-del":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);S.devs=S.devs.filter(x=>x!==dv);if(dv)S.foes=S.foes.filter(f=>f.where!==dv.act+":dev:"+dv.id)}),
 "dev-foe":o=>upd(()=>{picker=null;const dv=S.devs.find(x=>x.id===o.id);const r=parseDev(dv.raw).avv[+o.i];if(!r)return;const thr=String(r[4]||"").split("/").map(x=>parseInt(x));
  const dmg=(String(r[9]||"").match(/\d*d\d+\s*[+-]?\s*\d*/)||[""])[0].replace(/\s/g,"");
  const src={name:r[0],tier:1,type:r[1]||"Standard",diff:parseInt(r[3])||12,thr:[isNaN(thr[0])?null:thr[0],isNaN(thr[1])?null:thr[1]],hp:clamp(parseInt(r[5])||3,1,12),st:clamp(parseInt(r[6])||1,0,6),atk:parseInt(r[7])||0,
   attack:{n:(r[8]||"Attacco").split(/[·,(]/)[0].trim(),r:((r[8]||"").match(/Molto Vicina|Molto Lontana|Mischia|Vicina|Lontana/i)||["Mischia"])[0],d:dmg||"1d6+2",ty:/mag/i.test(r[9]||"")?"mag":"fis"},
   feats:r.slice(10).filter(Boolean).map(x=>{const [n,...rest]=x.split(":");return {n:n.trim(),k:"Azione",x:rest.join(":").trim()||x}}),minion:/minion|gregar/i.test(r[1]||""),desc:parseDev(dv.raw).titolo||""};
  const n=clamp(parseInt(r[2])||1,1,10);for(let i=0;i<n;i++)S.foes.push(mkFoe(src,dv.act+":dev:"+dv.id,n>1?` #${i+1}`:""));log(`In scena: ${n>1?n+"× ":""}${src.name}`)}),
 "dev-npc":o=>upd(()=>{picker=null;const dv=S.devs.find(x=>x.id===o.id);const r=parseDev(dv.raw).png[+o.i];if(!r)return;
  S.foes.push(mkFoe({name:r[0],type:"PNG",desc:r[1]||"",mot:r[2]||"",diff:parseInt(r[3])||12,feats:[]},dv.act+":dev:"+dv.id,""));log(`In scena: ${r[0]}`)}),
 "dev-cd":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);const c=parseDev(dv.raw).conti[+o.i];if(!c)return;const m=clamp(parseInt(c[1])||4,1,12);S.cds.push({id:uid(),name:c[0],max:m,v:m,note:c[2]||""});toast("Conto aggiunto nella scheda Scontro")}),
 // viste e schermo
 "view-mode":o=>{if(o.k==="gm"&&!VIEW.canGM)return;VIEW.mode=o.k;saveView();render();top0()},
 "view-pc":o=>{VIEW.pc=o.k||null;saveView();render();top0()},
 fullscreen:()=>{if(document.fullscreenElement){document.exitFullscreen?.();return}
  const p=document.documentElement.requestFullscreen?.();if(p?.catch)p.catch(()=>toast("Usa lo schermo intero del browser (F11)"));else if(!p)toast("Usa lo schermo intero del browser (F11)")},
 "scr-opt":(o,b)=>setScreen({[o.k]:b.checked}),
 "scr-title":()=>{const c=curSceneTitle();setScreen({kind:"title",title:c.scene,sub:c.act,gid:null,caption:""})},
 "scr-splash":()=>setScreen({kind:"splash",gid:null}),
 "scr-blank":()=>setScreen({kind:"blank",gid:null}),
 "scr-cap-clear":()=>setScreen({caption:""}),
 "gal-show":o=>{const g=VIEW.gallery.find(x=>x.gid===o.k);if(g)setScreen({kind:"img",gid:g.gid,id:g.id||null,url:VIEW.tdb?g.url:"",title:g.title})},
 "gal-del-ask":o=>{VIEW.delAsk=o.k;render()},
 "gal-del-no":()=>{VIEW.delAsk=null;render()},
 "gal-del":o=>{const g=VIEW.gallery.find(x=>x.gid===o.k);VIEW.delAsk=null;if(!g)return;
  VIEW.gallery=VIEW.gallery.filter(x=>x!==g);saveGallery();
  if(VIEW.tdb&&g.id&&VIEW.assets)VIEW.assets.delete(g.id).catch(()=>{});
  if(VIEW.screen?.gid===g.gid)setScreen({kind:"splash",gid:null});else render()},
 reset:()=>{resetAsk=true;renderBar()},
 "reset-no":()=>{resetAsk=false;renderBar()},
 "reset-yes":()=>{resetAsk=false;S=fresh();openFoe=openPc=null;scnOpen.clear();encOpen.clear();picker=null;composer=null;deathFor=null;ROLL={cur:null,hist:[],pend:null,showHist:false};foeRoll.res=null;top0();persist();render();toast("Nuova campagna pronta")}
};

document.addEventListener("click",e=>{
  const sum=e.target.closest("details.scn>summary");
  if(sum){const d=sum.parentElement,key=d.dataset.scn||"dev:"+d.dataset.dev;setTimeout(()=>scnOpen.set(key,d.open),0);return}
  if(e.target.closest("select,input,textarea,label")&&!e.target.closest("[data-a]")?.matches("input,select,label,button"))return;
  const b=e.target.closest("[data-a]");if(!b)return;
  const f=A[b.dataset.a];if(f){f(b.dataset,b);flushShows()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&VIEW.mode!=="gm"&&VIEW.canGM&&!document.fullscreenElement){A["view-mode"]({k:"gm"});return}if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".mc[data-a],.enc[data-a]")){e.preventDefault();A[e.target.dataset.a](e.target.dataset)}});
document.addEventListener("change",e=>{
  const el=e.target,o=el.dataset;if(!o.f)return;const v=el.value;
  switch(o.f){
    case "pc-over":{const r=pcRaw(o.id);r.over[o.k]=clamp(+v||0,0,o.k.endsWith("Max")?12:40);const p=P(r);r.hp=Math.min(r.hp,p.hpMax);r.st=Math.min(r.st,p.stMax);r.ar=Math.min(r.ar,p.arMax);persist();render();return}
    case "foe-cond-add":{const f=foe(o.id);if(v&&f&&!f.cond.includes(v)){f.cond=toggleCond(f.cond,v,"");log(`${f.name}: ${v}`);persist();render()}return}
    case "pc-cond-add":{const r=pcRaw(o.id);if(v&&r&&!r.cond.includes(v)){r.cond=toggleCond(r.cond,v,r.id);log(`${pcName(r.id)}: ${v} attivo`);persist();render()}return}
    case "pc-notes":pcRaw(o.id).notes=v;persist();return;
    case "critter":S.critters[+o.i]=v;persist();render();return;
    case "bargain":S.flags.bargain=v;log(v?`${pcName(v)} accetta il patto dello Strixwolf`:"Nessun patto fatato","fear");persist();render();return;
    case "drownpc":drownPick=v;return;
    case "elderpc":elderPick=v;return;
    case "home-n":S.home[+o.i].n=v;persist();return;
    case "home-note":S.home[+o.i].note=v;persist();return;
    case "notes":S.notes=v;persist();return;
    case "scr-cap":setScreen({caption:v.trim()});return;
    case "gal-title":{const g=VIEW.gallery.find(x=>x.gid===o.k);if(g){g.title=v.trim()||g.title;saveGallery()}return}
    case "gal-up":{const fs=[...el.files];el.value="";if(fs.length)uploadImages(fs);return}
  }
});
render();
</script>
