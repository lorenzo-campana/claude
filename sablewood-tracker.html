const sk=(k,cls="")=>`<span class="dsk ${cls}" aria-hidden="true">${SK[k]}</span>`;
const plainHome=i=>{const h=S.home[i];return h&&h.n&&h.n.trim()?h:null};

function logByAct(){ // registro in ordine cronologico, diviso per atto
  const out={};let act="1";
  S.log.slice().reverse().forEach(l=>{const m=l.text.match(/^→ Atto ([^:]+):/);if(m){const a=ACTS.find(x=>x.n===m[1]);if(a)act=a.id;return}(out[act]=out[act]||[]).push(l.text)});
  return out;
}
function critOf(lines){const c=(lines||[]).find(t=>/Successo critico/.test(t)&&/^.+?(?: — |, ).+?:/.test(t));if(!c)return "";const m=c.match(/^(.+?)(?: — |, )(.+?):/);return m?`${esc(m[2].split(" ")[0])} e i dadi gemelli: successo critico.`:""}
function devsIn(keys){
  return S.devs.filter(d=>keys.includes(d.where)&&d.raw).map(d=>{const p=parseDev(d.raw),c=d.choice!=null?p.scelte[d.choice]:null;
    return {t:p.titolo||"un imprevisto",u:d.user||"",ch:c?c[0]:"",res:d.res==="s"?"ci è andata bene":d.res==="f"?"ci è andata male":""}});
}
const numIt=n=>["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci"][n]||String(n);
const fallen=where=>S.foes.filter(f=>f.where===where&&f.dead).length;
const firstName=id=>esc(pcName(id).split(" ")[0]);

// i capitoli del diario: un racconto unico per tappa, costruito dalle scelte della campagna e legato alla tappa successiva
function diaryChapters(){
  const F=S.flags,L=logByAct(),sage=S.pcs.map(r=>P(r)).find(p=>p.sage),sageN=sage?esc(sage.name.split(" ")[0]):"il Saggio di Corte";
  const [c1,c2]=S.critters.map(x=>x.trim().toLowerCase());const hyb=c1&&c2?`${esc(c1)}-${esc(c2)}`:"insetti senza nome";
  const bargain=F.bargain?firstName(F.bargain):"";
  const lunaDiedFight=F.luna==="dead"&&/Luna muore/.test(S.out["1:prezzo"]||"");
  const pactAtHush=F.bargainUsed&&/patto si compie/.test(S.out["3:anziano"]||"");
  const homes=S.pcs.map((r,i)=>({r,h:plainHome(i)})).filter(x=>x.h),rival=S.rival&&S.rival.trim()?esc(S.rival.trim()):"";
  const rivalNote=S.rivalNote&&S.rivalNote.trim()?esc(S.rivalNote.trim().replace(/\.$/,"")):"";
  const drowned=[...new Set((L["2.5"]||[]).map(t=>(t.match(/^(.+?) sta annegando/)||[])[1]).filter(Boolean))].map(n=>esc(n.split(" ")[0]));
  const finalRoll=(L["5"]||[]).concat(L["4"]||[]).find(t=>/^Tiro finale(?: — |, )/.test(t));const roller=finalRoll?esc(finalRoll.match(/^Tiro finale(?: — |, )(.+?):/)[1].split(" ")[0]):"";
  const list=a=>a.length>1?a.slice(0,-1).join(", ")+" e "+a[a.length-1]:a[0]||"";
  const names=list(homes.map(x=>esc(x.h.n.trim()))),many=homes.length>1;
  const kills=w=>{const n=fallen(w);return n?(n===1?"Uno l'abbiamo abbattuto":`Ne abbiamo abbattuti ${numIt(n)}`):""};
  const devs=keys=>devsIn(keys).map(d=>`C'è stato anche un imprevisto, quello che tra noi chiamiamo «${esc(d.t)}»${d.ch?`: alla fine abbiamo deciso di ${esc(d.ch.charAt(0).toLowerCase()+d.ch.slice(1).replace(/\.$/,""))}`:""}${d.res?`, e ${d.res}`:""}.`);
  const fin={
   ff:`Non siamo arrivati in tempo. La città si è salvata a metà${names?`, e ${names} non c'${many?"erano":"era"} più`:""}. Il re ci ha dato la colpa di tutto e tre giorni per lasciare il regno. Siamo partiti all'alba.`,
   fh:`La pietra è tornata al suo posto, ma tardi${names?`: ${names} non ce l'${many?"hanno":"ha"} fatta`:""}. In piazza ci hanno appuntato una spilla d'argento sul petto e ci hanno chiamati eroi. Poi la piazza è rimasta zitta per un minuto, per chi non era tornato.`,
   sf:`Ce l'abbiamo fatta per poco.${names?` Abbiamo ritrovato ${names} con qualche benda, ma in piedi.`:""} I complimenti però se li è presi ${rival||"qualcun altro"}${rival?", che racconta a tutti di aver fatto da scudo al re sulle scale del castello. Adesso siede nel consiglio":""}.`,
   sh:`Siamo arrivati in tempo. La città gridava i nostri nomi${names?` e abbiamo ritrovato ${names} senza un graffio`:""}. La sera il re ci ha offerto oro, terre e un posto alla sua tavola. In cambio voleva solo che, fra un paio di secoli, qualcuno sappia raccontare questa storia all'Arcanista.`,
   crit:`Siamo arrivati in tempo. La città gridava i nostri nomi${names?` e abbiamo ritrovato ${names} senza un graffio`:""}.${rival?` Più tardi, fra le macerie della porta est, hanno trovato ${rival}. Al banchetto nessuno ne ha parlato.`:""} Il re ci ha offerto oro, terre e un posto alla sua tavola.`};
  const chapters=[
   {key:"bosco",n:"Il bosco e la partenza",img:1,deco:"fern",paras:[
     `Il Saggio di Corte${sage?`, ${sageN},`:""} ci ha riuniti due giorni fa con un incarico che sembrava semplice: portare un pacco all'Arcanista Fuocobianco, a Hush. Il guaio era la strada. Hush sta dall'altra parte del Sablewood, e nel Sablewood si entra solo con un buon motivo. Cosa ci fosse nel pacco lo sapeva solo ${sage?(sage.pron==="lei"?"lei":sage.pron==="lui"?"lui":sageN):"il Saggio"}.`,
     `Ci siamo fermati dove comincia la foresta vera ad aspettare Luna, la cacciatrice di Hush che doveva farci da guida. Lì gli alberi salgono per centinaia di metri e chiudono il cielo, e a mezzogiorno accendi il fuoco come fosse sera. Sopra le fiamme giravano sciami di ${hyb}. Luna non arrivava.`,
     homes.length||rival?`Per ammazzare l'attesa abbiamo parlato di casa. ${homes.map(x=>`A ${firstName(x.r.id)} manca ${esc(x.h.n.trim())}${x.h.note&&x.h.note.trim()?` («${esc(x.h.note.trim().replace(/\.$/,""))}»)`:""}.`).join(" ")}${rival?` Poi è venuto fuori il nome di ${rival}${rivalNote?`, che ${rivalNote}`:""}. Se tornassimo a mani vuote, ${rival} brinderebbe.`:""}`:"",
     F.luna==="saved"?`Le grida sono arrivate all'improvviso, dal buio. Abbiamo lasciato il fuoco e siamo corsi tra radici alte come muri, nel fango fino alle caviglie. Siamo arrivati in tempo.`
      :F.luna==="dead"?`Le grida sono arrivate all'improvviso, dal buio. Abbiamo lasciato il fuoco e siamo corsi più che potevamo, ma ogni radice ci rubava un passo. A metà strada le grida si sono fermate.`
      :`Le grida sono arrivate all'improvviso, dal buio, e abbiamo lasciato il fuoco di corsa.`,
     ...devs(["1:inizio"])],
    aside:critOf(L["1"])||`Sciami di ${hyb} sopra il fuoco. Poi il grido.`},
   {key:"luna",n:"Luna e il guardiano",img:2,deco:"moon",paras:F.luna==="saved"?[
     `Luna era a terra in una radura, ferita: una fata grande come due mele, con una pelle d'ornitorinco addosso a fare da mantello. Sopra di lei stava lo Strixwolf, un lupo bianco con la testa di gufo. Non ha aperto il becco, eppure l'abbiamo sentito tutti, dentro la testa: Luna aveva cacciato un cucciolo del suo branco e doveva pagare.`,
     F.pact==="yes"?`Chiedeva una vita per una vita. Poi ha cambiato idea, o ha finto di cambiarla: gli bastava un momento del tempo di uno di noi, da riscuotere prima della fine del viaggio. ${bargain} ha accettato prima che potessimo discuterne. Lo Strixwolf ha lasciato andare Luna ed è sparito tra gli alberi.`
      :`Chiedeva una vita per una vita, e non avevamo intenzione di dargliela. Ci sono voluti fulmini, morsi e parecchia testardaggine, ma alla fine è stato lui a decidere che non ne valeva la pena.`,
     `Luna si è rimessa in piedi, ci ha guardati uno per uno e ci ha fatto notare che eravamo in ritardo. Da lì in poi ci ha fatto da guida, e il ritardo non ce l'ha più fatto dimenticare.${F.pact==="yes"?` ${bargain}, da quel giorno, si guarda spesso alle spalle.`:""}`,
     ...devs(["1:prezzo"])]
    :[lunaDiedFight?`Luna era a terra in una radura, e sopra di lei lo Strixwolf, un lupo bianco con la testa di gufo. Abbiamo provato a strappargliela e non ci siamo riusciti. «Il prezzo è pagato», ci ha detto dentro la testa, e se n'è andato.`
      :`Nella radura c'era solo il corpo di Luna. Chi l'aveva uccisa non era rimasto ad aspettarci.`,
     F.ring?`Al dito portava una fede incantata, di quelle che puntano sempre verso lo sposo. L'abbiamo presa: in tutta la foresta era l'unica cosa che sapesse dove andare.`
      :`Le abbiamo lasciato la fede al dito e siamo ripartiti senza guida.`,
     ...devs(["1:prezzo"])],
    aside:"«Una vita per una vita.» Detto con la calma di chi ha tempo."},
   {key:"ombre",n:"Le ombre della foresta",img:3,deco:"feather",paras:[
     `Ci ha avvertiti il silenzio. Gli scarabei-serpente hanno smesso di frusciare, i lama-saltafango sono spariti${luna()?` e Luna ha mormorato: «Oh, bastoncini»`:""}. Dagli alberi sono usciti gli Scarshade, sagome d'uomo ritagliate nell'aria. Dentro ognuna si vedeva un'altra foresta, più bassa e più verde: quella di prima che gli Antichi Dèi morissero qui.`,
     F.learned===true?`Volevano sapere cosa portavamo. Uno di loro ha appoggiato la mano sulla fronte di ${sageN} e ha preso quello che cercava. Adesso sanno che la nostra città è senza protezione, e se ne sono andati verso casa nostra.${kills("2:emissari")?` ${kills("2:emissari")}, ma non è servito.`:""}`
      :`Volevano sapere cosa portavamo e non l'hanno saputo.${kills("2:emissari")?` ${kills("2:emissari")}; gli altri sono svaniti com'erano venuti.`:""}`,
     F.learned?(F.shortcut==="taken"?`Da quel momento abbiamo contato le ore. ${luna()?"Luna conosceva una scorciatoia":"Abbiamo trovato una scorciatoia"} che passa per le parti peggiori del Sablewood, e l'abbiamo presa senza votare.`
      :`Da quel momento abbiamo contato le ore. Abbiamo tenuto il sentiero lungo, e ogni ora persa ce la siamo rinfacciata.`):"",
     ...devs(["2:emissari","2:polvere"])],
    aside:critOf(L["2"])||"Dentro uno Scarshade c'erano alberi giovani."},
   {key:"fiume",n:"Il fiume Orfanatore",img:4,deco:"leaf",skip:F.shortcut!=="taken",paras:[
     `La scorciatoia finiva sull'Orfanatore. L'abbiamo sentito un'ora prima di vederlo: l'acqua corre così forte da sembrare una cascata messa di traverso.`,
     `L'abbiamo passato a pezzi, tra un ponte di corda spezzato, un isolotto e le liane appese ai rami.${drowned.length?` La corrente ha trascinato sotto ${list(drowned)}, e c'è voluto tutto il gruppo per riportare a galla ${drowned.length>1?"tutti":drowned[0]}.`:" La corrente non si è presa nessuno."}${S.pcs.some(r=>r.id==="barnacle")?" Barnacle respira sott'acqua, ma ha il terrore di nuotare, e ce l'ha ripetuto a ogni bracciata.":""}`,
     `${S.loot.length?`Dal fondo abbiamo ripescato ${list(S.loot.map(esc))}. `:""}Siamo usciti dall'altra parte bagnati fino alle ossa, ma c'eravamo tutti.`,
     ...devs(["2.5:fiume"])],
    aside:critOf(L["2.5"])||"Le liane scivolose. La riva che non arrivava mai."},
   {key:"hush",n:"Il villaggio di Hush",img:5,deco:"key",paras:[
     `Hush si annuncia con un cippo di pietra: un volto scolpito con un dito sulle labbra. L'abbiamo superato, si è sentito come lo scoppio di una bolla, e il villaggio è apparso dal nulla. Capanne di legno, e decine di facce che non ci volevano lì.`,
     luna()?"Luna ci ha preceduti oltre il cippo e ha garantito per noi, con l'entusiasmo di chi garantisce per un sacco di patate."
      :F.ring?"Nessuno voleva parlarci. La fede di Luna puntava dritta verso un fauno, Octavio: suo marito. Dirgli cos'era successo è stata la parte peggiore del viaggio."
      :"Nessuno voleva parlarci. Alla fine ci hanno dato retta Fidget, un bambino che non sta fermo un secondo, Lausa la fabbra e Octavio.",
     `Poi è arrivato l'Anziano Halython, un halfling con la barba bianca e un bastone che batteva per terra a ogni parola, e ci ha ordinato di andarcene.${pactAtHush?` Lì lo Strixwolf è venuto a riscuotere: ${bargain} ha alzato la mano contro un paesano, e dopo non sapeva spiegare perché.`:""}${F.peaceUsed?" L'Anziano ha detto «Ci sarà pace», e ci siamo sentiti vuoti.":""}${F.elderDone?" Alla fine ha ceduto e ci ha indicato l'albero più alto del villaggio. Lassù c'era la villa dell'Arcanista.":""}`,
     ...devs(["3:arcanista","3:anziano"])],
    aside:critOf(L["3"])||"Il bastone dell'Anziano. Toc. Toc."},
   {key:"rituale",n:"Il rinnovo della protezione",img:6,deco:"dragonfly",paras:[
     `La villa è scesa dall'albero per venirci incontro. Al posto della porta c'è un bocciolo enorme: si è aperto e ne è uscita l'Arcanista Fuocobianco, per metà donna e per metà lucciola, carica di libri. Per prima cosa ci ha chiesto come stesse «il piccolo Emeris».`,
     `${F.ritualHere?"Il rituale l'abbiamo fatto nel villaggio, per non perdere altro tempo.":"L'abbiamo seguita fino alla Valle Aperta, l'unico punto del Sablewood da cui si vede il cielo."}${F.rest==="taken"?(F.ritualHere?" Lei ha chiesto un'ora per prepararsi e noi l'abbiamo passata a riposare.":" Lei ha chiesto un'ora per prepararsi e noi l'abbiamo passata sdraiati a guardare le stelle."):F.rest==="skipped"?" Non ci siamo riposati: l'abbiamo aiutata a preparare tutto, perché di tempo non ce n'era.":""}`,
     `Quando il rituale è partito, la foresta ha cominciato a urlare. Dagli alberi sono usciti Scheletri Antichi ed Eroi Dimenticati, e noi ci siamo messi in cerchio attorno all'Arcanista.${!F.ritualDone&&kills("4:rituale")?` ${kills("4:rituale")}.`:""}${F.ritualDone?" Quando il sigillo si è riacceso, quelli rimasti si sono sbriciolati. Prima di salutarci, l'Arcanista ci ha trasformati in libellule con la nostra faccia: l'insetto più veloce che conosca, ha detto, con qualche miglioria sua.":""}`,
     ...devs(["4:villa","4:preparare","4:rituale"])],
    aside:critOf(L["4"])||"Ali di libellula, e sotto un mare di alberi."},
   {key:"casa",n:"Il ritorno a casa",img:7,deco:"compass",last:true,paras:[
     `Abbiamo volato per centinaia di chilometri in un paio d'ore. La città l'abbiamo vista da lontano, ed era sotto assedio: orso-vespe giganti dal cielo, alberi del Sablewood che picchiavano le mura con le radici, e per le strade gli Scarshade di prima.`,
     `La pietra andava rimessa nella corona della statua di re Emeris II, davanti al castello. L'avevamo vista decine di volte senza sapere cosa fosse.${roller?` L'ultimo slancio è toccato a ${roller}.`:""}${F.bargain&&F.bargainUsed&&!pactAtHush?` Proprio lì lo Strixwolf si è preso il momento di ${bargain}.`:""}`,
     F.final?fin[F.final]:"",
     ...devs(["5:finale","5:risolvere"])],
    aside:critOf(L["5"])||"La pietra che entra nell'incavo."}
  ];
  return chapters.filter(c=>!c.skip).map(c=>({...c,paras:c.paras.filter(Boolean)}));
}
const dyEdit=(k,html)=>{const e=dyCfg().edits[k];return e!=null?e:html};
const dropCap=html=>/class="dcap"/.test(html)?html:html.replace(/<p>(\s*)([A-Za-zÀ-ÿ«])/,(m,sp,c)=>`<p>${sp}<span class="dcap">${c}</span>`);
const LAYOUTS=["hero","right","bottom","left"];
function diaryPages(){
  const cfg=dyCfg(),chs=diaryChapters(),roman=["I","II","III","IV","V","VI","VII","VIII"];
  const portrait=r=>{const g=cfg.portraits[r.id]&&VIEW.gallery.find(x=>x.gid===cfg.portraits[r.id]);return g?`<img src="${esc(imgSrc(g))}" alt="">`:`<span class="emb">${EMB[r.id]||""}</span>`};
  const frame=`${corner("tl","")}${corner("tr","translate(100 0) scale(-1 1)")}${corner("bl","translate(0 100) scale(1 -1)")}${corner("br","translate(100 100) scale(-1 -1)")}`;
  const cover=`<section class="dpage dcover pa"><div class="dc-frame">${frame}</div>
    <div class="dc-in"><span class="dc-kicker">Diario di viaggio</span><h1>I Messaggeri<br><small>di</small> Sablewood</h1><div class="dvine dc-vine">${VINE}</div>
     <img class="dc-ink" src="diario/ink1.png" alt="">
     <div class="dc-meta"><b>${esc(cfg.group||"Brigata Daggerheart")}</b>${cfg.narrator?`<span>raccontato da ${esc(cfg.narrator)}</span>`:""}${cfg.date?`<span>${esc(cfg.date)}</span>`:""}</div></div></section>`;
  const pcRow=(r,i)=>{const p=P(r),h=plainHome(S.pcs.indexOf(r)),g=cfg.portraits[r.id]&&VIEW.gallery.find(x=>x.gid===cfg.portraits[r.id]);
    const fig=g?`<img class="dpc-photo" src="${esc(imgSrc(g))}" alt="">`:PREGEN[r.id]?`<img class="dpc-fig" src="diario/pg-${r.id}.png" alt="">`:`<span class="emb">${EMB[r.id]||""}</span>`;
    return `<article class="dpc ${i%2?"alt":""}"><div class="dpc-pic">${fig}</div><div class="dpc-t"><h3>${esc(p.name)}</h3><span class="dpc-k">${esc(p.her)} · ${esc(p.cls)}${p.sage?" · Saggio di Corte":""}${S.flags.bargain===r.id?" · legato allo Strixwolf":""}</span>
      <p>${esc(p.desc||"")}${h?` A casa l'aspetta ${esc(h.n.trim())}.`:""}</p>${r.notes&&r.notes.trim()?`<p class="dhand">«${esc(r.notes.trim())}»</p>`:""}</div></article>`};
  const half=Math.ceil(S.pcs.length/2);
  const party=`<section class="dpage dparty pb"><div class="dp-in"><span class="dch-n">Prima pagina</span><h2 class="dh">La compagnia</h2><div class="dvine">${VINE}</div>
    <div class="dpcs">${S.pcs.slice(0,half).map(pcRow).join("")}</div>${sk("fern","dp-fern")}</div></section>`
   +`<section class="dpage dparty pa"><div class="dp-in"><div class="dpcs two">${S.pcs.slice(half).map((r,i)=>pcRow(r,i+half)).join("")}</div>${sk("mushroom","dp-mush")}<span class="dfolio">3</span></div></section>`;
  const chap=(c,i)=>{const k=c.key,lay=LAYOUTS[i%LAYOUTS.length];
    const body=dropCap(dyEdit(k+".testo",c.paras.map(p=>`<p>${p}</p>`).join("")));
    const img=`<img class="dink" src="diario/ink${c.img}.png" alt="">`;
    const note=c.aside?`<div class="dnote" style="--rot:${i%2?2:-2.5}deg"><span class="dsmall">da ricordare</span><div class="dhand dtxt" contenteditable="true" spellcheck="false" data-dy="${k}.nota">${dyEdit(k+".nota",c.aside)}</div></div>`:"";
    const text=`<div class="dtxt dprose" contenteditable="true" spellcheck="false" data-dy="${k}.testo">${body}</div>`;
    const head=`<div class="dch-h"><span class="dch-n">Capitolo ${roman[i]}</span><h2 class="dh">${c.n}</h2><div class="dvine sm">${VINE}</div></div>`;
    const lines=c.last?`<div class="dsec"><span class="dsmall">Ognuno scriva qui cosa farà il giorno dopo.</span><div class="dlines">${"<span></span>".repeat(4)}</div></div>`:"";
    const inner=lay==="hero"?`${head}<figure class="dfig hero">${img}</figure><div class="dbody">${text}${note}${lines}</div>`
     :lay==="right"?`${head}<div class="dbody"><figure class="dfig fr">${img}</figure>${text}${note}${lines}</div>`
     :lay==="left"?`${head}<div class="dbody"><figure class="dfig fl">${img}</figure>${text}${note}${lines}</div>`
     :`${head}<div class="dbody">${text}${note}${lines}</div><figure class="dfig foot">${img}</figure>`;

async function diaryPdf(){
  DY.busy="pdf";DY.err="";redrawDiary();
  try{
    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
    await (document.fonts?.ready||Promise.resolve());
    const pages=[...document.querySelectorAll("#dy-pages .dpage")];
    await Promise.all([...document.querySelectorAll("#dy-pages img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    document.body.classList.add("dy-capture");
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    for(let i=0;i<pages.length;i++){
      const cv=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:null,logging:false});
      if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.86),"JPEG",0,0,210,297,undefined,"FAST");
    }
    document.body.classList.remove("dy-capture");
    const blob=pdf.output("blob"),name=`Diario di Sablewood${dyCfg().group?" - "+dyCfg().group:""}.pdf`;
    const dl=window.claude?.use?await claude.use("downloads"):null;
    if(dl){try{await dl.save({filename:name,data:blob})}catch(e){if(e?.code!=="declined")DY.err="Il salvataggio non è riuscito: prova con «Stampa» e scegli «Salva come PDF»."}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
  }catch(e){document.body.classList.remove("dy-capture");DY.err="Non sono riuscito a creare il PDF qui: usa «Stampa» e scegli «Salva come PDF»."}
  DY.busy="";redrawDiary();
}
async function diaryClaude(){
  let sample=null;try{sample=window.claude?.use?await claude.use("sample"):null}catch(e){}
  if(!sample){DY.err="La riscrittura usa Claude dal tuo account: apri il tracker su claude.ai.";redrawDiary();return}
  DY.busy="claude";DY.err="";redrawDiary();
  const chs=diaryChapters(),cfg=dyCfg();
  const facts=chs.map(c=>({key:c.key,titolo:c.n,testo:strip(dyEdit(c.key+".testo",c.paras.map(p=>`<p>${p}</p>`).join("")).replace(/<span class="dcap">(.)<\/span>/,"$1"))}));
  const party=S.pcs.map(r=>{const p=P(r);return `${p.name} (${p.her}, ${p.cls})`}).join("; ");
  try{
    const out=await sample.json(`Sei il narratore del diario di viaggio di un gruppo di avventurieri (gioco di ruolo Daggerheart, avventura "I Messaggeri del Sablewood"). Riscrivi ogni capitolo come un racconto unico e scorrevole, scritto dai personaggi stessi in prima persona plurale, in un italiano caldo e concreto, con un filo d'ironia. I capitoli devono leggersi come un solo diario: ognuno si apre collegandosi a come è finito il precedente. Conserva TUTTI i fatti e i nomi presenti, non inventare eventi, PNG o oggetti nuovi, non cambiare gli esiti.
Regole di stile, rispettale tutte: niente aperture d'atmosfera; niente chiuse a effetto, morali o frasi che tirano le somme («e da quel giorno…», «non lo dimenticheremo»); niente terne di aggettivi o di frasi parallele; niente trattini lunghi; niente transizioni da formulario («poi», «ma non era finita»); niente cliché fantasy («antico», «oscuro», «misterioso», «destino», «come se»). Frasi di lunghezza varia, verbi concreti, dettagli che solo chi c'era può sapere, qualche battuta asciutta. Tra 150 e 220 parole per capitolo, 3-4 paragrafi.
Gruppo: ${party}.${cfg.narrator?` Narratore: ${cfg.narrator}.`:""}
Capitoli (JSON): ${JSON.stringify(facts)}
Rispondi SOLO con un oggetto JSON {"<key>": ["paragrafo", "paragrafo", ...], ...} con le stesse chiavi.`,{modelTier:"default",cache:false});
    chs.forEach(c=>{const ps=out&&out[c.key];if(Array.isArray(ps)&&ps.length)cfg.edits[c.key+".testo"]=ps.map(t=>`<p>${esc(String(t))}</p>`).join("")});
    persist();
  }catch(e){DY.err=e?.code==="not_granted"?"Accesso a Claude negato per questa pagina.":e?.code==="rate_limited"?"Troppe richieste ravvicinate: riprova tra poco.":"La riscrittura non è riuscita. I testi restano quelli di prima."}
  DY.busy="";redrawDiary();
}

  const roles=[...new Set(all.filter(i=>i.kind==="adv").map(i=>i.role))];
  return `<div class="cd-fg"><span class="lab">Tipo</span><div class="cd-cs">${chip("cat","all","Tutti",all.length)}${chip("cat","adv","Avversari",all.filter(i=>i.kind==="adv").length)}${chip("cat","png","PNG",all.filter(i=>i.kind==="png").length)}${chip("cat","env","Ambienti",all.filter(i=>i.kind==="env").length)}</div></div>
   ${BV.cat==="all"||BV.cat==="adv"?`<div class="cd-fg"><span class="lab">Ruolo</span><div class="cd-cs">${roles.map(r=>chip("role",r,ROLE_IT[r]||r)).join("")}</div></div>`:""}`;
}
function bvResults(list){
  if(!list.length)return `<p class="cd-empty">Nessuna scheda corrisponde. <button class="btn xs" data-a="bv-clear">Azzera i filtri</button></p>`;
  let n=0;
  return [["adv","Avversari"],["png","PNG"],["env","Ambienti"]].map(([k,l])=>{const it=list.filter(i=>i.kind===k);
    return it.length?`<h3 class="bv-l">${l} <span class="xsmall muted">${it.length}</span></h3><div class="sbs">${it.map(i=>i.e?envBlock(i.e,n++):statBlock(i.k,n++)).join("")}</div>`:""}).join("");
}
function renderBestiary(){
  const list=bvFiltered();
  return `<div class="stack"><div class="cd-head"><h2>Avversari</h2><p class="small muted">Nemici, PNG e ambienti delle avventure, con scheda completa e abilità.</p></div>
  <div class="cd-top"><label class="cd-s"><span class="sr">Cerca un avversario</span><input id="bv-q" type="search" placeholder="Cerca per nome, abilità, descrizione…" value="${esc(BV.q)}" autocomplete="off"></label>
   <button class="btn" id="bv-clr" data-a="bv-clear" ${bvActive()?"":"disabled"}>Azzera filtri</button><span class="cd-n" id="bv-n">${list.length} ${list.length===1?"scheda":"schede"}</span></div>
  <div class="cd-fb" id="bv-fl">${bvFilters()}</div><div id="bv-res" class="stack">${bvResults(list)}</div></div>`;
}
function bvPaint(){
  const list=bvFiltered(),r=document.getElementById("bv-res");if(!r)return;
  r.innerHTML=bvResults(list);
  document.getElementById("bv-fl").innerHTML=bvFilters();
  document.getElementById("bv-clr").disabled=!bvActive();
  document.getElementById("bv-n").textContent=`${list.length} ${list.length===1?"scheda":"schede"}`;
}
let bvTimer=0;
document.addEventListener("input",e=>{if(e.target.id==="bv-q"){BV.q=e.target.value;clearTimeout(bvTimer);bvTimer=setTimeout(bvPaint,160)}});
document.addEventListener("keydown",e=>{
  const t=e.target;if(!t.matches?.("#nc-name,[id^=cr-]"))return;
  if(e.key==="Enter"){e.preventDefault();t.id==="nc-name"?createCampaign():A["camp-ren-save"]({k:t.dataset.k})}
  else if(e.key==="Escape"){e.preventDefault();t.id==="nc-name"?A["camp-new-no"]():A["camp-ren-no"]()}
});

function renderHub(){
  const secs=hubSections(),sec=secs.find(s=>s.k===APP.sec)||secs[0];
  let lastId=null;try{lastId=localStorage.getItem(ACTIVEKEY)}catch(e){}
  const last=campById(lastId);
  document.getElementById("bar").innerHTML=`<div class="brand"><b>Tavolo del GM</b><span>DAGGERHEART · CAMPAGNE E STRUMENTI</span></div>
   <nav class="hub-nav" aria-label="Sezioni">${secs.map(s=>{const n=s.n?.();return `<button class="${s===sec?"on":""}" data-a="hub-sec" data-k="${s.k}" ${s===sec?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s.ic}</svg>${s.l}${n!=null?`<span class="nb">${n}</span>`:""}</button>`}).join("")}</nav>
   <div class="bar-r">${last?`<button class="btn ok" data-a="camp-open" data-k="${esc(last.id)}">Riprendi «${esc(last.name)}»</button>`:""}${optBtn()}</div>`;
  document.getElementById("tabs").innerHTML="";
  document.getElementById("page").classList.remove("party");document.getElementById("party").innerHTML="";
  document.getElementById("view").innerHTML=`<div class="stack">${sec.html()}</div>`;
  sec.after?.();
}

let cdIO=null,cdTimer=0;
function cardsObserve(){
  const root=document.getElementById("cd-res");if(!root)return;
  const els=[...root.querySelectorAll(".kcard:not(.in),.cds-h:not(.in),.cg-l:not(.in)")];
  if(cdIO)cdIO.disconnect();
  if(!els.length)return;
  if(!("IntersectionObserver" in window)||creduced()){els.forEach(e=>e.classList.add("in"));CV.still=true;return}
  cdIO=new IntersectionObserver(es=>{
    es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top||a.boundingClientRect.left-b.boundingClientRect.left)
      .forEach((e,i)=>{e.target.style.setProperty("--d",Math.min(i,16)*50+"ms");e.target.classList.add("in");cdIO.unobserve(e.target)});
  },{rootMargin:"0px 0px -3% 0px",threshold:.05});
  els.forEach(e=>cdIO.observe(e));
  clearTimeout(cdTimer);cdTimer=setTimeout(()=>{CV.still=true},1400);
}
function cardsAfterRender(){cardsObserve()}

 "ctr-close":()=>upd(()=>{S.counter.on=false;log(`Contatore d'Assalto chiuso (era ${S.counter.value})`)}),
 "fear-step":o=>upd(()=>addFear(+o.k,"manuale")),

  if(!now&&encAutoFill(o.k,ENC[o.k])){const n=S.foes.filter(f=>f.where===o.k).length;toast(`Incontro pronto: ${n} partecipant${n===1?"e":"i"} in scena`);persist()}render()},
 "pact-yes":()=>{const pc=document.getElementById("pact-pc")?.value;if(!pc){toast("Scegli il PG che accetta il patto");return}
  upd(()=>{S.flags.pact="yes";S.flags.bargain=pc;S.flags.bargainUsed=false;S.foes.filter(f=>f.where==="1:prezzo"&&f.tmpl==="strixwolf").forEach(f=>f.dead=true);log(`${pcName(pc)} accetta il patto fatato dello Strixwolf`,"fear")})},
 "pact-no":()=>upd(()=>{S.flags.pact="no";S.flags.bargain="";encAutoFill("1:prezzo",ENC["1:prezzo"]);S.foes.filter(f=>f.where==="1:prezzo").forEach(f=>f.dead=false);encOpen.set("1:prezzo",true);log("Il patto è rifiutato: combattimento contro lo Strixwolf","bad");
  setTimeout(()=>document.getElementById("enc-1_prezzo")?.scrollIntoView({behavior:"smooth",block:"start"}),40)}),

 "enc-plus":o=>{picker=o.k||null;render()},
 "enc-add":o=>upd(()=>{spawn(o.k,+o.n||1,o.w);picker=null;encOpen.set(o.w,true)}),
 "enc-add-sel":o=>{const el=document.getElementById("pick-"+o.w.replace(/[:.]/g,"_"));if(!el)return;upd(()=>{spawn(el.value,1,o.w);picker=null})},
 "enc-reset-ask":o=>{encResetAsk=o.k;render()},
 "enc-reset-no":()=>{encResetAsk=null;render()},
 "enc-reset":o=>upd(()=>{encResetAsk=null;S.foes.filter(f=>f.where===o.k).forEach(f=>{f.hp=0;f.st=0;f.cond=[];f.acted=false;f.dead=false});if(ENC[o.k]?.reset)ENC[o.k].reset();if(o.k==="3:anziano")syncElder();log("Incontro reimpostato")}),
 "sheet-tab":o=>{sheetTab=o.k;render()},
 "chase-d":o=>upd(()=>{const n=+o.i+1;S.chase.d=S.chase.d===n?n-1:n}),
 "chase-t":o=>upd(()=>{const n=+o.i+1;S.chase.t=S.chase.t===n?n-1:n}),
 chase:o=>upd(()=>{
  if(o.k==="r"){S.chase={d:3,t:3};return}
  if(o.k==="s")S.chase.d=Math.max(0,S.chase.d-1);if(o.k==="c")S.chase.d=Math.max(0,S.chase.d-2);if(o.k==="f")S.chase.t=Math.max(0,S.chase.t-1);
  log(`Inseguimento: Distanza ${S.chase.d}, Tempo ${S.chase.t}`);
  if(S.chase.d===0&&!S.flags.luna){S.flags.luna="saved";log("Il gruppo raggiunge Luna in tempo","ok")}
  if(S.chase.t===0&&S.chase.d>0&&!S.flags.luna){S.flags.luna="dead";log("Luna muore prima dell'arrivo del gruppo","bad")}}),
 complication:()=>upd(()=>{addFear(-1,"complicazione");const c=COMPLICATIONS[d(3)-1];log("Complicazione: "+c,"fear");toast(c)}),
 luna:o=>upd(()=>{S.flags.luna=o.k;log(o.k==="saved"?"Luna è salva":"Luna è morta",o.k==="saved"?"ok":"bad")}),
 flag:o=>upd(()=>{S.flags[o.k]=!S.flags[o.k]}),
 spawn:o=>upd(()=>spawn(o.k,+o.n||1,o.w)),
 learned:o=>upd(()=>{S.flags.learned=o.k==="1";log(o.k==="1"?"Gli Scarshade hanno scoperto cos'è il pacco!":"Gli Scarshade non hanno scoperto nulla",o.k==="1"?"bad":"ok")}),
 "counter-shades":()=>upd(()=>counterStart(15+aliveShades(),`15 + ${aliveShades()} Scarshade sopravvissuti`)),
 shortcut:o=>upd(()=>{S.flags.shortcut=o.k;if(o.k==="skip"){counterAdd(2,"nessuna scorciatoia");S.act="3"}else{S.act="2.5";log("Il gruppo prende la scorciatoia")}top0()}),
 "river-pip":o=>upd(()=>{const n=+o.i+1;S.river.t=S.river.t===n?n-1:n}),
 river:o=>upd(()=>{
  if(o.k==="r"){S.river.t=4;return}
  if(o.k==="s"){if(S.pcs.some(p=>p.cond.includes("Annegamento"))&&S.river.t<=1){toast("Qualcuno sta annegando: il conto non può arrivare a zero");return}S.river.t=Math.max(0,S.river.t-1);log(`Traversata −1 → ${S.river.t}`,"ok")}
  if(o.k==="f"){log("Fallimento nella traversata: azione Annegare","bad");toast("Scegli un PG: reazione di Agilità o inizia ad annegare")}}),
 "drown-free":o=>upd(()=>{const r=pcRaw(o.id);r.cond=r.cond.filter(c=>c!=="Annegamento");log(`${pcName(r.id)} si libera dall'annegamento`,"ok")}),
 "drown-tick":()=>upd(()=>S.pcs.filter(p=>p.cond.includes("Annegamento")).forEach(p=>pcMarkStress(p.id,1,"annegamento"))),
 "drown-set":()=>{const r=pcRaw(drownPick);if(!r){toast("Scegli prima un PG");return}upd(()=>{if(!r.cond.includes("Annegamento"))r.cond.push("Annegamento");log(`${pcName(r.id)} sta annegando`,"bad")})},
 undertow:()=>upd(()=>{
  const dr=S.pcs.filter(p=>p.cond.includes("Annegamento"));if(!dr.length)return;const r=dr.find(p=>p.id===drownPick)||dr[0];
  addFear(-1,"Risacca");const k=rollShow("1d4","Risacca").total;let txt=`Risacca su ${pcName(r.id)}: d4 = ${k}. ${UNDERTOW[k-1]}.`;
  if(k===1)pcMarkStress(r.id,1,"risacca");
  if(k===2){const x=rollShow("2d6+3","Risacca: danni");txt+=` ${x.text}.`;pcDamage(r.id,x.total,false)}
  S.undertow=txt;log(txt,"fear")}),
 loot:o=>upd(()=>{const t=TREASURES[+o.i][0];S.loot.push(t);log(`Recuperato dal fiume: ${t}`,"ok")}),
 "search-tick":()=>upd(()=>{S.flags.searchTick=true;counterAdd(1,"ricerca nel villaggio")}),
 "elder-st":o=>upd(()=>{const n=+o.i+1;S.elderSt=(S.elderSt||0)===n?n-1:n;syncElder()}),
 elder:o=>upd(()=>{
  if(o.k==="s"){S.elderSt=Math.min(4,(S.elderSt||0)+1);log(`L'Anziano segna 1 Stress (${S.elderSt}/4)`);syncElder()}
  else{if(!elderPick){toast("Scegli il PG che ha tirato");return}pcMarkStress(elderPick,1,"Diffidente")}}),
 vill:o=>upd(()=>{S.villagers=Math.max(0,S.villagers+(+o.k))}),
 swarm:o=>upd(()=>{const f=foe(o.id);if(f&&f.swarm)S[f.swarm]=Math.max(0,(S[f.swarm]||0)+(+o.k))}),
 "vill-attack":()=>upd(villAttack),
 "bargain-used":()=>upd(()=>{S.flags.bargainUsed=true;log("Il patto fatato è stato riscosso ad Hush","fear")}),
 "ritual-here":o=>upd(()=>{const here=o.k==="1";if(!here&&S.flags.ritualHere!==false)counterAdd(1,"rituale alla Valle Aperta");S.flags.ritualHere=here;if(here)log("I paesani accettano il rituale nel villaggio")}),
 rest:o=>upd(()=>{const r=pcRaw(o.id),p=P(r);const x=rollShow("1d4+1",`${pcName(o.id)}: ${{wounds:"Curare ferite",stress:"Ricomporsi",armor:"Riparare armatura",prep:"Prepararsi"}[o.k]}`);if(o.k==="prep")pendingShow.pop();(S.rest[r.id]=S.rest[r.id]||[]).push(o.k);
  if(o.k==="wounds"){r.hp=Math.max(0,r.hp-x.total);log(`${p.name} cura ${x.total} PF (${x.text})`,"ok")}
  if(o.k==="stress"){r.st=Math.max(0,r.st-x.total);log(`${p.name} rimuove ${x.total} Stress (${x.text})`,"ok")}
  if(o.k==="armor"){r.ar=Math.max(0,r.ar-x.total);log(`${p.name} ripara ${x.total} slot Armatura (${x.text})`,"ok")}
  if(o.k==="prep"){r.hope=Math.min(6,r.hope+1);log(`${p.name} si prepara: +1 Speranza`,"hope")}}),
 "rest-group":()=>upd(()=>{const ps=S.pcs.filter(p=>(S.rest[p.id]||[]).length<2);ps.forEach(p=>{(S.rest[p.id]=S.rest[p.id]||[]).push("prep");p.hope=Math.min(6,p.hope+2)});log(`Preparazione di gruppo: +2 Speranza a ${ps.map(p=>pcName(p.id)).join(", ")}`,"hope")}),
 "rest-reset":()=>upd(()=>{S.rest={};S.flags.rest=null}),
 downtime:()=>upd(()=>{const x=rollShow("1d4","Paura del GM per il riposo");addFear(x.total,"riposo breve ("+x.text+")");counterAdd(2,"riposo breve");S.flags.rest="taken"}),
 "skip-rest":()=>upd(()=>{S.flags.rest="skipped";log("Il gruppo salta il riposo per guadagnare tempo")}),
 ritual:o=>upd(()=>{if(o.k==="hit"){S.ritual.v=Math.min(8,S.ritual.v+1);log(`L'Arcanista è colpita: Rituale +1 → ${S.ritual.v}`,"bad")}if(o.k==="kill"){S.ritual.v=Math.max(0,S.ritual.v-1);log(`Rituale −1 → ${S.ritual.v}`,"ok")}}),
 "ritual-pip":o=>upd(()=>{const n=+o.i+1;S.ritual.v=S.ritual.v===n?n-1:n}),
 "ritual-spawn":()=>upd(()=>{spawn("skeleton",5,"4:rituale");spawn("hero",2,"4:rituale")}),
 vengeance:()=>upd(()=>{addFear(-1,"Vendetta degli Antichi Dèi");spawn("skeleton",2,"4:rituale")}),
 "ritual-end":()=>upd(ritualEnd),
 "home-add":()=>upd(()=>S.home.push({n:"",note:""})),
 "home-del":o=>upd(()=>S.home.splice(+o.i,1)),
 // dadi
 // PG
 "pc-open":o=>{openPc=openPc===o.id?null:o.id;renderParty()},
 "pc-show":o=>{openPc=o.id;UI.party=true;saveUI();renderBar();renderParty()},
 "pc-pip":o=>upd(()=>{const r=pcRaw(o.id),k=o.k,n=+o.i+1;r[k]=r[k]===n?n-1:n;if(k==="hp"){if(r.hp<P(r).hpMax&&deathFor===r.id)deathFor=null;checkDown(r.id)}}),
 "pc-thr":o=>upd(()=>pcMarkHp(o.id,+o.k,`danni ${["","minori","gravi","severi"][+o.k]}`)),
 "pc-armor":o=>upd(()=>{const r=pcRaw(o.id),p=P(r);if(r.ar>=p.arMax){toast("Nessuno slot Armatura libero");return}if(r.hp<1){toast("Nessun PF da togliere");return}r.ar++;r.hp--;if(deathFor===r.id)deathFor=null;log(`${p.name} segna 1 slot Armatura: −1 PF`)}),
 "pc-sage":o=>upd(()=>{const r=pcRaw(o.id);r.over.sage=!P(r).sage}),
 "pc-cond":o=>upd(()=>{const r=pcRaw(o.id);r.cond=toggleCond(r.cond,o.k,r.id);log(`${pcName(r.id)}: ${o.k} ${r.cond.includes(o.k)?"attivo":"rimosso"}`)}),
 "pc-dmg":o=>{const v=+document.getElementById("dmg-"+o.id).value;if(!(v>0)){toast("Inserisci i danni");return}const arm=document.getElementById("arm-"+o.id).checked;upd(()=>pcDamage(o.id,v,arm))},
 "hope-feat":o=>upd(()=>{const r=pcRaw(o.id),p=P(r);if(r.hope<3)return;r.hope-=3;log(`${p.name} usa ${p.hopeF[0]} (−3 Speranza)`,"hope");if(r.id==="khari")r.ar=Math.max(0,r.ar-2);if(r.id==="barnacle"&&!r.cond.includes("Schivata del Ladro"))r.cond.push("Schivata del Ladro")}),
 potion:o=>upd(()=>{const r=pcRaw(o.id),p=P(r);const x=rollShow("1d4",`${p.name}: ${p.item[0]}`);r.item=true;if(p.item[2]==="hp")r.hp=Math.max(0,r.hp-x.total);else r.st=Math.max(0,r.st-x.total);log(`${p.name} beve ${p.item[0]}: −${x.total} ${p.item[2]==="hp"?"PF":"Stress"}`,"ok")}),
 death:o=>upd(()=>{const r=pcRaw(o.id),p=P(r);deathFor=null;
  if(o.k==="blaze")log(`${p.name} sceglie la Gloria Finale: un'ultima azione con successo critico, poi muore`,"bad");
  if(o.k==="avoid"){const h=rollShow("1d12",`${p.name}: dado Speranza`).total;if(!r.cond.includes("Incosciente"))r.cond.push("Incosciente");log(`${p.name} evita la morte e perde i sensi. Dado Speranza ${h}${h<=1?": ottiene una cicatrice":": nessuna cicatrice"}`,"bad")}
  if(o.k==="risk"){const h=rollShow("1d12","Rischiare Tutto: Speranza").total,f=rollShow("1d12","Rischiare Tutto: Paura").total;
   if(h===f){r.hp=0;r.st=0;log(`${p.name} rischia tutto: ${h}/${f}, critico! Recupera tutti PF e Stress`,"ok")}
   else if(h>f){let c=h;const hp=Math.min(r.hp,c);r.hp-=hp;c-=hp;r.st=Math.max(0,r.st-c);log(`${p.name} rischia tutto: Speranza ${h} > Paura ${f}. Recupera ${h} tra PF e Stress`,"ok")}
   else log(`${p.name} rischia tutto: Paura ${f} > Speranza ${h}. Il personaggio muore`,"bad")}}),
 // avversari
 "foe-open":o=>{openFoe=openFoe===o.id?null:o.id;sheetTab="cap";render();if(openFoe)setTimeout(()=>document.getElementById("fd-"+o.id)?.scrollIntoView({behavior:"smooth",block:"nearest"}),0)},
 "foe-pip":o=>upd(()=>{const f=foe(o.id),n=+o.i+1;f[o.k]=f[o.k]===n?n-1:n;if(o.k==="st"&&f.tmpl==="elder"){S.elderSt=f.st;syncElder()}if(o.k==="hp"){if(f.hp>=f.hpMax)foeDefeated(f);else f.dead=false}}),
 "foe-thr":o=>upd(()=>{const f=foe(o.id);foeMark(f,"hp",+o.k);log(`${f.name} segna ${o.k} PF (${f.hpMax-f.hp}/${f.hpMax} rimasti)`)}),
 "foe-acted":o=>upd(()=>{const f=foe(o.id);f.acted=!f.acted}),
 "foe-cond":o=>upd(()=>{const f=foe(o.id);f.cond=toggleCond(f.cond,o.k,"");log(`${f.name}: ${o.k} ${f.cond.includes(o.k)?"attivo":"rimosso"}`)}),
 "foe-feat":o=>upd(()=>{const f=foe(o.id),x=f.feats[+o.i];
  if(x.fx==="no-hosp"){noHosp();f.acted=true;return}if(x.fx==="vill-attack"){if(S.fear<1||!S.villagers){toast(S.villagers?"Paura insufficiente":"Nessun paesano in scena");return}villAttack();f.acted=true;return}if(x.fx==="peace"){peace();f.acted=true;return}
  if(x.c){const [k,n]=x.c.split(":");if(k==="fear"){if(S.fear<+n){toast("Paura insufficiente");return}addFear(-n,`${f.name}: ${x.n}`)}else{foeMark(f,"st",+n);log(`${f.name} segna ${n} Stress per ${x.n}`)}}
  f.acted=true;log(`${f.name} usa ${x.n}`,"fear")}),
 "foe-hit":o=>upd(()=>{const f=foe(o.id);const v=+document.getElementById("fd-in-"+o.id).value||0;if(!v)return;foeTakeDamage(f,v)}),
 r:o=>startRoll({...o}),
 "r-who":o=>{if(ROLL.pend)startRoll({...ROLL.pend.o,who:o.id})},
 "r-trait":o=>{if(ROLL.pend)startRoll({...ROLL.pend.o,trait:o.i})},
 "r-tgt":o=>{if(ROLL.pend)startRoll({...ROLL.pend.o,target:o.id})},
 "rp-cancel":()=>{ROLL.pend=null;renderRoll()},
 "rp-close":()=>{ROLL.cur=null;ROLL.showHist=false;renderRoll()},
 "rp-hist":()=>{ROLL.showHist=!ROLL.showHist;renderRoll()},
 "rm-exp":o=>{const res=ROLL.cur,r=pcRaw(res?.who);if(!r)return;const e=P(r).exp[+o.i];if(r.hope<1){toast("Speranza esaurita");return}r.hope--;res.exps.push({n:e[0],v:e[1]});res.effects.push(`${pcName(r.id)}: −1 Speranza per l'Esperienza.`);recalc(res);log(`${res.label}: +${e[1]} «${e[0]}» → ${res.total} (${res.verdict})`);persist();render()},
 "rm-help":o=>{const res=ROLL.cur,h=pcRaw(o.id);if(!res||!h||h.hope<1)return;h.hope--;res.helpers.push(pcName(h.id));res.adv.push(d(6));recalc(res);log(`${res.label}: aiuto di ${pcName(h.id)} → ${res.total} (${res.verdict})`);persist();render()},
 "rm-adv":()=>{const res=ROLL.cur;if(!res)return;res.adv.push(d(6));recalc(res);persist();render()},
 "rm-dis":()=>{const res=ROLL.cur;if(!res)return;res.dis.push(d(6));recalc(res);persist();render()},
 "rp-apply-pc":o=>upd(()=>{const res=ROLL.cur;if(!res||res.total==null)return;pcDamage(o.id,res.total,!!o.arm);res.applied=true;toast(`${pcName(o.id)} subisce ${res.total} danni`)}),
 "rp-apply-foe":o=>upd(()=>{const res=ROLL.cur,f=foe(o.id);if(!res||!f||res.total==null)return;foeTakeDamage(f,res.total);toast(`${f.name} subisce ${res.total} danni`)}),
 "foe-kill":o=>upd(()=>{const f=foe(o.id);if(f.dead){f.dead=false;f.hp=Math.min(f.hp,Math.max(0,f.hpMax-1))}else{f.hp=f.hpMax;foeDefeated(f)}}),
 "foe-del":o=>upd(()=>{S.foes=S.foes.filter(f=>f.id!==o.id);if(openFoe===o.id)openFoe=null}),
 "new-round":o=>upd(()=>{S.foes.filter(f=>!o.w||f.where===o.w).forEach(f=>f.acted=false);log("Nuovo giro di riflettori")}),
 "add-foe":()=>upd(()=>spawn(document.getElementById("add-tmpl").value,clamp(+document.getElementById("add-n").value||1,1,12),S.act+":"+SECTIONS[S.act]()[0].id)),
 "clear-dead":()=>upd(()=>S.foes=S.foes.filter(f=>!f.dead)),
 "clear-foes":()=>upd(()=>{S.foes=[];foeRoll.res=null;openFoe=null}),
 "cd-pip":o=>upd(()=>{const c=S.cds.find(x=>x.id===o.id),n=+o.i+1;c.v=c.v===n?n-1:n}),
 "cd-tick":o=>upd(()=>{const c=S.cds.find(x=>x.id===o.id);c.v=clamp(c.v+(+o.k),0,c.max);log(`${c.name}: ${c.v}`)}),
 "cd-del":o=>upd(()=>S.cds=S.cds.filter(c=>c.id!==o.id)),
 "cd-add":()=>{const n=document.getElementById("cd-name").value.trim();if(!n){toast("Dai un nome al conto");return}const m=clamp(+document.getElementById("cd-max").value||4,1,12);upd(()=>S.cds.push({id:uid(),name:n,max:m,v:m,note:""}))},
 // generatore
 "scn-done":o=>upd(()=>{S.scn[o.k]=true;scnOpen.delete(o.k);const [a,id]=o.k.split(":");log(`Scena ${sceneNum(a,id)} conclusa`);setTimeout(()=>document.getElementById("end-"+o.k.replace(/[:.]/g,"_"))?.scrollIntoView({behavior:"smooth",block:"center"}),0)}),
 "scn-reopen":o=>upd(()=>{delete S.scn[o.k];scnOpen.set(o.k,true);toast("Scena riaperta: gli effetti dell'esito precedente restano applicati")}),
 "scn-end-ask":o=>{endAsk=o.k;composer=null;render()},
 "scn-end-no":()=>{endAsk=null;composer=null;render()},
 "scn-out":o=>{const opt=(OUT[o.k]||DEFAULT_OUT).opts().find(x=>x.k===o.o);if(!opt)return;let pc="";
  if(opt.pick){pc=document.getElementById("out-pc")?.value||"";if(!pc){toast("Scegli il PG che accetta il patto");return}}
  opt.apply(pc);const label=opt.l+(pc?` (${pcName(pc)})`:"");
  S.out[o.k]=label;S.scn[o.k]=true;endAsk=null;composer=null;scnOpen.delete(o.k);
  const [a,id]=o.k.split(":");
  if(o.c&&o.c.startsWith("dev:")){const dv=S.devs.find(x=>x.id===o.c.slice(4));if(dv){dv.done=true;dv.outL="Si torna alla trama: "+label;scnOpen.delete(o.c)}}
  log(`Scena ${sceneNum(a,id)} conclusa: ${label}`,"ok");
  const nx=nextScene(a,id);if(nx)goToScene(nx.act+":"+nx.s.id);else{persist();render();toast("Fine dell'avventura")}},
 "out-imp":o=>{composer={where:o.k,from:o.c};render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "dev-end-ask":o=>{endAsk="dev:"+o.id;render()},
 "scn-fold":o=>{scnOpen.set(o.k,false);render()},
 "scn-next":o=>{const [a,id]=o.k.split(":");scnOpen.set(o.k,true);if(a!==S.act){A.goact({k:a})}else{render()}setTimeout(()=>document.getElementById(`scn-${a.replace(".","_")}-${id}`)?.scrollIntoView({behavior:"smooth",block:"start"}),30)},
 "dev-done":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);dv.done=true;scnOpen.delete("dev:"+dv.id);log(`Scena improvvisata conclusa: ${parseDev(dv.raw).titolo||""}`);setTimeout(()=>document.getElementById("end-"+dv.where.replace(/[:.]/g,"_"))?.scrollIntoView({behavior:"smooth",block:"center"}),0)}),
 "dev-reopen":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);dv.done=false;scnOpen.set("dev:"+dv.id,true)}),
 "dev-edit":o=>{composer={where:"re:"+o.id};const dv=S.devs.find(x=>x.id===o.id);if(dv)G.kind=dv.kind||G.kind;scnOpen.set("dev:"+o.id,true);render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "gen-open":o=>{composer={where:o.w};render();setTimeout(()=>document.getElementById("gen-txt")?.focus(),0)},
 "gen-close":()=>{composer=null;render()},
 "g-kind":o=>{const t=document.getElementById("gen-txt")?.value;G.kind=o.k;render();const e=document.getElementById("gen-txt");if(e&&t!=null)e.value=t},
 "gen-go":o=>{const t=(document.getElementById("gen-txt")?.value||"").trim();
  if(!o.w.startsWith("re:")&&composer&&composer.from){const from=composer.from;
   if(from.startsWith("dev:")){const dv=S.devs.find(x=>x.id===from.slice(4));if(dv){dv.done=true;dv.outL="Altro imprevisto";scnOpen.delete(from)}}
   else if(!S.scn[o.w]){S.scn[o.w]=true;S.out[o.w]="Deviazione improvvisata";scnOpen.delete(o.w)}
   endAsk=null}
  if(o.w.startsWith("re:")){const dv=S.devs.find(x=>x.id===o.w.slice(3));if(dv)generate(dv.where,t,G.kind,dv.id)}else generate(o.w,t,G.kind)},
 "gen-stop":()=>G.ctrl?.abort(),
 "dev-polish":o=>polishDev(o.id),
 "dev-regen":o=>{const dv=S.devs.find(x=>x.id===o.id);if(dv&&!G.busy)generate(dv.where,dv.user,dv.kind,dv.id)},
 "dev-choice":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);if(!dv||dv.choice!=null)return;const c=parseDev(dv.raw).scelte[+o.i];if(!c)return;
  const fx=parseFx((c.slice(1).join("|").match(/EFFETTI\s*:(.*)$/i)||[,""])[1]);dv.choice=+o.i;log(`Scelta: ${c[0]}`,"ok");applyFx(fx,`scelta «${c[0]}»`)}),
 "dev-res":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);if(!dv||dv.res)return;const p=parseDev(dv.raw);const r=splitFx(o.k==="s"?p.successo:p.fallimento);dv.res=o.k;log(`Esito della scena improvvisata: ${o.k==="s"?"successo":"fallimento"}`);applyFx(r.fx,o.k==="s"?"successo della scena":"fallimento della scena")}),
 "dev-del":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);S.devs=S.devs.filter(x=>x!==dv);if(dv)S.foes=S.foes.filter(f=>f.where!==dv.act+":dev:"+dv.id)}),
 "dev-foe":o=>upd(()=>{picker=null;const dv=S.devs.find(x=>x.id===o.id);const r=parseDev(dv.raw).avv[+o.i];if(!r)return;const thr=String(r[4]||"").split("/").map(x=>parseInt(x));
  const dmg=(String(r[9]||"").match(/\d*d\d+\s*[+-]?\s*\d*/)||[""])[0].replace(/\s/g,"");
  const src={name:r[0],tier:1,type:r[1]||"Standard",diff:parseInt(r[3])||12,thr:[isNaN(thr[0])?null:thr[0],isNaN(thr[1])?null:thr[1]],hp:clamp(parseInt(r[5])||3,1,12),st:clamp(parseInt(r[6])||1,0,6),atk:parseInt(r[7])||0,
   attack:{n:(r[8]||"Attacco").split(/[·,(]/)[0].trim(),r:((r[8]||"").match(/Molto Vicina|Molto Lontana|Mischia|Vicina|Lontana/i)||["Mischia"])[0],d:dmg||"1d6+2",ty:/mag/i.test(r[9]||"")?"mag":"fis"},
   feats:r.slice(10).filter(Boolean).map(x=>{const [n,...rest]=x.split(":");return {n:n.trim(),k:"Azione",x:rest.join(":").trim()||x}}),minion:/minion|gregar/i.test(r[1]||""),desc:parseDev(dv.raw).titolo||""};
  const n=clamp(parseInt(r[2])||1,1,10);for(let i=0;i<n;i++)S.foes.push(mkFoe(src,dv.act+":dev:"+dv.id,n>1?` #${i+1}`:""));log(`In scena: ${n>1?n+"× ":""}${src.name}`)}),
 "dev-npc":o=>upd(()=>{picker=null;const dv=S.devs.find(x=>x.id===o.id);const r=parseDev(dv.raw).png[+o.i];if(!r)return;
  S.foes.push(mkFoe({name:r[0],type:"PNG",desc:r[1]||"",mot:r[2]||"",diff:parseInt(r[3])||12,feats:[]},dv.act+":dev:"+dv.id,""));log(`In scena: ${r[0]}`)}),
 "dev-cd":o=>upd(()=>{const dv=S.devs.find(x=>x.id===o.id);const c=parseDev(dv.raw).conti[+o.i];if(!c)return;const m=clamp(parseInt(c[1])||4,1,12);S.cds.push({id:uid(),name:c[0],max:m,v:m,note:c[2]||""});toast("Conto aggiunto nella scheda Scontro")}),
 // viste e schermo
 "view-mode":o=>{if(o.k==="gm"&&!VIEW.canGM)return;VIEW.mode=o.k;saveView();render();top0()},
 "view-pc":o=>{VIEW.pc=o.k||null;saveView();render();top0()},
 fullscreen:()=>{if(document.fullscreenElement){document.exitFullscreen?.();return}
  const p=document.documentElement.requestFullscreen?.();if(p?.catch)p.catch(()=>toast("Usa lo schermo intero del browser (F11)"));else if(!p)toast("Usa lo schermo intero del browser (F11)")},
 "scr-opt":(o,b)=>setScreen({[o.k]:b.checked}),
 "scr-title":()=>{const c=curSceneTitle();setScreen({kind:"title",title:c.scene,sub:c.act,gid:null,caption:""})},
 "scr-splash":()=>setScreen({kind:"splash",gid:null}),
 "scr-blank":()=>setScreen({kind:"blank",gid:null}),
 "scr-cap-clear":()=>setScreen({caption:""}),
 "gal-show":o=>{const g=VIEW.gallery.find(x=>x.gid===o.k);if(g)setScreen({kind:"img",gid:g.gid,id:g.id||null,url:VIEW.tdb?g.url:"",title:g.title})},
 "gal-del-ask":o=>{VIEW.delAsk=o.k;render()},
 "gal-del-no":()=>{VIEW.delAsk=null;render()},
 "gal-del":o=>{const g=VIEW.gallery.find(x=>x.gid===o.k);VIEW.delAsk=null;if(!g)return;
  VIEW.gallery=VIEW.gallery.filter(x=>x!==g);saveGallery();
  if(VIEW.tdb&&g.id&&VIEW.assets)VIEW.assets.delete(g.id).catch(()=>{});
  if(VIEW.screen?.gid===g.gid)setScreen({kind:"splash",gid:null});else render()},
 // diario dei giocatori
 "dy-open":()=>openDiary(),
 "dy-close":()=>closeDiary(),
 "dy-print":()=>{try{window.print()}catch(e){DY.err="La stampa non è disponibile qui: usa «Scarica il PDF».";redrawDiary()}},
 "dy-pdf":()=>{if(!DY.busy)diaryPdf()},
 "dy-claude":()=>{if(!DY.busy)diaryClaude()},
 "dy-reset":()=>{dyCfg().edits={};persist();redrawDiary()},
 reset:()=>{resetAsk=true;renderBar()},
 "reset-no":()=>{resetAsk=false;renderBar()},
 "reset-yes":()=>{resetAsk=false;S=fresh();openFoe=openPc=null;scnOpen.clear();encOpen.clear();picker=null;composer=null;deathFor=null;ROLL={cur:null,hist:[],pend:null,showHist:false};foeRoll.res=null;top0();optOpen=optReset=false;renderOpt();persist();render();toast("Partita azzerata: puoi annullare con ↶")}
};

document.addEventListener("click",e=>{
  const sum=e.target.closest("details.scn>summary");
  if(sum){const d=sum.parentElement,key=d.dataset.scn||"dev:"+d.dataset.dev;setTimeout(()=>scnOpen.set(key,d.open),0);return}
  if(e.target.closest("select,input,textarea,label")&&!e.target.closest("[data-a]")?.matches("input,select,label,button"))return;
  const b=e.target.closest("[data-a]");if(!b)return;
  const f=A[b.dataset.a];if(f){f(b.dataset,b);flushShows()}
});
// le correzioni scritte sulle pagine del diario restano salvate
document.addEventListener("focusout",e=>{const el=e.target;if(el.matches?.("[data-dy]")){dyCfg().edits[el.dataset.dy]=el.innerHTML;persist();fitDiary()}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches?.("details.enc-rules"))rulesOpen.set(d.dataset.k,d.open)},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&VIEW.mode!=="gm"&&VIEW.canGM&&!document.fullscreenElement){A["view-mode"]({k:"gm"});return}if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".mc[data-a],.enc[data-a]")){e.preventDefault();A[e.target.dataset.a](e.target.dataset)}});
document.addEventListener("change",e=>{
  const el=e.target,o=el.dataset;if(!o.f)return;const v=el.value;
  switch(o.f){
    case "pc-over":{const r=pcRaw(o.id);r.over[o.k]=clamp(+v||0,0,o.k.endsWith("Max")?12:40);const p=P(r);r.hp=Math.min(r.hp,p.hpMax);r.st=Math.min(r.st,p.stMax);r.ar=Math.min(r.ar,p.arMax);persist();render();return}
    case "foe-cond-add":{const f=foe(o.id);if(v&&f&&!f.cond.includes(v)){f.cond=toggleCond(f.cond,v,"");log(`${f.name}: ${v}`);persist();render()}return}
    case "pc-cond-add":{const r=pcRaw(o.id);if(v&&r&&!r.cond.includes(v)){r.cond=toggleCond(r.cond,v,r.id);log(`${pcName(r.id)}: ${v} attivo`);persist();render()}return}
    case "pc-notes":pcRaw(o.id).notes=v;persist();return;
    case "critter":S.critters[+o.i]=v;persist();render();return;
    case "bargain":S.flags.bargain=v;log(v?`${pcName(v)} accetta il patto dello Strixwolf`:"Nessun patto fatato","fear");persist();render();return;
    case "drownpc":drownPick=v;return;
    case "elderpc":elderPick=v;return;
    case "home-n":homeAt(+o.i).n=v;persist();return;
    case "home-note":homeAt(+o.i).note=v;persist();return;
    case "rival-note":S.rivalNote=v;persist();return;
    case "dy-group":dyCfg().group=v.trim();persist();redrawDiary();return;
    case "dy-narr":dyCfg().narrator=v.trim();persist();redrawDiary();return;
    case "dy-date":dyCfg().date=v.trim();persist();redrawDiary();return;
    case "dy-portrait":{const c=dyCfg();if(v)c.portraits[o.id]=v;else delete c.portraits[o.id];persist();redrawDiary();return}
    case "notes":S.notes=v;persist();return;
    case "rival":S.rival=v;persist();return;
    case "scr-cap":setScreen({caption:v.trim()});return;
    case "gal-title":{const g=VIEW.gallery.find(x=>x.gid===o.k);if(g){g.title=v.trim()||g.title;saveGallery()}return}
    case "gal-up":{const fs=[...el.files];el.value="";if(fs.length)uploadImages(fs);return}
  }
});
// all'avvio: la vista dei giocatori legge la campagna attiva; il GM riprende la sezione o la campagna di questa scheda
(()=>{
  if(VIEW.mode!=="gm"){S=readState(activeLocalKey());return}
  let r=null;try{r=JSON.parse(sessionStorage.getItem(ROUTEKEY)||"null")}catch(e){}
  if(r&&HUB_SECTIONS.some(x=>x.k===r.sec))APP.sec=r.sec;
  if(r&&r.view==="camp"&&campById(r.camp)){APP.view="camp";APP.camp=r.camp;S=readState(campLocalKey(r.camp));undoReset()}
})();
render();
</script>
